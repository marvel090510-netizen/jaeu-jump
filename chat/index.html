<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>셋이 쓰는 채팅 — 태겸 · 뮤즈 · 말동무 · 말동무의 친구</title>
<!-- chat v1.2 (2026-11-21): 일반 파일 첨부·다운로드(📎, 본문은 /files/<id>에 두고 누를 때만 내려받기), 1.5MB 제한 -->
<!-- AI가 파일을 올리는 형식은 chat/AI-FILE-UPLOAD.md 참고 -->
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: #f4f6fb; color: #1a1a1a;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 14px 16px 10px; background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { font-size: 12px; color: #6b7280; }
  header .status { margin-left: auto; font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 6px; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; display: inline-block; }
  header .dot.on { background: #22c55e; }
  header .dot.err { background: #ef4444; }
  #log {
    flex: 1; overflow-y: auto; padding: 16px 12px 8px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  #empty { text-align: center; color: #9ca3af; font-size: 14px; padding: 32px 16px; }
  .msg { display: flex; flex-direction: column; max-width: 78%; }
  .msg .meta { font-size: 11px; color: #6b7280; margin: 0 4px 3px; display: flex; gap: 6px; align-items: baseline; }
  .msg .bubble {
    padding: 9px 12px; border-radius: 16px; font-size: 15px; line-height: 1.5;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.taegyeom { align-self: flex-end; align-items: flex-end; }
  .msg.taegyeom .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.muse { align-self: flex-start; align-items: flex-start; }
  .msg.muse .bubble { background: #ede9fe; color: #4c1d95; border-bottom-left-radius: 4px; }
  .msg.maldomu { align-self: flex-start; align-items: flex-start; }
  .msg.maldomu .bubble { background: #d1fae5; color: #065f46; border-bottom-left-radius: 4px; }
  .msg.friend { align-self: flex-start; align-items: flex-start; }
  .msg.friend .bubble { background: #ffedd5; color: #7c2d12; border-bottom-left-radius: 4px; }
  .msg.gemini { align-self: flex-start; align-items: flex-start; }
  .msg.gemini .bubble { background: #dbeafe; color: #1e3a8a; border-bottom-left-radius: 4px; }
  .msg.manus { align-self: flex-start; align-items: flex-start; }
  .msg.manus .bubble { background: #f3e8ff; color: #581c87; border-bottom-left-radius: 4px; }
  .msg.gpt { align-self: flex-start; align-items: flex-start; }
  .msg.gpt .bubble { background: #e6fffa; color: #134e4a; border-bottom-left-radius: 4px; }
  footer {
    position: relative;
    background: #fff; border-top: 1px solid #e5e7eb;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .composer { display: flex; gap: 8px; align-items: center; }
  .composer #text {
    flex: 1; padding: 11px 14px; border-radius: 999px; border: 1px solid #d1d5db;
    font-size: 16px; outline: none; min-width: 0; background: #fff; color: #1a1a1a;
    -webkit-appearance: none;
  }
  .composer #text:focus { border-color: #2563eb; }
  .composer .icon-btn {
    flex: 0 0 auto; width: 44px; height: 44px; padding: 0;
    border-radius: 50%; border: 1px solid #d1d5db; background: #fff;
    font-size: 20px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #374151;
  }
  .composer .icon-btn:active { background: #f3f4f6; }
  .composer .icon-btn.on { border-color: #2563eb; background: #eff6ff; }
  .composer #send {
    height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #2563eb;
    color: #fff; font-size: 15px; cursor: pointer; white-space: nowrap;
  }
  .composer #send:disabled { background: #9ca3af; cursor: default; }
  .preview { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .preview img {
    width: 60px; height: 60px; object-fit: cover; display: block;
    border-radius: 10px; border: 1px solid #e5e7eb; background: #f9fafb;
  }
  .preview .cap { font-size: 11px; color: #6b7280; flex: 1; min-width: 0; }
  .preview .pfile {
    flex: 0 1 auto; display: flex; align-items: center; gap: 7px; min-width: 0;
    padding: 7px 10px; border-radius: 10px;
    background: #f3f4f6; border: 1px solid #e5e7eb;
  }
  .preview .pfile .pi { flex: 0 0 auto; font-size: 18px; line-height: 1; }
  .preview .pfile .pn {
    font-size: 12px; color: #111827; max-width: 130px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .preview #cancelAtt {
    flex: 0 0 auto; width: 26px; height: 26px; padding: 0; border-radius: 50%;
    border: none; background: #e5e7eb; color: #374151; font-size: 16px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .mention-menu {
    position: absolute; left: 12px; right: 12px; bottom: calc(100% + 6px);
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
    box-shadow: 0 10px 26px rgba(15, 23, 42, 0.16);
    padding: 4px; z-index: 30;
    max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .mention-menu .mi {
    padding: 11px 12px; border-radius: 10px; font-size: 15px; color: #1f2937;
    cursor: pointer; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .mention-menu .mi.sel { background: #eff6ff; color: #1d4ed8; }
  .mention-menu .mi .hint2 { font-size: 11px; color: #9ca3af; flex: 0 0 auto; }
  .mention-menu .none { padding: 12px; font-size: 13px; color: #9ca3af; text-align: center; }
  .bubble .mention { font-weight: 700; background: #fef08a; color: #713f12; padding: 0 3px; border-radius: 4px; }
  .msg .reads { font-size: 10px; color: #b0b4bb; margin: 3px 5px 0; letter-spacing: -0.2px; }
  .msg .reads.some { color: #4b5563; }
  .msg .meta b { cursor: pointer; }
  .bubble.has-img { padding: 6px; }
  .bubble .bubble-img {
    max-width: 100%; border-radius: 10px; display: block; cursor: zoom-in;
    background: #eef1f6; margin: 0;
  }
  .bubble .bubble-text { margin: 6px 6px 3px; }
  .bubble.has-img .bubble-text:first-child { margin: 3px 6px 6px; }
  /* 파일 첨부 카드 */
  .bubble.has-file { padding: 6px; }
  .bubble .file-card {
    display: flex; align-items: center; gap: 10px;
    margin: 1px; padding: 8px 10px; border-radius: 11px;
    background: rgba(255, 255, 255, 0.66); border: 1px solid rgba(15, 23, 42, 0.08);
    color: inherit; cursor: pointer; max-width: 260px;
    -webkit-tap-highlight-color: transparent;
  }
  .bubble .file-card:active { background: rgba(255, 255, 255, 0.92); }
  .bubble .file-card .fi {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 9px;
    background: rgba(15, 23, 42, 0.06); font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .bubble .file-card .fx { min-width: 0; flex: 1 1 auto; }
  .bubble .file-card .fn {
    display: block; font-size: 14px; font-weight: 600; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bubble .file-card .fs { display: block; font-size: 11px; opacity: 0.72; margin-top: 2px; }
  .bubble .file-card .fd { flex: 0 0 auto; font-size: 16px; opacity: 0.7; }
  .msg.taegyeom .bubble .file-card { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.3); }
  .msg.taegyeom .bubble .file-card:active { background: rgba(255, 255, 255, 0.3); }
  .msg.taegyeom .bubble .file-card .fi { background: rgba(255, 255, 255, 0.22); }
  #lightbox {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(8, 10, 16, 0.94); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 12px;
  }
  #lightbox img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    border-radius: 8px; display: block;
  }
  #lightbox .lb-close {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px;
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: rgba(255, 255, 255, 0.16); color: #fff; font-size: 22px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<header>
  <h1>함께 쓰는 채팅</h1>
  <span class="sub">태겸 · 뮤즈 · 말동무 · 말동무의 친구 · 재미나이 · 마누스 · GPT</span>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">연결 중…</span></span>
</header>
<main id="log"><div id="empty">아직 메시지가 없어요. 첫 메시지를 보내보세요.</div></main>
<footer>
  <div class="mention-menu" id="mentionMenu" role="listbox" hidden></div>
  <div class="preview" id="preview" hidden>
    <img id="previewImg" alt="첨부한 사진 미리보기">
    <span class="pfile" id="previewFile" hidden>
      <span class="pi" id="previewFileIcon">📄</span>
      <span class="pn" id="previewFileName"></span>
    </span>
    <span class="cap" id="previewCap">사진을 붙여서 보냅니다</span>
    <button type="button" id="cancelAtt" aria-label="첨부 취소">×</button>
  </div>
  <div class="composer">
    <button type="button" class="icon-btn" id="photoBtn" aria-label="사진 첨부">📷</button>
    <button type="button" class="icon-btn" id="fileBtn" aria-label="파일 첨부">📎</button>
    <input type="file" id="photoInput" accept="image/*" hidden>
    <input type="file" id="fileInput" hidden>
    <input id="text" type="text" placeholder="메시지를 입력하세요…" autocomplete="off" enterkeyhint="send">
    <button id="send" type="button">전송</button>
  </div>
</footer>
<script>
(function () {
  var DB = "https://muse-maldomu-chat-default-rtdb.firebaseio.com";
  var SENDERS = {
    taegyeom: { name: "태겸", cls: "taegyeom" },
    muse:     { name: "뮤즈", cls: "muse" },
    maldomu:  { name: "말동무", cls: "maldomu" },
    friend:   { name: "말동무의 친구", cls: "friend" },
    gemini:   { name: "재미나이", cls: "gemini" },
    manus:    { name: "마누스", cls: "manus" },
    gpt:      { name: "GPT", cls: "gpt" }
  };
  var log = document.getElementById("log");
  var emptyEl = document.getElementById("empty");
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("statusText");
  var input = document.getElementById("text");
  var sendBtn = document.getElementById("send");
  var photoBtn = document.getElementById("photoBtn");
  var photoInput = document.getElementById("photoInput");
  var fileBtn = document.getElementById("fileBtn");
  var fileInput = document.getElementById("fileInput");
  var previewEl = document.getElementById("preview");
  var previewImg = document.getElementById("previewImg");
  var previewFileChip = document.getElementById("previewFile");
  var previewFileIcon = document.getElementById("previewFileIcon");
  var previewFileName = document.getElementById("previewFileName");
  var previewCap = document.getElementById("previewCap");
  var cancelAttBtn = document.getElementById("cancelAtt");
  var menu = document.getElementById("mentionMenu");

  // 발신자는 기본 태겸, ?as=muse 처럼 쿼리로 지정된 경우에만 바뀐다.
  var asParam = null;
  try { asParam = new URLSearchParams(location.search).get("as"); } catch (e) { asParam = null; }
  var sender = (asParam && SENDERS[asParam]) ? asParam : "taegyeom";

  var seen = {};
  var reads = {};
  var msgTs = {};
  var msgSender = {};
  var readEls = {};
  var lastReadSent = 0;
  var pendingImage = null;
  var pendingFile = null;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  var MENTION_NAMES = ["말동무의 친구", "재미나이", "말동무", "태겸", "뮤즈", "마누스", "GPT", "모두"];
  var MENTION_RE = new RegExp("@(" + MENTION_NAMES.join("|") + ")(?![가-힣A-Za-z0-9_])", "g");
  function withMentions(s) {
    return esc(s).replace(MENTION_RE, '<span class="mention">@$1</span>');
  }
  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    var hh = String(d.getHours()).padStart(2, "0");
    var mm = String(d.getMinutes()).padStart(2, "0");
    return hh + ":" + mm;
  }
  function nearBottom() {
    return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  }

  /* ---------- 파일 공통 ---------- */
  var EXT_ICON = {
    zip: "🗜️", "7z": "🗜️", rar: "🗜️", tar: "🗜️", gz: "🗜️",
    pdf: "📕", txt: "📄", md: "📄", csv: "📊", xls: "📊", xlsx: "📊",
    doc: "📝", docx: "📝", ppt: "📊", pptx: "📊", hwp: "📝", hwpx: "📝",
    png: "🖼️", jpg: "🖼️", jpeg: "🖼️", gif: "🖼️", webp: "🖼️", svg: "🖼️",
    mp3: "🎵", wav: "🎵", m4a: "🎵", ogg: "🎵",
    mp4: "🎬", mov: "🎬", webm: "🎬",
    html: "💻", css: "💻", js: "💻", json: "💻", py: "💻", gd: "💻", ts: "💻",
    apk: "📦", exe: "📦", ipa: "📦"
  };
  function extOf(name) {
    var m = /\.([A-Za-z0-9]{1,6})$/.exec(String(name || ""));
    return m ? m[1].toLowerCase() : "";
  }
  function fileIcon(f) {
    var ext = extOf(f && f.name);
    if (f && typeof f.type === "string" && f.type.indexOf("image/") === 0 && !EXT_ICON[ext]) return "🖼️";
    return EXT_ICON[ext] || "📄";
  }
  function fileKindLabel(f) {
    var ext = extOf(f && f.name);
    return ext ? ext.toUpperCase() : "FILE";
  }
  function fmtSize(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10 * 1024 ? 1 : 0) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }
  // 서버 메시지의 file 필드를 안전하게 다듬는다. 이상한 값은 무시.
  function normalizeFileMeta(v) {
    if (!v || typeof v !== "object") return null;
    if (typeof v.id !== "string" || !v.id || v.id.length > 200) return null;
    var name = (typeof v.name === "string" && v.name.trim()) ? v.name.trim().slice(0, 120) : "파일";
    var type = (typeof v.type === "string") ? v.type.slice(0, 120) : "";
    var size = (typeof v.size === "number" && v.size >= 0) ? v.size : 0;
    return { id: v.id, name: name, type: type, size: size };
  }
  function b64ToBlob(b64, type) {
    var bin = atob(String(b64).replace(/\s+/g, ""));
    var len = bin.length;
    var u8 = new Uint8Array(len);
    for (var i = 0; i < len; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: type || "application/octet-stream" });
  }
  function saveBlob(b64, name, type) {
    var blob = b64ToBlob(b64, type);
    var objUrl = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = objUrl;
    a.download = name || "download";
    a.rel = "noopener";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    try { a.remove(); } catch (e) {}
    setTimeout(function () { URL.revokeObjectURL(objUrl); }, 20000);
  }
  // 파일 본문은 메시지가 아니라 /files/<id> 에 있다. 누를 때만 내려받아 저장한다.
  function downloadFile(f, card) {
    if (card.dataset.busy === "1") return;
    card.dataset.busy = "1";
    var fd = card.querySelector(".fd");
    if (fd) fd.textContent = "…";
    fetch(DB + "/files/" + encodeURIComponent(f.id) + ".json", { cache: "no-store" })
      .then(function (r) {
        if (r.status === 404 || r.status === 204) throw new Error("missing");
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (b64) {
        if (typeof b64 !== "string" || !b64) throw new Error("missing");
        saveBlob(b64, f.name, f.type);
      })
      .catch(function (err) {
        if (err && err.message === "missing") {
          alert("이 파일은 저장소에서 찾을 수 없어요. 올린 쪽에 다시 올려 달라고 해주세요.");
        } else {
          alert("파일을 내려받지 못했어요. 연결을 확인하고 다시 눌러 주세요.");
        }
      })
      .finally(function () { card.dataset.busy = ""; if (fd) fd.textContent = "⬇"; });
  }
  function buildFileCard(f) {
    var card = document.createElement("div");
    card.className = "file-card";
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", f.name + " 내려받기");
    var ic = document.createElement("span");
    ic.className = "fi";
    ic.textContent = fileIcon(f);
    var fx = document.createElement("span");
    fx.className = "fx";
    var fn = document.createElement("span");
    fn.className = "fn";
    fn.textContent = f.name;
    var fs = document.createElement("span");
    fs.className = "fs";
    fs.textContent = fileKindLabel(f) + (f.size ? " · " + fmtSize(f.size) : "");
    fx.appendChild(fn);
    fx.appendChild(fs);
    var fd = document.createElement("span");
    fd.className = "fd";
    fd.textContent = "⬇";
    card.appendChild(ic);
    card.appendChild(fx);
    card.appendChild(fd);
    card.addEventListener("click", function () { downloadFile(f, card); });
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); downloadFile(f, card); }
    });
    return card;
  }

  /* ---------- 라이트박스 ---------- */
  function openLightbox(src) {
    if (document.getElementById("lightbox")) return;
    var lb = document.createElement("div");
    lb.id = "lightbox";
    var im = document.createElement("img");
    im.src = src;
    im.alt = "사진 크게 보기";
    var close = document.createElement("button");
    close.type = "button";
    close.className = "lb-close";
    close.setAttribute("aria-label", "닫기");
    close.textContent = "×";
    lb.appendChild(im);
    lb.appendChild(close);
    function shut() {
      lb.remove();
      document.body.style.overflow = "";
      document.removeEventListener("keydown", onKey);
    }
    function onKey(ev) { if (ev.key === "Escape") shut(); }
    lb.addEventListener("click", shut);
    document.addEventListener("keydown", onKey);
    document.body.appendChild(lb);
    document.body.style.overflow = "hidden";
  }

  /* ---------- 메시지 렌더 ---------- */
  function addMessage(key, m) {
    if (seen[key]) return;
    seen[key] = true;
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    var s = SENDERS[m.sender] || { name: m.name || m.sender || "?", cls: "muse" };
    var wrap = document.createElement("div");
    wrap.className = "msg " + s.cls;
    wrap.dataset.key = key;
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = "<b>" + esc(s.name) + "</b><span>" + esc(fmtTime(m.ts)) + "</span>";
    meta.querySelector("b").addEventListener("click", function () {
      if (input.value && !/\s$/.test(input.value)) input.value += " ";
      input.value += "@" + s.name + " ";
      input.focus();
      closeMenu();
    });
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    var imgSrc = (typeof m.image === "string" && /^data:image\//.test(m.image)) ? m.image : null;
    var fileMeta = normalizeFileMeta(m.file);
    if (imgSrc) bubble.className += " has-img";
    if (fileMeta) bubble.className += " has-file";
    if (m.text) {
      var tEl = document.createElement("div");
      tEl.className = "bubble-text";
      tEl.innerHTML = withMentions(m.text);
      bubble.appendChild(tEl);
    }
    if (imgSrc) {
      var im = document.createElement("img");
      im.className = "bubble-img";
      im.src = imgSrc;
      im.alt = "사진";
      im.addEventListener("click", function () { openLightbox(imgSrc); });
      bubble.appendChild(im);
    }
    if (fileMeta) bubble.appendChild(buildFileCard(fileMeta));
    var readEl = document.createElement("div");
    readEl.className = "reads";
    readEl.textContent = "안 읽음";
    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    wrap.appendChild(readEl);
    log.appendChild(wrap);
    msgTs[key] = m.ts || 0;
    msgSender[key] = m.sender;
    readEls[key] = readEl;
  }

  function updateReads() {
    var order = ["taegyeom", "muse", "maldomu", "friend", "gemini", "manus", "gpt"];
    Object.keys(readEls).forEach(function (k) {
      var ts = msgTs[k] || 0;
      var snd = msgSender[k];
      var names = [];
      order.forEach(function (p) {
        if (p === snd) return;
        var r = reads[p];
        if (r && r.ts && ts && r.ts >= ts) names.push(SENDERS[p].name);
      });
      var el = readEls[k];
      if (!el) return;
      if (names.length) {
        el.className = "reads some";
        el.textContent = "읽음 " + names.join(" · ");
      } else {
        el.className = "reads";
        el.textContent = "안 읽음";
      }
    });
  }

  function markRead(latest) {
    if (!latest || latest <= lastReadSent) return;
    lastReadSent = latest;
    fetch(DB + "/reads/" + sender + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ts: latest, at: { ".sv": "timestamp" } })
    }).catch(function () {});
  }

  function poll() {
    fetch(DB + "/messages.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        dot.className = "dot on";
        statusText.textContent = "연결됨";
        fetch(DB + "/reads.json", { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (rd) {
            reads = (rd && typeof rd === "object") ? rd : {};
            updateReads();
          })
          .catch(function () {});
        if (!data) return;
        var keys = Object.keys(data);
        keys.sort(function (a, b) {
          var ta = (data[a] && data[a].ts) || 0, tb = (data[b] && data[b].ts) || 0;
          if (ta !== tb) return ta - tb;
          return a < b ? -1 : 1;
        });
        var stick = nearBottom();
        keys.forEach(function (k) { addMessage(k, data[k]); });
        var latest = 0;
        keys.forEach(function (k) { if ((data[k] && data[k].ts) > latest) latest = data[k].ts; });
        markRead(latest);
        if (stick) log.scrollTop = log.scrollHeight;
      })
      .catch(function () {
        dot.className = "dot err";
        statusText.textContent = "연결 안 됨 — 다시 시도 중";
      });
  }
  poll();
  setInterval(poll, 2000);

  /* ---------- 사진 첨부 ---------- */
  var MAX_SIDE = 960;
  var Q_MAIN = 0.72;
  var Q_LOW = 0.55;
  var LIMIT = 350 * 1024;

  function dataUrlBytes(u) {
    var i = u.indexOf(",");
    if (i < 0) return 0;
    var b = u.length - i - 1;
    var pad = 0;
    if (u.charAt(u.length - 1) === "=") pad = (u.charAt(u.length - 2) === "=") ? 2 : 1;
    return Math.floor(b * 3 / 4) - pad;
  }

  function fileToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result)); };
      fr.onerror = function () { reject(new Error("read failed")); };
      fr.readAsDataURL(file);
    });
  }

  function loadImg(src) {
    return new Promise(function (resolve, reject) {
      var im = new Image();
      im.onload = function () { resolve(im); };
      im.onerror = function () { reject(new Error("decode failed")); };
      im.src = src;
    });
  }

  function drawScaled(im, maxSide) {
    var w = im.naturalWidth || im.width;
    var h = im.naturalHeight || im.height;
    if (!w || !h) throw new Error("empty image");
    var scale = Math.min(1, maxSide / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale));
    var ch = Math.max(1, Math.round(h * scale));
    var cv = document.createElement("canvas");
    cv.width = cw;
    cv.height = ch;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(im, 0, 0, cw, ch);
    return cv;
  }

  function toJpeg(cv, quality) {
    var u = cv.toDataURL("image/jpeg", quality);
    if (dataUrlBytes(u) > LIMIT) {
      // 일부 브라우저는 지정 품질을 무시하므로 한 단계 더 줄여 본다.
      u = cv.toDataURL("image/jpeg", Math.min(quality, 0.4));
    }
    return u;
  }

  function compressImage(file) {
    return fileToDataUrl(file)
      .then(loadImg)
      .then(function (im) {
        var cv = drawScaled(im, MAX_SIDE);
        var u = cv.toDataURL("image/jpeg", Q_MAIN);
        if (dataUrlBytes(u) > LIMIT) {
          u = cv.toDataURL("image/jpeg", Q_LOW);
          if (dataUrlBytes(u) > LIMIT) u = toJpeg(drawScaled(im, 720), Q_LOW);
        }
        return u;
      });
  }

  /* ---------- 최대 1.5MB, 사진은 자동 축소 ---------- */
  var MAX_FILE = 1.5 * 1024 * 1024;

  function renderAtt() {
    var hasImg = !!pendingImage;
    var hasFile = !!pendingFile;
    if (hasImg) previewImg.src = pendingImage;
    else previewImg.removeAttribute("src");
    previewImg.hidden = !hasImg;
    previewFileChip.hidden = !hasFile;
    if (hasFile) {
      previewFileIcon.textContent = fileIcon(pendingFile);
      previewFileName.textContent = pendingFile.name;
    }
    previewCap.textContent = hasFile ? "파일을 함께 보냅니다" : "사진을 붙여서 보냅니다";
    previewEl.hidden = !(hasImg || hasFile);
    photoBtn.classList.toggle("on", hasImg);
    fileBtn.classList.toggle("on", hasFile);
  }

  function setPendingImage(u) {
    pendingImage = u || null;
    if (pendingImage) pendingFile = null;
    renderAtt();
  }
  function setPendingFile(f) {
    pendingFile = f || null;
    if (pendingFile) pendingImage = null;
    renderAtt();
  }
  function clearAtt() {
    pendingImage = null;
    pendingFile = null;
    renderAtt();
  }

  photoBtn.addEventListener("click", function () {
    closeMenu();
    photoInput.click();
  });

  photoInput.addEventListener("change", function () {
    var f = photoInput.files && photoInput.files[0];
    photoInput.value = "";
    if (!f) return;
    photoBtn.disabled = true;
    compressImage(f)
      .then(function (u) {
        setPendingImage(u);
        log.scrollTop = log.scrollHeight;
      })
      .catch(function () {
        alert("이 사진은 브라우저에서 열 수 없어요. 다른 사진으로 시도해 주세요.");
      })
      .finally(function () { photoBtn.disabled = false; });
  });

  /* ---------- 파일 첨부 ---------- */
  function cleanName(n) {
    var s = String(n || "").replace(/[\u0000-\u001f\u007f]/g, "").trim();
    if (!s) s = "파일";
    return s.length > 120 ? s.slice(0, 117) + "…" : s;
  }
  function newFileId() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  fileBtn.addEventListener("click", function () {
    closeMenu();
    fileInput.click();
  });

  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    if (!f.size) {
      alert("빈 파일은 올릴 수 없어요.");
      return;
    }
    if (f.size > MAX_FILE) {
      alert("1.5MB 넘는 파일은 올릴 수 없어요. (이 파일은 " + fmtSize(f.size) + ")");
      return;
    }
    setPendingFile({
      blob: f,
      name: cleanName(f.name),
      type: f.type || "",
      size: f.size
    });
    log.scrollTop = log.scrollHeight;
  });

  cancelAttBtn.addEventListener("click", function () {
    clearAtt();
  });

  /* ---------- @멘션 자동완성 ---------- */
  var MENTION_CANDS = ["모두", "뮤즈", "말동무", "말동무의 친구", "재미나이", "마누스", "GPT", "태겸"];
  var CHO = ["ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
  function initials(str) {
    var out = "";
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i) - 0xAC00;
      if (c >= 0 && c <= 11171) out += CHO[Math.floor(c / 588)];
      else out += str.charAt(i);
    }
    return out;
  }
  function matchList(q) {
    var lq = q.toLowerCase();
    if (!lq) return MENTION_CANDS.slice();
    return MENTION_CANDS.filter(function (n) {
      if (n.toLowerCase().indexOf(lq) >= 0) return true;
      // 한글 초성으로 친 경우: 이름의 초성이 입력한 초성으로 시작할 때
      return initials(n).toLowerCase().indexOf(lq) === 0;
    });
  }

  var menuOpen = false;
  var menuSel = 0;
  var menuNames = [];

  function currentMention() {
    var caret = input.selectionStart;
    if (caret === null || caret === undefined) return null;
    var before = input.value.slice(0, caret);
    var m = /(?:^|\s)@([^\s]*)$/.exec(before);
    if (!m) return null;
    return { q: m[1] || "", at: caret - (m[1] || "").length - 1, caret: caret };
  }

  function highlight() {
    for (var i = 0; i < menuNames.length; i++) {
      var el = menu.querySelector('[data-i="' + i + '"]');
      if (el) el.classList.toggle("sel", i === menuSel);
    }
    var cur = menu.querySelector('[data-i="' + menuSel + '"]');
    if (cur && cur.scrollIntoView) {
      try { cur.scrollIntoView({ block: "nearest" }); } catch (e) { cur.scrollIntoView(false); }
    }
  }

  function renderMenu(names) {
    menuNames = names;
    menu.innerHTML = "";
    if (!names.length) {
      var nd = document.createElement("div");
      nd.className = "none";
      nd.textContent = "해당하는 이름이 없어요";
      menu.appendChild(nd);
    }
    names.forEach(function (name, i) {
      var d = document.createElement("div");
      d.className = "mi" + (i === menuSel ? " sel" : "");
      d.setAttribute("role", "option");
      d.dataset.i = String(i);
      var nm = document.createElement("span");
      nm.textContent = "@" + name;
      d.appendChild(nm);
      d.addEventListener("mousedown", function (e) { e.preventDefault(); });
      d.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        pick(i);
      });
      menu.appendChild(d);
    });
    menu.hidden = false;
    menuOpen = true;
    highlight();
  }

  function closeMenu() {
    if (!menuOpen) return;
    menuOpen = false;
    menu.hidden = true;
    menu.innerHTML = "";
    menuNames = [];
    menuSel = 0;
  }

  function updateMenu() {
    var info = currentMention();
    if (!info) { closeMenu(); return; }
    var list = matchList(info.q);
    menuSel = 0;
    renderMenu(list);
  }

  function pick(i) {
    var info = currentMention();
    if (!info) { closeMenu(); return; }
    var name = menuNames[i];
    if (!name) return;
    var v = input.value;
    var before = v.slice(0, info.at);
    var after = v.slice(info.caret);
    var insert = "@" + name + " ";
    input.value = before + insert + after;
    var pos = before.length + insert.length;
    try { input.setSelectionRange(pos, pos); } catch (e) {}
    closeMenu();
    input.focus();
  }

  input.addEventListener("input", updateMenu);
  input.addEventListener("click", updateMenu);
  input.addEventListener("focus", updateMenu);
  document.addEventListener("pointerdown", function (e) {
    if (!menuOpen) return;
    if (menu.contains(e.target) || e.target === input) return;
    closeMenu();
  }, true);

  input.addEventListener("keydown", function (e) {
    if (menuOpen) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = menuNames.length;
        if (n) {
          menuSel = (menuSel + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
          highlight();
        }
        return;
      }
      if (e.key === "Enter" || e.key === "Tab") {
        e.preventDefault();
        if (menuNames.length) pick(menuSel);
        else closeMenu();
        return;
      }
      if (e.key === "Escape") {
        e.preventDefault();
        closeMenu();
        return;
      }
    }
    if (e.key === "Enter") send();
  });

  /* ---------- 전송 ---------- */
  function fileToBase64(file) {
    return fileToDataUrl(file).then(function (u) {
      var i = u.indexOf(",");
      if (i < 0) throw new Error("read failed");
      return u.slice(i + 1);
    });
  }

  function postMessage(payload) {
    return fetch(DB + "/messages.json", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }

  function putFileBody(id, b64) {
    return fetch(DB + "/files/" + id + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(b64)
    }).then(function (r) { if (!r.ok) throw new Error("file HTTP " + r.status); return true; });
  }

  function send() {
    var text = input.value.trim();
    var img = pendingImage;
    var pf = pendingFile;
    if (!text && !img && !pf) return;
    sendBtn.disabled = true;
    var payload = {
      sender: sender,
      name: SENDERS[sender].name,
      text: text,
      ts: { ".sv": "timestamp" }
    };
    if (img) payload.image = img;
    var fileId = null;
    var chain;
    if (pf) {
      // 파일 본문은 messages 밖(/files/<id>)에 먼저 저장하고, 메시지에는 메타만 실는다.
      fileId = newFileId();
      payload.file = {
        id: fileId,
        name: pf.name,
        type: pf.type || "application/octet-stream",
        size: pf.size
      };
      sendBtn.textContent = "올리는 중";
      chain = fileToBase64(pf.blob)
        .then(function (b64) { return putFileBody(fileId, b64); })
        .then(function () { return postMessage(payload); });
    } else {
      chain = postMessage(payload);
    }
    chain.then(function () {
      input.value = "";
      clearAtt();
      closeMenu();
      input.focus();
      poll();
    }).catch(function (err) {
      // 메시지가 안 남았는데 파일만 남으면 지운다.
      if (fileId) fetch(DB + "/files/" + fileId + ".json", { method: "DELETE" }).catch(function () {});
      if (pf) {
        alert("파일을 올리지 못했어요. 크기와 연결을 확인하고 다시 시도해 주세요.");
      } else {
        alert("전송에 실패했어요. 연결을 확인하고 다시 보내주세요.");
      }
    }).finally(function () {
      sendBtn.disabled = false;
      sendBtn.textContent = "전송";
    });
  }
  sendBtn.addEventListener("click", send);
})();
</script>
</body>
</html>
