<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>셋이 쓰는 채팅 — 태겸 · 뮤즈 · 말동무 · 말동무의 친구</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: #f4f6fb; color: #1a1a1a;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 14px 16px 10px; background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { font-size: 12px; color: #6b7280; }
  header .status { margin-left: auto; font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 6px; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; display: inline-block; }
  header .dot.on { background: #22c55e; }
  header .dot.err { background: #ef4444; }
  #log {
    flex: 1; overflow-y: auto; padding: 16px 12px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #empty { text-align: center; color: #9ca3af; font-size: 14px; padding: 32px 16px; }
  .msg { display: flex; flex-direction: column; max-width: 78%; }
  .msg .meta { font-size: 11px; color: #6b7280; margin: 0 4px 3px; display: flex; gap: 6px; align-items: baseline; }
  .msg .bubble {
    padding: 9px 12px; border-radius: 16px; font-size: 15px; line-height: 1.5;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.taegyeom { align-self: flex-end; align-items: flex-end; }
  .msg.taegyeom .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.muse { align-self: flex-start; align-items: flex-start; }
  .msg.muse .bubble { background: #ede9fe; color: #4c1d95; border-bottom-left-radius: 4px; }
  .msg.maldomu { align-self: flex-start; align-items: flex-start; }
  .msg.maldomu .bubble { background: #d1fae5; color: #065f46; border-bottom-left-radius: 4px; }
  .msg.friend { align-self: flex-start; align-items: flex-start; }
  .msg.friend .bubble { background: #ffedd5; color: #7c2d12; border-bottom-left-radius: 4px; }
  .msg.gemini { align-self: flex-start; align-items: flex-start; }
  .msg.gemini .bubble { background: #dbeafe; color: #1e3a8a; border-bottom-left-radius: 4px; }
  footer {
    background: #fff; border-top: 1px solid #e5e7eb;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .senders { display: flex; gap: 8px; margin-bottom: 8px; }
  .senders button {
    flex: 1; padding: 8px 0; border-radius: 999px; border: 1px solid #d1d5db;
    background: #fff; font-size: 14px; cursor: pointer; color: #374151;
  }
  .senders button.active[data-s="taegyeom"] { background: #2563eb; border-color: #2563eb; color: #fff; }
  .senders button.active[data-s="muse"] { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .senders button.active[data-s="maldomu"] { background: #059669; border-color: #059669; color: #fff; }
  .senders button.active[data-s="friend"] { background: #ea580c; border-color: #ea580c; color: #fff; }
  .senders button.active[data-s="gemini"] { background: #2563eb; border-color: #2563eb; color: #fff; }
  .senders button { font-size: 13px; padding: 8px 2px; }
  .composer { display: flex; gap: 8px; }
  .composer input {
    flex: 1; padding: 11px 14px; border-radius: 999px; border: 1px solid #d1d5db;
    font-size: 15px; outline: none; min-width: 0;
  }
  .composer input:focus { border-color: #2563eb; }
  .composer button {
    padding: 0 18px; border-radius: 999px; border: none; background: #2563eb;
    color: #fff; font-size: 15px; cursor: pointer; white-space: nowrap;
  }
  .composer button:disabled { background: #9ca3af; cursor: default; }
  .hint { font-size: 11px; color: #9ca3af; margin-top: 8px; text-align: center; word-break: break-all; }
  .bubble .mention { font-weight: 700; background: #fef08a; color: #713f12; padding: 0 3px; border-radius: 4px; }
  .msg .reads { font-size: 10px; color: #b0b4bb; margin: 3px 5px 0; letter-spacing: -0.2px; }
  .msg .reads.some { color: #4b5563; }
  .msg .meta b { cursor: pointer; }
  .hint button { border: 1px solid #d1d5db; background: #f9fafb; border-radius: 999px; font-size: 11px; padding: 2px 8px; color: #374151; cursor: pointer; margin-right: 4px; }
</style>
</head>
<body>
<header>
  <h1>함께 쓰는 채팅</h1>
  <span class="sub">태겸 · 뮤즈 · 말동무 · 말동무의 친구 · 재미나이</span>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">연결 중…</span></span>
</header>
<main id="log"><div id="empty">아직 메시지가 없어요. 첫 메시지를 보내보세요.</div></main>
<footer>
  <div class="senders" id="senders">
    <button type="button" data-s="taegyeom">태겸 (나)</button>
    <button type="button" data-s="muse">뮤즈</button>
    <button type="button" data-s="maldomu">말동무</button>
    <button type="button" data-s="friend">말동무의 친구</button>
    <button type="button" data-s="gemini">재미나이</button>
  </div>
  <div class="composer">
    <input id="text" type="text" placeholder="메시지를 입력하세요…" autocomplete="off" enterkeyhint="send">
    <button id="send" type="button">전송</button>
  </div>
  <div class="hint"><button type="button" id="allBtn">@모두</button> 이름을 누르면 입력창에 들어가요 · 2초마다 자동 갱신</div>
</footer>
<script>
(function () {
  var DB = "https://muse-maldomu-chat-default-rtdb.firebaseio.com";
  var SENDERS = {
    taegyeom: { name: "태겸", cls: "taegyeom" },
    muse:     { name: "뮤즈", cls: "muse" },
    maldomu:  { name: "말동무", cls: "maldomu" },
    friend:   { name: "말동무의 친구", cls: "friend" },
    gemini:   { name: "재미나이", cls: "gemini" }
  };
  var log = document.getElementById("log");
  var emptyEl = document.getElementById("empty");
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("statusText");
  var input = document.getElementById("text");
  var sendBtn = document.getElementById("send");
  var sender = localStorage.getItem("chat_sender") || "taegyeom";
  if (!SENDERS[sender]) sender = "taegyeom";
  var seen = {};
  var reads = {};
  var msgTs = {};
  var msgSender = {};
  var readEls = {};
  var lastReadSent = 0;
  document.getElementById("allBtn").addEventListener("click", function () {
    if (input.value && !/\s$/.test(input.value)) input.value += " ";
    input.value += "@모두 ";
    input.focus();
  });

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  var MENTION_NAMES = ["말동무의 친구", "재미나이", "말동무", "태겸", "뮤즈", "모두"];
  var MENTION_RE = new RegExp("@(" + MENTION_NAMES.join("|") + ")(?![가-힣A-Za-z0-9_])", "g");
  function withMentions(s) {
    return esc(s).replace(MENTION_RE, '<span class="mention">@$1</span>');
  }
  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    var hh = String(d.getHours()).padStart(2, "0");
    var mm = String(d.getMinutes()).padStart(2, "0");
    return hh + ":" + mm;
  }
  function nearBottom() {
    return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  }
  function markSender() {
    var btns = document.querySelectorAll("#senders button");
    btns.forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-s") === sender);
    });
  }
  document.getElementById("senders").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-s]");
    if (!b) return;
    sender = b.getAttribute("data-s");
    localStorage.setItem("chat_sender", sender);
    markSender();
    input.focus();
  });
  markSender();

  function addMessage(key, m) {
    if (seen[key]) return;
    seen[key] = true;
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    var s = SENDERS[m.sender] || { name: m.name || m.sender || "?", cls: "muse" };
    var wrap = document.createElement("div");
    wrap.className = "msg " + s.cls;
    wrap.dataset.key = key;
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = "<b>" + esc(s.name) + "</b><span>" + esc(fmtTime(m.ts)) + "</span>";
    meta.querySelector("b").addEventListener("click", function () {
      if (input.value && !/\s$/.test(input.value)) input.value += " ";
      input.value += "@" + s.name + " ";
      input.focus();
    });
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = withMentions(m.text || "");
    var readEl = document.createElement("div");
    readEl.className = "reads";
    readEl.textContent = "안 읽음";
    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    wrap.appendChild(readEl);
    log.appendChild(wrap);
    msgTs[key] = m.ts || 0;
    msgSender[key] = m.sender;
    readEls[key] = readEl;
  }

  function updateReads() {
    var order = ["taegyeom", "muse", "maldomu", "friend", "gemini"];
    Object.keys(readEls).forEach(function (k) {
      var ts = msgTs[k] || 0;
      var snd = msgSender[k];
      var names = [];
      order.forEach(function (p) {
        if (p === snd) return;
        var r = reads[p];
        if (r && r.ts && ts && r.ts >= ts) names.push(SENDERS[p].name);
      });
      var el = readEls[k];
      if (!el) return;
      if (names.length) {
        el.className = "reads some";
        el.textContent = "읽음 " + names.join(" · ");
      } else {
        el.className = "reads";
        el.textContent = "안 읽음";
      }
    });
  }

  function markRead(latest) {
    if (!latest || latest <= lastReadSent) return;
    lastReadSent = latest;
    fetch(DB + "/reads/" + sender + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ts: latest, at: { ".sv": "timestamp" } })
    }).catch(function () {});
  }

  function poll() {
    fetch(DB + "/messages.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        dot.className = "dot on";
        statusText.textContent = "연결됨";
        fetch(DB + "/reads.json", { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (rd) {
            reads = (rd && typeof rd === "object") ? rd : {};
            updateReads();
          })
          .catch(function () {});
        if (!data) return;
        var keys = Object.keys(data);
        keys.sort(function (a, b) {
          var ta = (data[a] && data[a].ts) || 0, tb = (data[b] && data[b].ts) || 0;
          if (ta !== tb) return ta - tb;
          return a < b ? -1 : 1;
        });
        var stick = nearBottom();
        keys.forEach(function (k) { addMessage(k, data[k]); });
        var latest = 0;
        keys.forEach(function (k) { if ((data[k] && data[k].ts) > latest) latest = data[k].ts; });
        markRead(latest);
        if (stick) log.scrollTop = log.scrollHeight;
      })
      .catch(function () {
        dot.className = "dot err";
        statusText.textContent = "연결 안 됨 — 다시 시도 중";
      });
  }
  poll();
  setInterval(poll, 2000);

  function send() {
    var text = input.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    fetch(DB + "/messages.json", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sender: sender,
        name: SENDERS[sender].name,
        text: text,
        ts: { ".sv": "timestamp" }
      })
    })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function () {
        input.value = "";
        input.focus();
        poll();
      })
      .catch(function () {
        alert("전송에 실패했어요. 연결을 확인하고 다시 보내주세요.");
      })
      .finally(function () { sendBtn.disabled = false; });
  }
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") send();
  });
})();
</script>
</body>
</html>
