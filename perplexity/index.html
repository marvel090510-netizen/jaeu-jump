<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>성공하고싶은 재우</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1c; touch-action: none; }
  body { font-family: 'Galmuri11', 'Malgun Gothic', sans-serif; color: #e8ecf4; }
  #game { position: fixed; inset: 0; display: block; image-rendering: pixelated; }

  .screen {
    position: fixed; inset: 0; display: none; flex-direction: column;
    z-index: 20; pointer-events: auto;
  }
  .panel {
    background: rgba(12, 16, 34, 0.88);
    border: 2px solid #2c3a5c;
    box-shadow: 0 0 0 2px #10142a, 0 8px 32px rgba(0,0,0,0.6);
    padding: clamp(12px, 3vmin, 28px);
  }

  /* ---------- 타이틀 ---------- */
  #screen-title { justify-content: center; align-items: flex-start; padding-left: clamp(12px, 5vw, 90px); }
  .title-panel { max-width: min(430px, 92vw); }
  .game-title {
    font-family: 'Galmuri16', 'Galmuri11', sans-serif;
    font-size: clamp(26px, 7.2vw, 52px);
    line-height: 1.15; color: #ffe8a0;
    text-shadow: 0 3px 0 #7a5a10, 0 0 24px rgba(255, 220, 100, 0.25);
    margin-bottom: 6px; word-break: keep-all;
  }
  .game-sub {
    font-size: clamp(13px, 2.6vw, 18px); color: #a8c0f0;
    margin-bottom: clamp(14px, 3vmin, 26px);
    text-shadow: 0 2px 0 #10142a;
  }
  .menu-btn {
    display: block; width: 100%; text-align: center; cursor: pointer;
    font-family: 'Galmuri11', sans-serif;
    font-size: clamp(15px, 3vw, 19px);
    color: #fff; background: #2c5a8c; border: none;
    padding: clamp(10px, 2vmin, 14px) 18px; margin-bottom: clamp(8px, 1.6vmin, 12px);
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.25), inset 0 -4px 0 rgba(0,0,0,0.35), 0 4px 0 #142c48;
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
    transition: transform 0.06s, filter 0.06s;
  }
  .menu-btn:active { transform: translateY(3px); box-shadow: inset 0 3px 0 rgba(255,255,255,0.25), inset 0 -2px 0 rgba(0,0,0,0.35), 0 1px 0 #142c48; }
  .menu-btn.gold { background: #c8861e; box-shadow: inset 0 3px 0 rgba(255,255,255,0.3), inset 0 -4px 0 rgba(0,0,0,0.35), 0 4px 0 #7a4e08; }
  .menu-btn.dim { background: #3a3a5e; box-shadow: inset 0 3px 0 rgba(255,255,255,0.2), inset 0 -4px 0 rgba(0,0,0,0.35), 0 4px 0 #20203a; }
  .best-line { margin-top: clamp(8px, 2vmin, 14px); font-size: clamp(11px, 2.2vw, 14px); color: #9aa8c0; }
  .hint-line { margin-top: 6px; font-size: clamp(10px, 2vw, 12px); color: #a8b6cc; line-height: 1.5; }

  /* ---------- 공통 중앙 패널 ---------- */
  .center-screen { justify-content: center; align-items: center; background: rgba(5, 8, 18, 0.55); }
  .center-panel { width: min(480px, 92vw); max-height: 88vh; overflow-y: auto; }
  .panel-title { font-family: 'Galmuri14','Galmuri11',sans-serif; color: #ffe8a0; font-size: clamp(18px, 4vw, 24px); margin-bottom: 12px; }

  /* ---------- 설정 ---------- */
  .set-section { margin-bottom: 14px; }
  .set-label { font-size: clamp(12px, 2.4vw, 14px); color: #a8c0f0; margin-bottom: 6px; }
  .preset-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-opt {
    flex: 1; min-width: 90px; text-align: center; cursor: pointer;
    background: #1c2440; border: 2px solid #2c3a5c; color: #c8d8f0;
    padding: 8px 6px; font-size: clamp(11px, 2.2vw, 13px);
  }
  .preset-opt:has(input:checked) { border-color: #ffd860; color: #ffe8a0; background: #2a2a48; }
  .preset-opt input { display: none; }
  .slider-row { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 8px; margin-bottom: 6px; }
  .slider-row label { font-size: 12px; color: #c8d8f0; }
  .slider-row output { font-size: 12px; color: #9aa8c0; text-align: right; }
  input[type=range] { width: 100%; accent-color: #ffd860; height: 22px; }
  select {
    font-family: 'Galmuri11', sans-serif; background: #1c2440; color: #c8d8f0;
    border: 2px solid #2c3a5c; padding: 6px 8px; font-size: 13px; width: 100%;
  }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c8d8f0; }
  .kbd-list { font-size: 12px; color: #9aa8c0; line-height: 1.8; }
  .kbd-list b { color: #c8d8f0; }

  /* ---------- 일시정지/성공 ---------- */
  .pause-btns { display: flex; flex-direction: column; gap: 4px; }
  .suc-title {
    font-family: 'Galmuri16','Galmuri11',sans-serif;
    font-size: clamp(24px, 6vw, 40px); color: #ffe870;
    text-shadow: 0 3px 0 #7a5a10; text-align: center; margin-bottom: 10px;
  }
  .suc-stats { text-align: center; font-size: clamp(12px, 2.6vw, 15px); color: #c8d8f0; margin-bottom: 16px; line-height: 1.8; }
  .suc-stats b { color: #ffe8a0; }

  /* ---------- 터치 HUD ---------- */
  #hud-touch { position: fixed; inset: 0; z-index: 10; display: none; pointer-events: none; }
  .tbtn {
    position: absolute; pointer-events: auto; cursor: pointer;
    background-repeat: no-repeat; background-size: 100% 100%;
    border: none; outline: none; opacity: 0.92;
    transition: transform 0.05s, opacity 0.05s;
  }
  .tbtn:active { transform: scale(0.94); opacity: 1; }
  .tbtn.pressed { transform: scale(0.94); opacity: 1; }
</style>

<body>
<canvas id="game"></canvas>

<!-- 터치 컨트롤 -->
<div id="hud-touch">
  <button class="tbtn" id="tb-left" aria-label="왼쪽"></button>
  <button class="tbtn" id="tb-right" aria-label="오른쪽"></button>
  <button class="tbtn" id="tb-jump" aria-label="점프"></button>
  <button class="tbtn" id="tb-pause" aria-label="일시정지"></button>
</div>

<!-- 타이틀 -->
<div class="screen" id="screen-title">
  <div class="panel title-panel">
    <h1 class="game-title">성공하고싶은 재우</h1>
    <div class="game-sub">한 번 더, 정상까지!</div>
    <button class="menu-btn gold" id="btn-start">도전 시작하기</button>
    <button class="menu-btn" id="btn-settings">조작 설정</button>
    <div class="best-line" id="best-label">아직 기록 없음</div>
    <div class="hint-line">← → 또는 A/D 이동 · Space/↑ 점프 (길게 누르면 더 높이)<br>떨어지면 처음부터… 점프할 때마다 3%의 확률로 태초 귀환</div>
  </div>
</div>

<!-- 설정 -->
<div class="screen center-screen" id="screen-settings">
  <div class="panel center-panel">
    <div class="panel-title">조작 설정</div>

    <div class="set-section">
      <div class="set-label">조작 배치 (모바일)</div>
      <div class="preset-row">
        <label class="preset-opt"><input type="radio" name="preset" value="split">양쪽 분리</label>
        <label class="preset-opt"><input type="radio" name="preset" value="left">왼쪽 집중</label>
        <label class="preset-opt"><input type="radio" name="preset" value="right">오른쪽 집중</label>
      </div>
    </div>

    <div class="set-section">
      <div class="set-label">버튼 위치 · 크기</div>
      <select id="btnsel">
        <option value="left">왼쪽 방향키</option>
        <option value="right">오른쪽 방향키</option>
        <option value="jump">점프 버튼</option>
        <option value="pause">일시정지 버튼</option>
      </select>
      <div class="slider-row"><label for="s-x">X 이동</label><input type="range" id="s-x" min="-200" max="200" step="4"><output id="s-xv">0</output></div>
      <div class="slider-row"><label for="s-y">Y 이동</label><input type="range" id="s-y" min="-160" max="160" step="4"><output id="s-yv">0</output></div>
      <div class="slider-row"><label for="s-s">크기</label><input type="range" id="s-s" min="0.6" max="1.8" step="0.05"><output id="s-sv">1.0</output></div>
      <button class="menu-btn dim" id="btn-reset-ui" style="font-size:12px;padding:8px">기본값으로 되돌리기</button>
    </div>

    <div class="set-section">
      <div class="set-label">소리</div>
      <div class="check-row"><input type="checkbox" id="opt-mute"> <label for="opt-mute">효과음 끄기</label></div>
    </div>

    <div class="set-section">
      <div class="set-label">키보드 조작 (PC)</div>
      <div class="kbd-list">
        <b>← → / A D</b> 이동 · <b>Space / ↑ / W</b> 점프 충전 · <b>Esc / P</b> 일시정지<br>
        점프 버튼을 길게 누르면 멀리·높이 날아갑니다.
      </div>
    </div>

    <button class="menu-btn" id="btn-back">저장하고 돌아가기</button>
  </div>
</div>

<!-- 일시정지 -->
<div class="screen center-screen" id="screen-pause">
  <div class="panel center-panel" style="width:min(320px,90vw)">
    <div class="panel-title">일시정지</div>
    <div class="pause-btns">
      <button class="menu-btn gold" id="btn-resume">계속하기</button>
      <button class="menu-btn" id="btn-restart">처음부터</button>
      <button class="menu-btn dim" id="btn-home">메인 화면</button>
    </div>
  </div>
</div>

<!-- 성공 -->
<div class="screen center-screen" id="screen-success">
  <div class="panel center-panel" style="width:min(420px,92vw)">
    <div class="suc-title">정상 정복!</div>
    <div class="suc-stats" id="suc-stats"></div>
    <button class="menu-btn gold" id="btn-again">다시 도전</button>
    <button class="menu-btn dim" id="btn-home2">메인 화면</button>
  </div>
</div>

Iin98uAHGeDUR0kDQBoJOItkPZIUS2QDmHKIVY2MjAwBG8by05wjvDAAAAABJRU5ErkJggg==","icon_shield":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAKCAYAAACALL/6AAAARElEQVR42mNggAKrqhv/sWEGbAAkkbXhA1aMoQlZ8YoH/1EwVk0wDTBFMICsiTIN+DRhVYxLE17F2AKAoGL0+GCgFgAAVqfE73tIJHUAAAAASUVORK5CYII=","icon_cloud":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAKCAYAAACALL/6AAAANklEQVR42mNgoAS8+PD/PzrGq/jEjQ8YGKtGZMUrDjyAY2RNBBXj1ATTgE0xukYUTcRghsEJAMFNxeKfWFOAAAAAAElFTkSuQmCC","icon_halo":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAKCAYAAACALL/6AAAAPUlEQVR42mNgQAL/byT8x4YZsAGcEtjk8CnGqgaZ8//Dgv/IGK8GZAXIBhDU8B8KiNZAtA0k+4HoUCIlHgCcXobNvw5RUAAAAABJRU5ErkJggg==","icon_back":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAKCAYAAACALL/6AAAATElEQVR42mNgQANZViv+I2MGXACmYFbGDRSMVSOywhMLPsAxTANWxcgK0TWgaMKm4cWF/2BMtCaCGrB5Gq+z8IUU3qAlKR6wacImBwBgYscbnHF8HwAAAABJRU5ErkJggg=="};

<script>
// ============================================================
// 성공하고싶은 재우 — HTML5 정밀 플랫포머
// ============================================================
'use strict';

// ---------- 전역 ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let dpr = 1, dScale = 3, vw = 0, vh = 0; // 뷰포트(아트픽셀)
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

// iOS 노치·홈 인디케이터 등 안전영역 (CSS px / 아트픽셀)
const SAFE_CSS = { t: 0, b: 0, l: 0, r: 0 };
const SAFE = { t: 0, b: 0, l: 0, r: 0 };
function readSafeArea() {
  SAFE_CSS.t = SAFE_CSS.b = SAFE_CSS.l = SAFE_CSS.r = 0;
  if (typeof window.getComputedStyle !== 'function' || !document.body) return;
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
    'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);' +
    'padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);';
  document.body.appendChild(probe);
  const cs = window.getComputedStyle(probe);
  SAFE_CSS.t = parseFloat(cs.paddingTop) || 0;
  SAFE_CSS.b = parseFloat(cs.paddingBottom) || 0;
  SAFE_CSS.l = parseFloat(cs.paddingLeft) || 0;
  SAFE_CSS.r = parseFloat(cs.paddingRight) || 0;
  if (probe.parentNode) probe.parentNode.removeChild(probe);
}

const S = { // 게임 상태
  mode: 'title', // title | playing | paused | success | settings
  time: 0,
  jumps: 0,
  returns: 0,
  best: 0,
  prog: 0,
  shake: 0,
  flash: 0,
};

// ---------- 안전 저장소 (샌드박스 대응) ----------
const store = {
  mem: {},
  get(k) { try { return localStorage.getItem(k); } catch (e) { return this.mem[k] || null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { this.mem[k] = v; } },
};

// ---------- 설정 ----------
const DEFAULT_SETTINGS = {
  preset: 'split',
  buttons: {
    left:  { dx: 0, dy: 0, sc: 1 },
    right: { dx: 0, dy: 0, sc: 1 },
    jump:  { dx: 0, dy: 0, sc: 1 },
    pause: { dx: 0, dy: 0, sc: 1 },
  },
  muted: false,
};
let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
try { const raw = store.get('jawoo_settings'); if (raw) settings = Object.assign(settings, JSON.parse(raw)); } catch (e) {}

// ---------- 월드 ----------
const L = window.__LAYOUT__;
const WORLD_W = L.worldW;
const GROUND_Y = L.groundTopY;
const GRAV = 2600;
const CHARGE_TIME = 0.75;
const JUMP_MIN = 520, JUMP_MAX = 1250;
const PW = 14, PH = 18;

const player = {
  x: L.spawn.x, y: L.spawn.y, vx: 0, vy: 0,
  grounded: true, charge: 0, charging: false,
  face: 1, invuln: 0, shields: 0,
  platform: null, sprite: 'idle',
};

const camera = { x: WORLD_W / 2, y: GROUND_Y - 200 };

// 발판 런타임 상태
const platforms = L.platforms.map((p) => ({
  ...p,
  x0: p.x, solid: true,
  crumbleT: -1, crumbled: false, respawnT: -1,
  angle: p.spinPhase || 0, moverT: p.phase || 0,
}));

// ---------- 이벤트 정의 ----------
const EVENTS = {
  gust:      { name: '돌풍',        kind: 'danger', icon: 'wind',   dur: [11, 14], desc: '강풍이 밀어낸다!' },
  rockfall:  { name: '낙석',        kind: 'danger', icon: 'rock',   dur: [11, 14], desc: '낙석이 쏟아진다!' },
  lightning: { name: '번개 폭풍',    kind: 'danger', icon: 'bolt',   dur: [12, 15], desc: '번개가 떨어진다!' },
  quake:     { name: '지진 균열',    kind: 'danger', icon: 'quake',  dur: [9, 12],  desc: '땅이 흔들린다!' },
  fog:       { name: '암흑 안개',    kind: 'danger', icon: 'fog',    dur: [12, 15], desc: '점프 힘이 약해진다!' },
  moonlight: { name: '달빛 저중력',  kind: 'luck',   icon: 'moon',   dur: [12, 15], desc: '중력이 약해진다!' },
  starshield:{ name: '별빛 보호막',  kind: 'luck',   icon: 'shield', dur: [5, 6],   desc: '피해를 2회 막아준다!' },
  cloud:     { name: '구름 가속',    kind: 'luck',   icon: 'cloud',  dur: [11, 14], desc: '점프가 크게 강해진다!' },
  heaven:    { name: '천상의 발판',  kind: 'luck',   icon: 'halo',   dur: [11, 14], desc: '저중력과 보호막!' },
};
const ev = {
  active: null, remaining: 0, cardT: 0,
  nextIn: 26 + Math.random() * 14,
  history: [],
  windT: 0, boltT: 0, boltX: 0, boltPhase: null, quakeT: 0,
  card: null, // {name, kind, icon, desc, t}
};

const hazards = []; // 낙석
const particles = [];

// ---------- 물리 헬퍼 ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function jumpPower() {
  let m = 1;
  if (ev.active === 'fog') m *= 0.62;
  if (ev.active === 'cloud') m *= 1.45;
  return m;
}
function gravityNow() {
  let g = GRAV;
  if (ev.active === 'moonlight') g *= 0.62;
  if (ev.active === 'heaven') g *= 0.72;
  return g;
}

// ---------- 입력 ----------
const Input = {
  keys: {}, jumpHeld: false, left: false, right: false,
};
const keyMap = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump',
  ArrowDown: 'down', KeyS: 'down',
};
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const a = keyMap[e.code];
  if (a) {
    e.preventDefault();
    if (a === 'jump') Input.jumpHeld = true;
    else if (a === 'left') Input.left = true;
    else if (a === 'right') Input.right = true;
    else if (a === 'down') { chargeCancelHold = true; }
  }
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
  if (e.code === 'Enter' || e.code === 'Space') {
    if (S.mode === 'title') startGame();
    else if (S.mode === 'success') { /* 버튼으로 */ }
  }
});
document.addEventListener('keyup', (e) => {
  const a = keyMap[e.code];
  if (a === 'jump') Input.jumpHeld = false;
  else if (a === 'left') Input.left = false;
  else if (a === 'right') Input.right = false;
});
let touchJump = false;
function setJump(v) {
  if (v && !Input.jumpHeld) { } // 누르는 즉시 반응
  Input.jumpHeld = v;
}

// ---------- 점프 ----------
function doJump() {
  const t = player.charge;
  const power = jumpPower();
  const dir = (Input.left ? -1 : 0) + (Input.right ? 1 : 0);
  const v = (JUMP_MIN + (JUMP_MAX - JUMP_MIN) * t) * power;
  player.vy = -v;
  player.vx = dir * (60 + 300 * t) * (dir !== 0 ? 1 : 0);
  player.face = dir !== 0 ? dir : player.face;
  player.grounded = false;
  player.platform = null;
  S.jumps++;
  sfx('jump');
  spawnDust(player.x + PW / 2, player.y + PH, 6);
  // 태초 귀환 3%
  if (Math.random() < RETURN_CHANCE) {
    S.returns++;
    fullReset();
    return;
  }
}

let RETURN_CHANCE = 0.03;

function fullReset(opts) {
  // 진행 상황, 위치, 카메라, 이벤트, 발판 상태 완전 초기화
  // opts.silent: 게임 시작처럼 '태초 귀환' 연출 없이 조용히 초기화할 때
  const silent = !!(opts && opts.silent);
  player.x = L.spawn.x; player.y = L.spawn.y;
  playerPrevY = player.y; // 착지 판정용 이전 위치 동기화 (같은 프레임 오착지 방지)
  player.vx = 0; player.vy = 0;
  player.charge = 0; player.charging = false;
  player.grounded = true; player.platform = null;
  player.invuln = 0; player.shields = 0;
  for (const p of platforms) {
    p.solid = true; p.crumbled = false; p.crumbleT = -1; p.respawnT = -1;
    if (p.baseX !== undefined) p.x = p.baseX;
  }
  hazards.length = 0;
  particles.length = 0;
  ev.active = null; ev.remaining = 0; ev.card = null;
  ev.nextIn = 26 + Math.random() * 14; ev.history = [];
  ev.boltPhase = null;
  camera.x = L.spawn.x - vw / 2; camera.y = GROUND_Y - 200;
  S.prog = 0; S.time = 0;
  if (silent) { S.shake = 0; return; }
  S.shake = 10;
  showCard('태초 귀환', 'special', 'back', '모든 것이 처음으로…', 3.2);
  sfx('warp');
}

// ---------- 이벤트 시스템 ----------
function pickEvent() {
  const names = Object.keys(EVENTS);
  // 위험 60% / 행운 40%, 최근 3개 미반복
  const pool = names.filter((n) => !ev.history.includes(n));
  const danger = pool.filter((n) => EVENTS[n].kind === 'danger');
  const luck = pool.filter((n) => EVENTS[n].kind === 'luck');
  let choice;
  const wantDanger = Math.random() < 0.6 && danger.length > 0;
  const arr = wantDanger ? danger : (luck.length ? luck : danger);
  choice = arr[Math.floor(Math.random() * arr.length)];
  ev.history.push(choice);
  if (ev.history.length > 3) ev.history.shift();
  return choice;
}
function triggerEvent(name) {
  const d = EVENTS[name];
  ev.active = name;
  ev.remaining = d.dur[0] + Math.random() * (d.dur[1] - d.dur[0]);
  showCard(d.name, d.kind, d.icon, d.desc, 2.6);
  if (name === 'starshield') player.shields = Math.min(3, player.shields + 2);
  if (name === 'heaven') player.shields = Math.min(3, player.shields + 2);
  sfx(d.kind === 'danger' ? 'danger' : 'luck');
}
function showCard(name, kind, icon, desc, dur) {
  ev.card = { name, kind, icon, desc, t: dur, max: dur };
}

// ---------- 피해 ----------
function hurt(vx, vy, strong) {
  if (player.invuln > 0) return;
  if (player.shields > 0) {
    player.shields--;
    player.invuln = 1.0;
    S.flash = 0.3;
    sfx('shield');
    spawnDust(player.x + PW / 2, player.y + PH / 2, 10);
    return;
  }
  player.invuln = strong ? 1.6 : 1.2;
  player.vx = vx; player.vy = vy;
  player.grounded = false; player.platform = null;
  S.shake = Math.max(S.shake, strong ? 9 : 6);
  S.flash = 0.4;
  sfx('hurt');
  spawnDust(player.x + PW / 2, player.y + PH / 2, 14);
}
function spikeFling(dirX) {
  hurt(dirX * (420 + Math.random() * 220), -(820 + Math.random() * 160), true);
}

// ---------- 사운드 (WebAudio 절차적) ----------
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, slide) {
  if (!actx || settings.muted) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  } catch (e) {}
}
function sfx(kind) {
  if (!actx || settings.muted) return;
  switch (kind) {
    case 'jump': tone(300, 0.22, 'square', 0.1, 500); break;
    case 'land': tone(180, 0.08, 'triangle', 0.1, -60); break;
    case 'hurt': tone(500, 0.3, 'sawtooth', 0.14, -420); break;
    case 'shield': tone(700, 0.18, 'sine', 0.12, 300); break;
    case 'danger': tone(160, 0.5, 'sawtooth', 0.12, -80); break;
    case 'luck': tone(520, 0.35, 'sine', 0.12, 400); break;
    case 'warp': tone(900, 0.7, 'sine', 0.14, -850); break;
    case 'charge': tone(240 + 300 * player.charge, 0.05, 'square', 0.05); break;
    case 'crumble': tone(120, 0.25, 'sawtooth', 0.1, -60); break;
    case 'success': [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'square', 0.1), i * 130)); break;
  }
}

// ---------- 파티클 ----------
function spawnDust(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 120,
      life: 0.4 + Math.random() * 0.4, max: 0.8, c: '#c8c8d8', s: 2,
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt;

let chargeCancelHold = false;
function update(dt) {
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 14);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 1.6);

  if (S.mode !== 'playing') return;
  S.time += dt;   // 플레이 중일 때만 시간이 흐른다(일시정지·메뉴 제외)

  // 발판 업데이트
  for (const p of platforms) {
    if (p.type === 'moving') {
      p.moverT += dt;
      p.x = p.baseX + Math.sin(p.moverT * Math.PI * 2 / p.period) * p.amp;
    }
    if (p.type === 'crumble') {
      if (p.crumbleT >= 0) {
        p.crumbleT -= dt;
        if (p.crumbleT <= 0 && p.solid) {
          p.solid = false; p.crumbled = true; p.respawnT = p.respawn;
          sfx('crumble');
        }
      }
      if (p.crumbled) {
        p.respawnT -= dt;
        if (p.respawnT <= 0) { p.crumbled = false; p.solid = true; p.crumbleT = -1; }
      }

    if (p.type === 'spin') p.angle += (Math.PI * 2 / p.spinPeriod) * dt;
  }

  // 이벤트 스케줄
  ev.nextIn -= dt;
  if (ev.nextIn <= 0 && !ev.active) {
    triggerEvent(pickEvent());
    ev.nextIn = 24 + Math.random() * 18;
  }
  if (ev.active) {
    ev.remaining -= dt;
    const e = EVENTS[ev.active];
    if (ev.remaining <= 0) ev.active = null;
    // 이벤트별 로직
    if (ev.active === 'gust') {
      ev.windT += dt;
      if (!player.grounded) {
        const f = Math.sin(ev.windT * 2.2) * 480 + Math.sin(ev.windT * 0.7) * 160;
        player.vx += f * dt;
      }
      if (Math.random() < dt * 22) {
        particles.push({ x: camera.x + Math.random() * vw, y: camera.y + Math.random() * vh, vx: (Math.sin(ev.windT * 2.2) > 0 ? 1 : -1) * (240 + Math.random() * 160), vy: 30, life: 0.5, max: 0.5, c: '#d8e8f8', s: 1 });
      }
    }
    if (ev.active === 'lightning') {
      ev.boltT -= dt;
      if (ev.boltT <= 0) {
        if (ev.boltPhase === null) {
          ev.boltX = clamp(player.x + (Math.random() - 0.5) * 420, 10, WORLD_W - 30);
          ev.boltPhase = 0.55; ev.boltT = 0.55;
        } else {
          ev.boltPhase = null; ev.boltT = 1.3 + Math.random() * 0.6;
        }
      }
      if (ev.boltPhase !== null) {
        ev.boltPhase -= dt;
        if (ev.boltPhase <= 0 && ev.boltPhase > -0.28) {
          // 번개 타격 판정
          if (Math.abs(player.x + PW / 2 - (ev.boltX + 6)) < 30 && player.invuln <= 0) {
            hurt((Math.random() - 0.5) * 500, -1050, true);
          }
          S.flash = Math.max(S.flash, 0.2);
        }
      }
    }
    if (ev.active === 'rockfall') {
      if (Math.random() < dt * 2.6) {
        hazards.push({ x: clamp(player.x + (Math.random() - 0.5) * 500, 10, WORLD_W - 24), y: camera.y - 30, vx: (Math.random() - 0.5) * 60, vy: 260 + Math.random() * 200, kind: 'rock' });
      }
    }
    if (ev.active === 'quake') {
      S.shake = Math.max(S.shake, 3.5);
      ev.quakeT -= dt;
      if (ev.quakeT <= 0) {
        ev.quakeT = 0.5;
        if (player.grounded) player.vx += (Math.random() - 0.5) * 380;
        else player.vx += (Math.random() - 0.5) * 240;
      }
    }
  }
  // 번개 이벤트가 끝나면 상태 정리
  if (ev.active !== 'lightning') ev.boltPhase = null;

  // 협곡/폭풍 구간 패시브 낙석 (느리게)
  const zone = currentZone();
  if ((zone === 1 || zone === 3) && Math.random() < dt * 0.28) {
    hazards.push({ x: clamp(player.x + (Math.random() - 0.5) * 700, 10, WORLD_W - 24), y: camera.y - 30, vx: 0, vy: 200 + Math.random() * 120, kind: 'rock' });
  }

  // 낙석 업데이트
  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i];
    h.x += h.vx * dt; h.y += h.vy * dt; h.vy += 500 * dt;
    if (h.y > camera.y + vh + 60) { hazards.splice(i, 1); continue; }
    if (player.invuln <= 0 && Math.abs(player.x + PW / 2 - (h.x + 6)) < 13 && Math.abs(player.y + PH / 2 - (h.y + 6)) < 14) {

  // ----- 플레이어 물리 -----
  const onIce = player.platform && player.platform.type === 'ice';

    if (player.platform && player.platform.type === 'moving' && player.platform.solid) {
      player.x += (player.platform.x - player.platform.prevX || 0);
    }
  } else {
    // 미세 공중 제어
    if (dir !== 0) {
      player.vx += dir * 420 * dt;
      player.vx = clamp(player.vx, -Math.max(360, Math.abs(player.vx0 || 360)), Math.max(360, Math.abs(player.vx0 || 360)));
      player.face = dir;
    }
  }

  // 충전
  if (player.grounded && Input.jumpHeld) {
    if (!player.charging) { player.charging = true; ensureAudio(); }
    const prev = player.charge;
    player.charge = Math.min(1, player.charge + dt / CHARGE_TIME);
    if (Math.floor(prev * 8) !== Math.floor(player.charge * 8)) sfx('charge');
  }
  if (player.charging && (!Input.jumpHeld || !player.grounded)) {
    if (player.grounded && player.charge > 0.04) doJump();
    player.charging = false; player.charge = 0;
  }

  // 중력/이동
  if (!player.grounded) {
    player.vy += gravityNow() * dt;
    player.vy = Math.min(player.vy, 1500);
    player.vx0 = player.vx;
  }
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = clamp(player.x, 2, WORLD_W - PW - 2);
  if (player.x <= 2 || player.x >= WORLD_W - PW - 2) player.vx = 0;

  // 착지 판정 (단방향)
  if (player.vy >= 0) {
    // 지면
    if (player.y + PH >= GROUND_Y && playerPrevY + PH <= GROUND_Y + 14) {
      player.y = GROUND_Y - PH; player.vy = 0; land(null);
    } else {
      for (const p of platforms) {
        if (!p.solid) continue;
        if (player.x + PW > p.x + 2 && player.x < p.x + p.w - 2) {
          const top = p.y;
          if (playerPrevY + PH <= top + 10 && player.y + PH >= top) {
            // 가시 발판 처리
            if (p.type === 'spikes' && spikeHit(p)) {

      }

  if (player.grounded && player.platform) {

    if (!still) { player.grounded = false; player.platform = null; }
  } else if (player.grounded && !player.platform) {
    // 지면 위?
    if (player.y + PH < GROUND_Y - 2) { player.grounded = false; }

  }

  // 가시 위 걷기 판정
  if (player.grounded && player.platform && player.platform.type === 'spikes' && spikeHit(player.platform)) {

    const bx = cx + Math.cos(p.angle) * p.spinR, by = cy + Math.sin(p.angle) * p.spinR;
    const bx2 = cx - Math.cos(p.angle) * p.spinR, by2 = cy - Math.sin(p.angle) * p.spinR;
    // 플레이어 중심과 막대 최근접점

  // 안전망
  if (player.y > L.valleyBottomY - 80) {
    player.x = L.spawn.x; player.y = L.spawn.y; player.vx = 0; player.vy = 0;
    player.grounded = true; player.platform = null;
  }

  // 진행도/최고 기록
  const meters = heightM();
  if (meters > S.best) { S.best = meters; store.set('jawoo_best', String(S.best)); }
  if (player.platform && player.platform.i + 1 > S.prog) {
    S.prog = player.platform.i + 1;
    if (S.prog === platforms.length) winGame();

  if (!player.platform && S.prog === 0) { /* 지면 */ }

  // 카메라
  const targY = player.y - vh * 0.58;
  camera.y = lerp(camera.y, targY, Math.min(1, dt * 6));
  const targX = player.x + PW / 2 - vw / 2;
  camera.x = vw >= WORLD_W ? (WORLD_W - vw) / 2 : lerp(clamp(camera.x, 0, WORLD_W - vw), clamp(targX, 0, WORLD_W - vw), Math.min(1, dt * 8));

let playerPrevY = 0;
function land(p) {

    sfx('land');
    spawnDust(player.x + PW / 2, player.y + PH, 5);

    // 목표 발판 체크는 update에서 진행도로 처리
  }

function spikeHit(p) {
  const sw = Math.round(p.w * p.spikeFrac);
  const sx = p.spikeSide === 'left' ? p.x : p.x + p.w - sw;
  return player.x + PW - 2 > sx && player.x + 2 < sx + sw;
}
function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy || 1;
  let t = ((px - x1) * dx + (py - y1) * dy) / l2;
  t = clamp(t, 0, 1);
  const cx = x1 + t * dx, cy = y1 + t * dy;
  return Math.hypot(px - cx, py - cy);
}
function heightM() { return Math.max(0, Math.floor((-player.y - PH) / 40)); }
function currentZone() {
  const y = player.y;
  let z = 0;
  for (let i = 0; i < L.zones.length; i++) if (y < L.zones[i].bottomY) z = i;
  return z;
}
function zoneName() {
  const z = currentZone();
  if (player.y > 40) return '깊은 구름 계곡';
  return L.zones[z].name;
}

// ---------- 승리/일시정지 ----------
function winGame() {
  S.mode = 'success';
  showScreen('success');
  document.getElementById('suc-stats').innerHTML =
    `도달 높이 <b>${heightM()}m</b> · 점프 <b>${S.jumps}회</b> · 태초 귀환 <b>${S.returns}회</b> · 시간 <b>${fmtTime(S.time)}</b>`;
  sfx('success');
  store.set('jawoo_best', String(S.best));
}
function togglePause() {
  if (S.mode === 'playing') { S.mode = 'paused'; showScreen('pause'); }
  else if (S.mode === 'paused') { S.mode = 'playing'; showScreen(null); }
}
function startGame() {
  fullReset({ silent: true });
  S.jumps = 0; S.returns = 0;
  S.mode = 'playing';
  showScreen(null);
  ensureAudio();
}
function toTitle() {
  S.mode = 'title';
  showScreen('title');
}

// ---------- 렌더링 ----------
const IMGS = {};
function loadImages() {
  const list = ['bg_world', 'title_bg', 'btn_left', 'btn_right', 'btn_jump', 'btn_pause',
    'card_danger', 'card_luck', 'card_special', 'player_idle', 'player_jump', 'player_charge',
    'plat_normal', 'plat_ice', 'plat_moving', 'plat_crumble', 'plat_goal', 'spikes', 'flag',
    'rock', 'shield',
    'icon_wind', 'icon_rock', 'icon_bolt', 'icon_quake', 'icon_fog', 'icon_moon',
    'icon_shield', 'icon_cloud', 'icon_halo', 'icon_back'];
  let pending = list.length;
  return new Promise((res) => {
    for (const n of list) {
      const im = new Image();
      im.onload = () => { if (--pending === 0) res(); };
      im.onerror = () => { console.warn('asset fail', n); if (--pending === 0) res(); };
      im.src = window.__ASSETS__[n];
      IMGS[n] = im;
    }
  });
}

// CSS px 단위 안전영역을 아트픽셀 단위로 환산한다.
// 캔버스는 CSS 픽셀당 dpr개의 장치 픽셀, 아트픽셀당 dScale개의 장치 픽셀을 쓴다.
function applySafeArea() {
  const pxPerArt = dScale / dpr;               // 아트픽셀 1개가 차지하는 CSS px
  SAFE.t = SAFE_CSS.t / pxPerArt;
  SAFE.b = SAFE_CSS.b / pxPerArt;
  SAFE.l = SAFE_CSS.l / pxPerArt;
  SAFE.r = SAFE_CSS.r / pxPerArt;
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cw = window.innerWidth, ch = window.innerHeight;
  dScale = Math.max(1, Math.round(dpr * Math.max(cw / 480, ch / 560)));
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  vw = canvas.width / dScale;
  vh = canvas.height / dScale;
  readSafeArea();
  applySafeArea();
  layoutTouch();
}

function render() {
  ctx.setTransform(dScale, 0, 0, dScale, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0a0e1c';
  ctx.fillRect(0, 0, vw, vh);

  if (S.mode === 'title') {
    renderTitle();
    return;
  }

  // 카메라 셰이크
  const shx = (Math.random() - 0.5) * S.shake, shy = (Math.random() - 0.5) * S.shake;
  const cx = camera.x + shx, cy = camera.y + shy;

  // 배경 (월드 고정, 세로 1:1, 가로 패럴랙스)
  const bg = IMGS.bg_world;
  if (bg && bg.complete) {
    const TOP = L.topY;
    const by = TOP - cy;
    const ox = -((cx * 0.3) % 480);
    ctx.drawImage(bg, ox, by);
    ctx.drawImage(bg, ox + 480, by);
    if (ox + 960 < vw) ctx.drawImage(bg, ox + 960, by);
  }

  ctx.save();
  ctx.translate(-cx, -cy);

  // 발판
  for (const p of platforms) {
    if (p.y > cy + vh + 40 || p.y < cy - 60) continue;
    if (p.crumbled) {
      // 무너진 자국
      ctx.globalAlpha = 0.25;
      drawPlatform(p);
      ctx.globalAlpha = 1;
      continue;
    }
    // 지진/붕괴 흔들림
    let jx = 0;
    if (ev.active === 'quake' && Math.abs(p.y - player.y) < 500) jx = (Math.random() - 0.5) * 3;
    if (p.crumbleT >= 0 && p.crumbleT < 0.25) jx += (Math.random() - 0.5) * 4;
    drawPlatform(p, jx);
    // 회전 장애물
    if (p.type === 'spin') drawSpinner(p);
  }

  // 목표 깃발
  const last = platforms[platforms.length - 1];
  if (IMGS.flag && IMGS.flag.complete) {
    ctx.drawImage(IMGS.flag, last.x + last.w / 2 - 9, last.y - 40, 18, 40);
  }

  // 낙석
  for (const h of hazards) {
    if (IMGS.rock) ctx.drawImage(IMGS.rock, h.x, h.y, 12, 12);
  }

  // 번개 텔레그래프/타격
  if (ev.boltPhase !== null) {
    const bx = ev.boltX;
    if (ev.boltPhase > 0) {
      ctx.fillStyle = 'rgba(255,248,200,0.18)';
      ctx.fillRect(bx, cy, 14, vh);
      ctx.fillStyle = 'rgba(255,248,200,0.35)';
      ctx.fillRect(bx + 5, cy, 4, vh);
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx + 6, cy, 3, vh);
      ctx.fillStyle = 'rgba(255,248,200,0.5)';
      ctx.fillRect(bx + 2, cy, 11, vh);
      // 지그재그
      ctx.strokeStyle = '#fff8c8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      let yy = cy;
      ctx.moveTo(bx + 7, yy);
      while (yy < cy + vh) { yy += 26; ctx.lineTo(bx + 7 + (Math.random() - 0.5) * 22, yy); }
      ctx.stroke();
    }
  }

  // 파티클
  for (const pt of particles) {
    ctx.globalAlpha = clamp(pt.life / pt.max, 0, 1);
    ctx.fillStyle = pt.c;
    ctx.fillRect(pt.x, pt.y, pt.s, pt.s);
  }
  ctx.globalAlpha = 1;

  // 플레이어
  drawPlayer();

  ctx.restore();

  // HUD
  drawHUD();

  // 이벤트 카드
  drawCard();

  // 피격 플래시
  if (S.flash > 0) {
    ctx.fillStyle = `rgba(255,60,60,${S.flash * 0.45})`;
    ctx.fillRect(0, 0, vw, vh);
  }
}

function drawPlatform(p, jx = 0) {
  const img = IMGS['plat_' + (p.i === platforms.length - 1 ? 'goal' : p.type === 'normal' ? 'normal' : p.type)] || IMGS.plat_normal;
  if (!img || !img.complete) { ctx.fillStyle = '#888'; ctx.fillRect(p.x + jx, p.y, p.w, 14); return; }
  const tw = 48, th = 14;
  let x = p.x + jx;
  // 무너지는 발판 알파
  if (p.crumbleT >= 0 && p.crumbleT < p.standTime) ctx.globalAlpha = 0.6 + 0.4 * (p.crumbleT / p.standTime);
  for (let dx = 0; dx < p.w; dx += tw) {
    const w = Math.min(tw, p.w - dx);
    ctx.drawImage(img, 0, 0, w, th, x + dx, p.y, w, th);
  }
  ctx.globalAlpha = 1;
  // 가시
  if (p.type === 'spikes') {
    const sw = Math.round(p.w * p.spikeFrac);
    const sx = p.spikeSide === 'left' ? p.x : p.x + p.w - sw;
    const sp = IMGS.spikes;
    if (sp) {
      for (let dx = 0; dx < sw; dx += 16) {
        ctx.drawImage(sp, sx + dx, p.y - 11, Math.min(16, sw - dx), 12);
      }
    }
  }
}

function drawSpinner(p) {
  const cx = p.x + p.w / 2, cy = p.y - p.spinH;
  const r = p.spinR;
  const x1 = cx + Math.cos(p.angle) * r, y1 = cy + Math.sin(p.angle) * r;
  const x2 = cx - Math.cos(p.angle) * r, y2 = cy - Math.sin(p.angle) * r;
  // 축
  ctx.fillStyle = '#3a3a52';
  ctx.fillRect(cx - 3, cy - 3, 6, 6);
  ctx.fillStyle = '#8a94a8';
  ctx.fillRect(cx - 1, cy - 1, 2, 2);
  // 막대 (픽셀 도트로)
  const steps = Math.ceil(r / 4);
  for (let i = -steps; i <= steps; i++) {
    const t = i / steps;
    const bx = cx + Math.cos(p.angle) * r * t, by = cy + Math.sin(p.angle) * r * t;
    const c = Math.abs(i) > steps * 0.75 ? '#c8a030' : Math.abs(i) > steps * 0.3 ? '#b0b8c8' : '#8a94a8';
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(bx) - 2, Math.round(by) - 2, 4, 4);
  }
}

function drawPlayer() {
  if (player.invuln > 0 && Math.floor(player.invuln * 14) % 2 === 0) return; // 깜빡임
  let img;
  if (player.sprite === 'jump') img = IMGS.player_jump;
  else if (player.sprite === 'charge') img = IMGS.player_charge;
  else img = IMGS.player_idle;
  if (!img || !img.complete) { ctx.fillStyle = '#2a8a4a'; ctx.fillRect(player.x, player.y, PW, PH); return; }
  ctx.save();
  if (player.face < 0) { ctx.translate(player.x + PW, player.y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); }
  else ctx.drawImage(img, player.x, player.y);
  ctx.restore();
  // 보호막
  if (player.shields > 0) {
    ctx.strokeStyle = 'rgba(120,200,255,0.7)';
    ctx.lineWidth = 1;
    ctx.strokeRect(player.x - 3.5, player.y - 3.5, PW + 7, PH + 7);
    if (player.shields > 1) ctx.strokeRect(player.x - 5.5, player.y - 5.5, PW + 11, PH + 11);
  }
  // 충전 게이지
  if (player.charging) {
    const bw = 30, bx = player.x + PW / 2 - bw / 2, by = player.y - 10;
    ctx.fillStyle = '#141826';
    ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
    const f = player.charge;
    const c = f < 0.5 ? '#5ad06a' : f < 0.85 ? '#e8c830' : '#e85648';
    ctx.fillStyle = c;
    ctx.fillRect(bx, by, Math.round(bw * f), 4);
  }
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

// ---------- HUD ----------
function drawHUD() {
  const oy = IS_TOUCH ? SAFE.t : 0;   // 노치/상태표시줄 아래로 HUD를 내린다
  ctx.font = '10px Galmuri11, "Malgun Gothic", sans-serif';
  ctx.textBaseline = 'top';
  // 상단 배경 스트립
  ctx.fillStyle = 'rgba(10,14,28,0.62)';
  ctx.fillRect(0, 0, vw, 26 + oy);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(0, 26 + oy, vw, 1);
  // 좌측: 구간/높이/기록
  ctx.fillStyle = '#ffe8a0';
  ctx.fillText(zoneName(), 8, 4 + oy);
  ctx.fillStyle = '#e8ecf4';
  ctx.fillText(`높이 ${heightM()}m`, 8, 15 + oy);
  ctx.fillStyle = '#9aa8c0';
  const bestTxt = `최고 ${S.best}m`;
  ctx.fillText(bestTxt, 8 + ctx.measureText(`높이 ${heightM()}m`).width + 14, 15 + oy);
  // 우측: 발판 진행도 (터치 시 일시정지 버튼과 겹치지 않게 여백 확보)
  const rm = IS_TOUCH ? 70 : 8;
  const progTxt = `발판 ${S.prog}/${platforms.length}`;
  const tw2 = ctx.measureText(progTxt).width;
  ctx.fillStyle = '#c8d8f0';
  ctx.fillText(progTxt, vw - tw2 - rm, 4 + oy);
  const tm = fmtTime(S.time);
  ctx.fillStyle = '#9aa8c0';
  ctx.fillText(tm, vw - ctx.measureText(tm).width - rm, 15 + oy);
  // 진행 바
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(vw - 120 - (rm - 8), 17 + oy, 112, 4);
  ctx.fillStyle = '#7ac86a';
  ctx.fillRect(vw - 120 - (rm - 8), 17 + oy, Math.round(112 * S.prog / platforms.length), 4);

  // 이벤트 상태 (좌측 하단 카드 아래)
  if (ev.active) {
    const e = EVENTS[ev.active];
    ctx.font = '9px Galmuri11, "Malgun Gothic", sans-serif';
    const label = `⟨${e.name}⟩ ${ev.remaining.toFixed(1)}s`;
    const lw = ctx.measureText(label).width;
    ctx.fillStyle = e.kind === 'danger' ? 'rgba(90,16,20,0.75)' : 'rgba(16,72,26,0.75)';
    ctx.fillRect(8, 32 + oy, lw + 12, 14);
    ctx.fillStyle = e.kind === 'danger' ? '#ff9a90' : '#9ae88a';
    ctx.fillText(label, 14, 34 + oy);
    // 남은 시간 바
    const total = e.dur[0] + (e.dur[1] - e.dur[0]) / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(8, 48 + oy, lw + 12, 3);
    ctx.fillStyle = e.kind === 'danger' ? '#e85648' : '#5ad06a';
    ctx.fillRect(8, 48 + oy, Math.round((lw + 12) * clamp(ev.remaining / total, 0, 1)), 3);
  }
  // 보호막 표시
  if (player.shields > 0) {
    const sp = IMGS.shield;
    for (let i = 0; i < player.shields; i++) {
      if (sp) ctx.drawImage(sp, 8 + i * 14, 56 + oy, 12, 14);
    }
  }
  // FPS
  drawFPS();
}

// ---------- 이벤트 카드 ----------
function drawCard() {
  if (!ev.card) return;
  const c = ev.card;
  const scale = clamp((c.max - c.t) / 0.25, 0, 1); // 등장 스케일
  const fade = clamp(c.t / 0.4, 0, 1);
  const w = Math.min(vw - (IS_TOUCH ? 76 : 16), 300), h = w * 110 / 400;
  const x = (vw - w) / 2, y = 36 + (1 - scale) * -8;
  const frame = c.kind === 'danger' ? IMGS.card_danger : c.kind === 'luck' ? IMGS.card_luck : IMGS.card_special;
  ctx.save();
  ctx.globalAlpha = Math.min(scale, fade);
  if (frame) ctx.drawImage(frame, x, y, w, h);
  // 아이콘
  const ic = IMGS['icon_' + (c.icon || 'bolt')];
  if (ic) ctx.drawImage(ic, x + 14, y + h / 2 - 20, 40, 40);
  // 텍스트
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.round(h * 0.24)}px Galmuri11, "Malgun Gothic", sans-serif`;
  ctx.fillStyle = c.kind === 'danger' ? '#ffd8d0' : c.kind === 'luck' ? '#e8ffd0' : '#e8d0ff';
  ctx.fillText(c.name, x + 64, y + h * 0.36);
  ctx.font = `${Math.round(h * 0.15)}px Galmuri11, "Malgun Gothic", sans-serif`;
  ctx.fillStyle = '#e8ecf4';
  ctx.fillText(c.desc, x + 64, y + h * 0.68);
  ctx.restore();
  ctx.textBaseline = 'top';
}

// ---------- 타이틀 렌더 ----------
function renderTitle() {
  const im = IMGS.title_bg;
  if (im && im.complete) {
    // 커버 방식으로 그리기 (세로 화면에서는 오른쪽 부유섬/성 기준으로 크롭)
    const s = Math.max(vw / im.width, vh / im.height);
    const w = im.width * s, h = im.height * s;
    const px = vh > vw ? vw - w : (vw - w) / 2;
    ctx.drawImage(im, px, (vh - h) / 2, w, h);
  }
  // 세로 화면(모바일)에서는 배경을 살짝 어둡게 해 가독성 확보
  if (vh > vw) {
    ctx.fillStyle = 'rgba(10,14,28,0.30)';
    ctx.fillRect(0, 0, vw, vh);
  } else if (S.mode === 'title') {
    // 가로 화면: 왼쪽 어두운 안전 영역 (뷰포트 전체에 걸친 부드러운 그라데이션)
    const g = ctx.createLinearGradient(0, 0, vw * 0.62, 0);
    g.addColorStop(0, 'rgba(8,10,26,0.78)');
    g.addColorStop(0.55, 'rgba(8,10,26,0.42)');
    g.addColorStop(1, 'rgba(8,10,26,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, vw * 0.62, vh);
  }
}

// ---------- FPS (디버그용, 기본 비활성) ----------
let _frames = 0, _fpsT = performance.now(), _fps = 0;
function drawFPS() {
  if (!window.__SHOW_FPS) return;
  _frames++;
  const now = performance.now();
  if (now - _fpsT >= 1000) { _fps = Math.round(_frames * 1000 / (now - _fpsT)); _frames = 0; _fpsT = now; }
  ctx.font = '8px Galmuri9, monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText(`FPS ${_fps}`, 8, vh - 12);
}

// ---------- 화면/오버레이 관리 ----------
const screens = { title: 'screen-title', settings: 'screen-settings', pause: 'screen-pause', success: 'screen-success' };
function showScreen(name) {
  for (const k of Object.keys(screens)) {
    document.getElementById(screens[k]).style.display = k === name ? 'flex' : 'none';
  }
  const hud = document.getElementById('hud-touch');
  if (name === null) hud.style.display = IS_TOUCH ? 'flex' : 'none';
  else if (name === 'settings') hud.style.display = 'flex'; // 편집용 표시
  else hud.style.display = 'none';
}

// ---------- 터치 버튼 ----------
function layoutTouch() {
  const B = settings.buttons;
  const cw = window.innerWidth, ch = window.innerHeight;
  const isSmall = cw < 700;
  const base = settings.preset === 'split'
    ? { left: { a: 'l', x: 16, y: 24 }, right: { a: 'l', x: isSmall ? 118 : 130, y: 24 }, jump: { a: 'r', x: 16, y: 24 } }
    : settings.preset === 'left'
      ? { left: { a: 'l', x: 16, y: 120 }, right: { a: 'l', x: 16, y: 24 }, jump: { a: 'l', x: 130, y: 60 } }
      : { left: { a: 'r', x: 130, y: 120 }, right: { a: 'r', x: 130, y: 24 }, jump: { a: 'r', x: 16, y: 60 } };
  const apply = (id, b, size) => {
    const el = document.getElementById(id);
    const sc = (isSmall ? 0.86 : 1) * b.sc;
    const w = Math.round(size * sc), h = Math.round(size * sc * (id === 'tb-jump' ? 0.75 : 1));
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.backgroundSize = '100% 100%';
    const y = ch - h - b.dy - base[id.slice(3)].y - SAFE_CSS.b;
    if (base[id.slice(3)].a === 'l') el.style.left = b.dx + base[id.slice(3)].x + SAFE_CSS.l + 'px', el.style.right = 'auto';
    else el.style.right = -b.dx + base[id.slice(3)].x + SAFE_CSS.r + 'px', el.style.left = 'auto';
    el.style.top = y + 'px';
  };
  apply('tb-left', B.left, 96);
  apply('tb-right', B.right, 96);
  apply('tb-jump', B.jump, 128);
  const p = document.getElementById('tb-pause');
  const psc = B.pause.sc * (isSmall ? 0.8 : 1);
  p.style.width = Math.round(56 * psc) + 'px'; p.style.height = Math.round(56 * psc) + 'px';
  p.style.right = (10 + B.pause.dx + SAFE_CSS.r) + 'px';
  p.style.top = (ch > 600 ? 34 : 30) + B.pause.dy + SAFE_CSS.t + 'px';
}

function bindTouch() {
  const bind = (id, down, up) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); down(); }, { passive: false });
    el.addEventListener('touchend', (e) => { e.preventDefault(); up(); }, { passive: false });
    el.addEventListener('touchcancel', (e) => { e.preventDefault(); up(); }, { passive: false });
    el.addEventListener('mousedown', (e) => { e.preventDefault(); ensureAudio(); down(); });
    el.addEventListener('mouseup', (e) => { e.preventDefault(); up(); });
    el.addEventListener('mouseleave', () => up());
  };
  bind('tb-left', () => Input.left = true, () => Input.left = false);
  bind('tb-right', () => Input.right = true, () => Input.right = false);
  bind('tb-jump', () => setJump(true), () => setJump(false));
  bind('tb-pause', () => togglePause(), () => {});
}

// ---------- 메인 루프 ----------
let lastT = 0, acc = 0;
function frame(ts) {
  if (!lastT) lastT = ts;
  let dt = (ts - lastT) / 1000;
  lastT = ts;
  dt = Math.min(dt, 0.1);
  acc += dt;
  const STEP = 1 / 60;
  let guard = 0;
  while (acc >= STEP && guard++ < 6) {
    playerPrevY = player.y;
    update(STEP);
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}

// ---------- 테스트 훅 ----------
window.advanceTime = (ms) => {
  const steps = Math.max(1, Math.round(ms / (1000 / 60)));
  for (let i = 0; i < steps; i++) { playerPrevY = player.y; update(1 / 60); }
  render();
};
window.render_game_to_text = () => {
  const near = platforms.filter((p) => p.y > camera.y - 60 && p.y < camera.y + vh + 60)
    .slice(0, 12).map((p) => ({ i: p.i, x: Math.round(p.x), y: p.y, w: p.w, t: p.type, solid: p.solid }));
  return JSON.stringify({
    mode: S.mode,
    player: { x: Math.round(player.x), y: Math.round(player.y), vx: Math.round(player.vx), vy: Math.round(player.vy), grounded: player.grounded, charge: +player.charge.toFixed(2), invuln: +player.invuln.toFixed(2), shields: player.shields },
    camera: { x: Math.round(camera.x), y: Math.round(camera.y) },
    zone: zoneName(), heightM: heightM(), best: S.best, prog: `${S.prog}/${platforms.length}`,
    jumps: S.jumps, returns: S.returns, time: +S.time.toFixed(1),
    event: ev.active ? { name: EVENTS[ev.active].name, remaining: +ev.remaining.toFixed(1) } : null,
    hazards: hazards.map((h) => ({ x: Math.round(h.x), y: Math.round(h.y) })),
    platformsNear: near,
    note: 'world: x→right, y→down (음수=높이). 플레이어 14x18. 착지는 발판 위에서만.',
  });
};
window.__game = {
  S, player, camera, platforms, ev, settings, hazards,
  debug: {
    setReturnChance(p) { RETURN_CHANCE = p; },
    forceEvent(n) { if (EVENTS[n]) triggerEvent(n); },
    clearEvent() { ev.active = null; ev.card = null; },
    teleport(x, y) { player.x = x; player.y = y; playerPrevY = y; player.vx = 0; player.vy = 0; player.grounded = false; },
    giveShield(n) { player.shields = n; },
    jumpTo(i) { const p = platforms[i]; if (p) this.teleport(p.x + p.w / 2 - 7, p.y - PH - 4); },
    win() { winGame(); },
    reset() { fullReset(); },
  },
};

// ---------- 시작 ----------
async function boot() {
  await loadImages();
  resize();
  window.addEventListener('resize', resize);
  bindTouch();
  const best = parseInt(store.get('jawoo_best') || '0', 10) || 0;
  S.best = best;
  document.getElementById('best-label').textContent = best > 0 ? `최고 기록 ${best}m` : '아직 기록 없음';
  // 터치 기기에서는 안내 문구를 터치 조작 기준으로 교체
  if (IS_TOUCH) {
    const hint = document.querySelector('#screen-title .hint-line');
    if (hint) hint.innerHTML = '왼쪽/오른쪽 버튼으로 이동 · 점프 버튼을 길게 누르면 더 높이<br>떨어지면 처음부터… 점프할 때마다 3%의 확률로 태초 귀환';
  }
  // 메뉴 버튼
  // 터치 버튼 배경 이미지
  document.getElementById('tb-left').style.backgroundImage = `url(${window.__ASSETS__.btn_left})`;
  document.getElementById('tb-right').style.backgroundImage = `url(${window.__ASSETS__.btn_right})`;
  document.getElementById('tb-jump').style.backgroundImage = `url(${window.__ASSETS__.btn_jump})`;
  document.getElementById('tb-pause').style.backgroundImage = `url(${window.__ASSETS__.btn_pause})`;
  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-settings').addEventListener('click', () => { S.mode = 'settings'; showScreen('settings'); });
  document.getElementById('btn-back').addEventListener('click', () => { saveSettings(); toTitle(); });
  document.getElementById('btn-resume').addEventListener('click', togglePause);
  document.getElementById('btn-restart').addEventListener('click', () => { startGame(); });
  document.getElementById('btn-home').addEventListener('click', toTitle);
  document.getElementById('btn-again').addEventListener('click', startGame);
  document.getElementById('btn-home2').addEventListener('click', toTitle);
  initSettingsUI();
  showScreen('title');
  requestAnimationFrame(frame);
}
boot();

// ---------- 설정 UI ----------
function saveSettings() {
  store.set('jawoo_settings', JSON.stringify(settings));
  layoutTouch();
}
function initSettingsUI() {
  // 프리셋
  document.querySelectorAll('input[name=preset]').forEach((r) => {
    r.checked = r.value === settings.preset;
    r.addEventListener('change', () => { settings.preset = r.value; saveSettings(); });
  });
  // 음소거
  const mute = document.getElementById('opt-mute');
  mute.checked = settings.muted;
  mute.addEventListener('change', () => { settings.muted = mute.checked; saveSettings(); });
  // 버튼별 슬라이더
  const sel = document.getElementById('btnsel');
  const sliders = ['s-x', 's-y', 's-s'];
  function refreshSliders() {
    const b = settings.buttons[sel.value];
    document.getElementById('s-x').value = b.dx;
    document.getElementById('s-y').value = b.dy;
    document.getElementById('s-s').value = b.sc;
    document.getElementById('s-xv').textContent = b.dx;
    document.getElementById('s-yv').textContent = b.dy;
    document.getElementById('s-sv').textContent = b.sc.toFixed(1);
  }
  sel.addEventListener('change', refreshSliders);
  const upd = () => {
    const b = settings.buttons[sel.value];
    b.dx = +document.getElementById('s-x').value;
    b.dy = +document.getElementById('s-y').value;
    b.sc = +document.getElementById('s-s').value;
    document.getElementById('s-xv').textContent = b.dx;
    document.getElementById('s-yv').textContent = b.dy;
    document.getElementById('s-sv').textContent = b.sc.toFixed(1);
    saveSettings();
  };
  sliders.forEach((id) => document.getElementById(id).addEventListener('input', upd));
  document.getElementById('btn-reset-ui').addEventListener('click', () => {
    settings.buttons = JSON.parse(JSON.stringify(DEFAULT_SETTINGS.buttons));
    refreshSliders(); saveSettings();
  });
  refreshSliders();
}

</script>
