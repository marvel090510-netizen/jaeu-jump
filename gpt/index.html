<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10152d"><title>성공하고싶은 재우</title><style>
@font-face{font-family:nanum;src:url('assets/NanumGothic.ttf')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152d;color:#fff;font-family:nanum,system-ui}#app{height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;background:radial-gradient(#26375c,#080d20)}canvas{height:100%;max-height:100dvh;max-width:100vw;aspect-ratio:480/854;object-fit:contain;touch-action:none;image-rendering:pixelated}#hint{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#aab5d5;pointer-events:none}</style></head><body><div id="app"><canvas id="c" width="480" height="854"></canvas></div><div id="hint">PC: ← → / A D · 점프: Space 또는 ↑ · 모바일: 화면 버튼</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d');x.imageSmoothingEnabled=false;const W=480,H=854;const imgs={};['title_bg','world_bg','player','platform_normal','platform_ice','platform_moving','platform_crumble','platform_spike','left','right','jump','pause','menu_btn','settings_btn','event_danger','event_luck','rock'].forEach(n=>{imgs[n]=new Image();imgs[n].src='assets/'+n+'.png'});
let scene='menu',paused=false,plats=[],p={},cam=0,charge=0,charging=false,keys={},kbd={l:false,r:false},best=+(localStorage.jwBest||0),event=null,eventT=0,cardT=0,shield=0,layout=+(localStorage.jwLayout||0),scale=+(localStorage.jwScale||1),offX=0,offY=0,menuFrom='menu',jumpCount=0,shake=0,fallTimer=0;
const sections=['초록 초원과 부유섬','붉은 협곡과 낙석 지대','얼음 산맥과 빙벽','보라색 폭풍의 밤','별빛이 비치는 최종 정상'];
function img(n,a,b,w,h){let im=imgs[n];if(im.complete&&im.naturalWidth)x.drawImage(im,a,b,w,h)}
function reset(){plats=[];let last=240;for(let i=0;i<90;i++){let y=730-i*(104+Math.min(i,65)*.65),safe=i%3===0;let xx=i===0?240:safe?240+Math.sin(i*.77)*54:Math.max(65,Math.min(415,last+(Math.random()-.5)*180));if(i%9===0)xx=240+(Math.random()-.5)*70;let kinds=['normal','ice','moving','crumble','spike'];let kind=safe||i===0?'normal':(Math.random()<.16?'ice':Math.random()<.32?'moving':Math.random()<.47?'crumble':'spike');plats.push({x:xx,y,w:kind==='spike'?104:92,h:22,kind,base:xx,phase:i*.6,broken:false,t:0});last=xx}p={x:240,y:690,vx:0,vy:0,w:28,h:42,ground:true,shield:shield};cam=0;charge=0;charging=false;event=null;eventT=0;cardT=0;jumpCount=0;fallTimer=0;shield=0;}
function start(){reset();scene='game';paused=false}
function trigEvent(){let names=['돌풍','낙석','번개 폭풍','지진 균열','암흑 안개','달빛 저중력','별빛 보호막','구름 가속','천상의 발판'];let weights=[12,10,8,9,9,14,14,12,12],r=Math.random()*100,s=0,k=0;for(;k<weights.length;k++){s+=weights[k];if(r<s)break}event={name:names[k],good:k>=5,desc:['좌우로 밀어내는 돌풍!','머리 위 낙석을 조심하세요!','번개가 주기적으로 떨어집니다!','땅이 흔들려 이동이 불안정합니다!','점프 힘이 약해집니다!','중력이 낮아져 더 높이 뜹니다!','피해를 두 번 막는 보호막!','충전 점프가 크게 강해집니다!','저중력과 보호막을 함께 획득!'][k],kind:k};eventT=[11,10,10,9,12,13,0,12,14][k];cardT=4.2;if(k===6)shield+=2;if(k===8)shield+=2;}
function hit(dir=-1){if(shield>0){shield--;return}p.vx=(Math.random()-.5)*680;p.vy=-760;p.ground=false;shake=15}
function jump(){if(!p.ground)return;jumpCount++;if(Math.random()<.03){event={name:'태초 귀환',good:false,desc:'모든 시간이 되감깁니다. 처음부터 다시!',kind:99};cardT=2;setTimeout(()=>{if(scene==='game')reset()},1500);return}let q=Math.min(1,charge/1.1),factor=event?.kind===7?1.45:event?.kind===5||event?.kind===8?1.22:event?.kind===4?.72:1;let power=(450+q*720)*factor;p.vy=-power;p.vx+=(keys.right?1:keys.left?-1:0)*(120+q*200);p.ground=false;charge=0;charging=false}
function pointerPos(e){let r=c.getBoundingClientRect();let s=Math.min(r.width/W,r.height/H);let ox=(r.width-W*s)/2,oy=(r.height-H*s)/2;return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}}
function btnRects(){let k=Math.max(.7,Math.min(1.45,scale)),lw=78*k,lh=76*k,jw=130*k,jh=88*k,by=H-39-lh,jy=H-37-jh,g=9*k,o;if(layout===2){o={};o.j={x:W-20-jw,y:jy,w:jw,h:jh};o.r={x:o.j.x-g-lw,y:by,w:lw,h:lh};o.l={x:o.r.x-g-lw,y:by,w:lw,h:lh}}else{o={};o.l={x:18,y:by,w:lw,h:lh};o.r={x:18+lw+g,y:by,w:lw,h:lh};o.j=layout===1?{x:18+lw*2+g*2,y:by,w:jw,h:jh}:{x:W-20-jw,y:jy,w:jw,h:jh}}return o}
function btnAt(a){let r=btnRects(),pad=10;for(let k of ['j','l','r']){let b=r[k];if(a.x>=b.x-pad&&a.x<=b.x+b.w+pad&&a.y>=b.y-pad&&a.y<=b.y+b.h+pad)return k}return null}
const ptrs={};function syncKeys(){const v=Object.values(ptrs);keys.left=!!(kbd.l||v.includes('l'));keys.right=!!(kbd.r||v.includes('r'))}
function releasePtr(id){const role=ptrs[id];if(!role)return;delete ptrs[id];if(role==='j'){if(charging)jump()}syncKeys()}
c.addEventListener('pointerdown',e=>{e.preventDefault();const a=pointerPos(e);if(scene==='menu'){if(a.y>490&&a.y<590)start();else if(a.y>600&&a.y<700)scene='settings';return}if(scene==='settings'){if(a.y>700&&a.y<820)scene='menu';else if(a.y>300&&a.y<420){layout=(layout+1)%3;localStorage.jwLayout=layout}else if(a.y>430&&a.y<530){scale=Math.min(1.45,scale+.1);localStorage.jwScale=scale}return}if(scene==='success'){if(a.y>500&&a.y<620)start();return}if(scene!=='game')return;if(a.x>W-76&&a.x<W-6&&a.y>2&&a.y<80){paused=!paused;return}if(paused){paused=false;return}const role=btnAt(a);if(!role)return;ptrs[e.pointerId]=role;if(role==='j'){charging=true;charge=0}else syncKeys()});c.addEventListener('pointerup',e=>releasePtr(e.pointerId));c.addEventListener('pointercancel',e=>releasePtr(e.pointerId));c.addEventListener('pointerout',e=>{if(ptrs[e.pointerId])releasePtr(e.pointerId)});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();const k=(e.key||'').toLowerCase();if(e.key==='Escape'&&scene==='game')paused=!paused;if(e.key==='Enter'){if(scene==='menu'||scene==='success')start();else if(scene==='settings')scene='menu';return}if(e.key==='ArrowLeft'||k==='a'){kbd.l=true;syncKeys()}if(e.key==='ArrowRight'||k==='d'){kbd.r=true;syncKeys()}if((e.key===' '||e.key==='ArrowUp')&&!charging&&scene==='game'&&!paused){charging=true;charge=0}});window.addEventListener('keyup',e=>{const k=(e.key||'').toLowerCase();if((e.key===' '||e.key==='ArrowUp')&&charging)jump();if(e.key==='ArrowLeft'||k==='a'){kbd.l=false;syncKeys()}if(e.key==='ArrowRight'||k==='d'){kbd.r=false;syncKeys()}});
function drawButton(n,xx,yy,ww,hh,label){img(n,xx,yy,ww,hh);if(label){x.fillStyle='#fff1c5';x.font='bold 19px nanum';x.textAlign='center';x.fillText(label,xx+ww/2,yy+hh/2+7)}}
function frame(){requestAnimationFrame(frame);x.clearRect(0,0,W,H);if(scene==='menu'){img('title_bg',0,0,W,H);x.fillStyle='rgba(5,9,26,.78)';x.fillRect(0,0,255,H);x.textAlign='left';x.fillStyle='#ffe7a5';x.font='bold 38px nanum';x.fillText('성공하고싶은',25,280);x.fillText('재우',25,330);x.fillStyle='#c7dcff';x.font='18px nanum';x.fillText('한 번 더, 정상까지!',26,380);drawButton('menu_btn',24,490,230,70,'도전 시작하기');drawButton('settings_btn',24,590,230,70,'조작 설정');}
else if(scene==='settings'){x.fillStyle='#11172f';x.fillRect(0,0,W,H);x.fillStyle='#ffe4a0';x.font='bold 34px nanum';x.textAlign='center';x.fillText('조작 설정',240,150);x.fillStyle='white';x.font='21px nanum';x.fillText('조작 배치: '+['양쪽 분리','왼쪽 집중','오른쪽 집중'][layout],240,330);x.fillText('배치 변경',240,390);x.fillText('버튼 크기: '+scale.toFixed(1),240,480);x.fillText('크기 키우기',240,535);drawButton('menu_btn',80,730,320,68,'돌아가기')}
else if(scene==='game'){if(!paused){let dt=1/60;if(charging)charge=Math.min(1.1,charge+dt);if(eventT>0){eventT-=dt;if(eventT<=0)event=null}else if(Math.random()<dt/23)trigEvent();if(event?.kind===0)p.vx+=(Math.sin(Date.now()/700)*18);if(event?.kind===3)p.vx+=(Math.random()-.5)*12;if(event?.kind===2&&Math.random()<dt*.35)hit();let accel=keys.left?-1:keys.right?1:0;p.vx+=accel*(p.ground?1250:370)*dt;if(!accel)p.vx*=p.ground?.78:.985;p.vx=Math.max(-310,Math.min(310,p.vx));p.vy+=(event?.kind===5||event?.kind===8?780:1100)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(18,Math.min(462,p.x));p.ground=false;for(let a of plats){if(a.kind==='moving')a.x=a.base+Math.sin(Date.now()/750+a.phase)*48;if(a.broken)continue;if(p.vy>0&&p.x+p.w/2>a.x-a.w/2&&p.x-p.w/2<a.x+a.w/2&&p.y+p.h/2>=a.y-7&&p.y+p.h/2<=a.y+18){p.y=a.y-p.h/2;p.vy=0;p.ground=true;if(a.kind==='spike')hit();if(a.kind==='crumble'){a.t+=dt;if(a.t>.55)a.broken=true}}}if(p.y>900){reset()}if(p.y< -12300){scene='success'}if(p.y-380<cam)cam=p.y-380;else if(p.y-cam>H-140)cam=p.y-(H-140);best=Math.max(best,Math.max(0,(690-p.y)/10));localStorage.jwBest=best;if(cardT>0)cardT-=dt;}
let bg=imgs.world_bg;if(bg.complete&&bg.naturalWidth){let off=((cam*.25)%bg.height+bg.height)%bg.height;x.drawImage(bg,0,0,bg.width,bg.height,0,((off-H)%H),W,H*1.6)}else{x.fillStyle='#172b43';x.fillRect(0,0,W,H)}
for(let a of plats){let sy=a.y-cam;if(sy<-50||sy>H+50||a.broken)continue;img('platform_'+a.kind,a.x-a.w/2,sy-a.h/2,a.w,a.h)}let py=p.y-cam;img('player',p.x-20,py-30,40,56);
x.fillStyle='rgba(7,12,31,.78)';x.fillRect(10,10,460,105);x.textAlign='left';x.fillStyle='#dce9ff';x.font='16px nanum';let h=Math.max(0,Math.floor((690-p.y)/10));x.fillText(sections[Math.min(4,Math.floor(h/250))],22,36);x.fillText(`높이 ${h}m   최고 ${Math.floor(best)}m`,22,64);x.fillText(`발판 ${Math.min(90,Math.max(1,Math.floor(h/14)+1))} / 90`,22,91);x.fillStyle='#202d4c';x.fillRect(135,120,210,12);x.fillStyle='#ffc45a';x.fillRect(135,120,210*charge/1.1,12);drawButton('pause',W-66,12,50,48,'');const BR=btnRects();drawButton('left',BR.l.x,BR.l.y,BR.l.w,BR.l.h,'');drawButton('right',BR.r.x,BR.r.y,BR.r.w,BR.r.h,'');drawButton('jump',BR.j.x,BR.j.y,BR.j.w,BR.j.h,'');if(event&&cardT>0){img(event.good?'event_luck':'event_danger',35,145,410,140);x.textAlign='center';x.fillStyle=event.good?'#fff0b3':'#ffe0d9';x.font='bold 26px nanum';x.fillText(event.name,240,198);x.font='16px nanum';x.fillText(event.desc,240,235)}if(paused){x.fillStyle='#0a1028dd';x.fillRect(0,0,W,H);x.fillStyle='#fff0b5';x.textAlign='center';x.font='bold 32px nanum';x.fillText('일시정지',240,400);x.font='18px nanum';x.fillText('화면을 눌러 계속',240,445)}}
else if(scene==='success'){x.fillStyle='#11172e';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#ffe6a1';x.font='bold 34px nanum';x.fillText('정상 도착! 성공!',240,330);x.fillStyle='white';x.font='19px nanum';x.fillText('성공하고싶은 재우',240,380);drawButton('menu_btn',80,520,320,70,'다시 도전하기');}}
frame();
</script></body></html>
