<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>공유 화이트보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=JetBrains+Mono:wght@400;700&display=swap" />
<style>
:root{
  --bg:#eceff1; --panel:#ffffff; --panel2:#f5f7f8; --ink:#182230; --ink2:#5b6a7a; --line:#d7dee3;
  --accent:#0e7a5f; --accent2:#e4572e; --accent-soft:#e2f2ec; --danger:#d64545; --warn:#e8a13a;
  --shadow:0 8px 28px rgba(16,32,48,.16); --radius:12px;
  --tb:52px; color-scheme:light;
}
[data-theme="dark"]{ --bg:#141a20; --panel:#1e262f; --panel2:#232e39; --ink:#e8eef3; --ink2:#9db0c0; --line:#33414f; --accent-soft:#173d33; color-scheme:dark; }
[data-contrast="high"]{ --ink:#000; --ink2:#222; --line:#666; --accent:#00563f; }
[data-theme="dark"][data-contrast="high"]{ --ink:#fff; --ink2:#e8e8e8; --line:#9aa; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;font-size:14px;}
[data-bigtext="1"] body{font-size:16.5px;}
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem;}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:.32rem .6rem;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;justify-content:center;line-height:1.15;}
button:hover{border-color:var(--accent);color:var(--accent);}
button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
button.on:hover{color:#fff;}
button:disabled{opacity:.45;cursor:not-allowed;}
button.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff;}
input[type="text"],input[type="password"],input[type="number"],input[type="url"],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:.4rem .55rem;min-height:2.25rem;}
textarea{line-height:1.45;}
input[type="range"]{min-height:1.6rem;accent-color:var(--accent);}
input[type="color"]{width:2.4rem;height:2.25rem;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;}
label.chk{display:inline-flex;align-items:center;gap:.45rem;padding:.35rem .2rem;cursor:pointer;min-height:2.25rem;}
label.chk input{width:1.15rem;height:1.15rem;accent-color:var(--accent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
svg.ic{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
svg.ic .f{fill:currentColor;stroke:none;}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100dvh;}
#topbar{height:var(--tb);flex:none;display:flex;align-items:center;gap:.45rem;padding:0 .55rem;background:var(--panel);border-bottom:1px solid var(--line);z-index:60;position:relative;}
#topbar .ttl{font-weight:800;font-size:1.02rem;border:none;background:transparent;min-width:0;width:11.5rem;padding:.3rem .4rem;}
#topbar .ttl:hover{border:1px solid var(--line);}
.roomchip{display:flex;align-items:center;gap:.4rem;background:var(--accent-soft);border:1px solid var(--line);border-radius:999px;padding:.18rem .55rem .18rem .7rem;font-weight:700;white-space:nowrap;}
.roomchip code{font-family:"JetBrains Mono",monospace;font-size:.95rem;letter-spacing:.06em;}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;}
.dotlive.off{background:var(--warn);}
#avatars{display:flex;align-items:center;margin-left:.15rem;}
.av{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);margin-left:-7px;display:flex;align-items:center;justify-content:center;font-size:.95rem;color:#fff;font-weight:700;position:relative;cursor:pointer;flex:none;}
.av:first-child{margin-left:0;}
.av .hand{position:absolute;top:-9px;right:-6px;font-size:.72rem;}
#savestate{color:var(--ink2);font-size:.8rem;white-space:nowrap;}
#topbar .sp{flex:1;}
.tbtn{width:2.5rem;padding:.3rem;}
.tbtn .lbl{display:none;}

#main{flex:1;display:flex;min-height:0;position:relative;}
/* left toolbar */
#toolbar{flex:none;width:60px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:.45rem 0;gap:2px;overflow-y:auto;overflow-x:hidden;z-index:55;scrollbar-width:thin;}
#toolbar .sep{width:34px;border-top:1px solid var(--line);margin:.35rem 0;flex:none;}
.tool{width:44px;height:44px;border:none;background:transparent;border-radius:11px;display:flex;align-items:center;justify-content:center;position:relative;padding:0;}
.tool:hover{background:var(--panel2);color:var(--accent);}
.tool.on{background:var(--accent);color:#fff;}
.tool .fav{position:absolute;top:1px;right:2px;font-size:.55rem;color:var(--warn);display:none;}
.tool.faved .fav{display:block;}
#favrow{display:none;width:100%;flex-direction:column;align-items:center;gap:2px;}
#favrow.has{display:flex;}

/* board */
#boardwrap{flex:1;position:relative;min-width:0;overflow:hidden;background:#fff;}
#boardwrap.inv{filter:invert(1) hue-rotate(180deg);}
#boardwrap.gray{filter:grayscale(1);}
#boardwrap.invgray{filter:invert(1) hue-rotate(180deg) grayscale(1);}
canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block;}
#cvbg{z-index:1;} #mediaLayer{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none;}
#cv{z-index:3;touch-action:none;cursor:crosshair;}
#cvOverlay{z-index:4;pointer-events:none;}
.mediaObj{position:absolute;transform-origin:0 0;border:2px solid #2b7cd3;border-radius:8px;overflow:hidden;background:#000;pointer-events:none;}
.mediaObj .tag{position:absolute;top:0;left:0;background:#2b7cd3;color:#fff;font-size:11px;padding:2px 7px;font-weight:700;z-index:2;}
.mediaObj video,.mediaObj iframe{width:100%;height:100%;border:0;display:block;}
.mediaObj.audioM{background:var(--panel);display:flex;align-items:center;padding:6px;}
.mediaObj.audioM audio{width:100%;}
#remoteCursors{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;}
.rcursor{position:absolute;transform:translate(-2px,-2px);transition:left .07s linear,top .07s linear;will-change:left,top;}
.rcursor .nm{font-size:11px;font-weight:700;color:#fff;padding:1px 6px;border-radius:0 8px 8px 8px;margin-left:12px;white-space:nowrap;}
#laserFx{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden;}
.laserDot{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#ff3b30 0%,rgba(255,59,48,.45) 55%,transparent 72%);transform:translate(-50%,-50%);}

/* floating props */
#props{position:absolute;left:70px;top:10px;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:.55rem;width:238px;max-height:calc(100% - 130px);overflow-y:auto;}
#props h4{margin:.15rem 0 .45rem;font-size:.82rem;color:var(--ink2);letter-spacing:.02em;}
#props .row{display:flex;align-items:center;gap:.4rem;margin:.32rem 0;flex-wrap:wrap;}
#props .row label{font-size:.8rem;color:var(--ink2);width:3.4rem;flex:none;}
#swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:.3rem 0;}
.sw{aspect-ratio:1;border-radius:7px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;min-height:0;}
.sw.sel{outline:2px solid var(--accent);outline-offset:1px;}
#recentSw{display:flex;gap:4px;flex-wrap:wrap;}
#recentSw .sw{width:20px;height:20px;}
input[type=range].grow{flex:1;min-width:60px;}
.val{font-size:.78rem;color:var(--ink2);min-width:2rem;text-align:right;font-variant-numeric:tabular-nums;}

/* zoom + minimap */
#zoomctl{position:absolute;left:70px;bottom:12px;z-index:40;display:flex;gap:.3rem;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.2rem;box-shadow:var(--shadow);}
#zoomctl button{border:none;background:transparent;width:2.3rem;}
#zoomlbl{font-variant-numeric:tabular-nums;font-weight:700;min-width:3rem;text-align:center;}
#minimap{position:absolute;right:12px;bottom:12px;z-index:40;width:172px;height:118px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;}
#minimap canvas{width:100%;height:100%;display:block;}
#framebar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:41;display:none;gap:.35rem;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.25rem .5rem;box-shadow:var(--shadow);max-width:92%;overflow-x:auto;}
#framebar.has{display:flex;}
#framebar .fb{white-space:nowrap;font-size:.82rem;}

/* right panel */
#side{flex:none;width:308px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:55;min-height:0;}
#sidetabs{display:flex;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none;}
#sidetabs button{flex:1;border:none;border-radius:0;background:transparent;font-size:.8rem;font-weight:700;padding:.5rem .1rem;color:var(--ink2);white-space:nowrap;min-width:3.4rem;}
#sidetabs button.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);}
.sidepage{flex:1;overflow-y:auto;padding:.6rem;display:none;min-height:0;}
.sidepage.on{display:block;}
.sidepage h3{margin:.7rem 0 .4rem;font-size:.92rem;}
.sidepage h3:first-child{margin-top:0;}
.sidepage p.hint{color:var(--ink2);font-size:.82rem;line-height:1.5;margin:.25rem 0;}
.acc{border:1px solid var(--line);border-radius:10px;margin:.45rem 0;overflow:hidden;}
.acc>summary{padding:.55rem .65rem;font-weight:700;cursor:pointer;background:var(--panel2);list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:2.5rem;}
.acc>summary::-webkit-details-marker{display:none;}
.acc .accbody{padding:.55rem .65rem;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;}
.grid2 button,.grid3 button{font-size:.82rem;padding:.45rem .3rem;text-align:center;}
.wfull{width:100%;}
.mt{margin-top:.5rem;} .mb{margin-bottom:.5rem;}
.small{font-size:.8rem;color:var(--ink2);}
.kv{display:flex;justify-content:space-between;gap:.5rem;padding:.28rem 0;border-bottom:1px dashed var(--line);font-size:.86rem;}
.kv b{font-variant-numeric:tabular-nums;}

/* chat */
#chatlog{display:flex;flex-direction:column;gap:.45rem;padding-bottom:.4rem;}
.msg{max-width:92%;padding:.42rem .6rem;border-radius:12px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;word-break:break-word;line-height:1.4;}
.msg.me{align-self:flex-end;background:var(--accent-soft);}
.msg .who{font-size:.72rem;font-weight:800;margin-bottom:.12rem;}
.msg.sys{align-self:center;background:transparent;border:none;color:var(--ink2);font-size:.78rem;text-align:center;}
#chatbar{display:flex;gap:.35rem;}
#chatbar input{flex:1;min-width:0;}

/* lists */
.li{display:flex;align-items:center;gap:.5rem;padding:.45rem .5rem;border:1px solid var(--line);border-radius:10px;margin:.35rem 0;background:var(--panel);}
.li .grow{flex:1;min-width:0;}
.li .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pill{font-size:.72rem;font-weight:800;border-radius:999px;padding:.1rem .5rem;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;}
.pill.host{background:var(--accent);color:#fff;border-color:var(--accent);}
.pill.view{background:#f3e2c7;}
.commentpin{border-left:3px solid var(--warn);}

/* modals */
.modalWrap{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:.7rem;}
.modalWrap.open{display:flex;}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(680px,100%);max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;}
.modal.wide{width:min(880px,100%);}
.modal header{display:flex;align-items:center;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line);}
.modal header h2{font-size:1.05rem;margin:0;flex:1;}
.modal .mbody{padding:.8rem .9rem;overflow-y:auto;}
.modal footer{padding:.6rem .9rem;border-top:1px solid var(--line);display:flex;gap:.4rem;justify-content:flex-end;flex-wrap:wrap;}
.x{width:2.4rem;border:none;background:transparent;font-size:1.1rem;}

/* toast */
#toasts{position:fixed;top:calc(var(--tb) + 10px);left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:min(480px,94vw);}
.toast{background:var(--ink);color:var(--bg);padding:.55rem .9rem;border-radius:999px;font-size:.88rem;box-shadow:var(--shadow);animation:tin .25s ease;max-width:100%;text-align:center;}
@keyframes tin{from{opacity:0;transform:translateY(-6px);}to{opacity:1;}}
.reactionFloat{position:absolute;font-size:30px;animation:rfloat 1.6s ease-out forwards;pointer-events:none;z-index:8;}
@keyframes rfloat{from{opacity:1;transform:translateY(0) scale(.7);}to{opacity:0;transform:translateY(-90px) scale(1.25);}}

/* text editor overlay */
#textEditor{position:absolute;z-index:90;display:none;background:transparent;}
#textEditor textarea{background:rgba(255,255,255,.92);border:2px dashed var(--accent);border-radius:6px;padding:4px 6px;resize:both;min-width:120px;}
[data-theme="dark"] #textEditor textarea{background:rgba(20,26,32,.92);color:#fff;}

/* music studio */
#pianoKeys{display:flex;position:relative;height:150px;user-select:none;touch-action:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111;}
.wkey{flex:1;background:linear-gradient(#fdfdfd,#e8e8e8);border-right:1px solid #bbb;position:relative;cursor:pointer;}
.wkey:active,.wkey.hit{background:#ffd9a8;}
.wkey .klab{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;color:#888;}
.bkey{position:absolute;top:0;height:58%;background:linear-gradient(#444,#0a0a0a);border-radius:0 0 5px 5px;z-index:2;cursor:pointer;border:1px solid #000;}
.bkey:active,.bkey.hit{background:#7a4b12;}
.seqgrid{display:grid;gap:3px;}
.seqcell{aspect-ratio:1;border-radius:5px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;padding:0;min-height:0;}
.seqcell.on{background:var(--accent);border-color:var(--accent);}
.seqcell.play{outline:2px solid var(--warn);}
#staffCv{width:100%;height:110px;background:#fff;border:1px solid var(--line);border-radius:10px;}
[data-theme="dark"] #staffCv{background:#f4f4f4;}

/* games */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:230px;}
.ttt button{aspect-ratio:1;font-size:1.7rem;font-weight:800;padding:0;}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:300px;}
.c4 button{aspect-ratio:1;border-radius:50%;padding:0;font-size:1rem;}
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:280px;}
.bingo button{aspect-ratio:1;padding:0;font-weight:700;}
.bingo button.hit{background:var(--accent);color:#fff;}
.flashcard{border:2px solid var(--accent);border-radius:14px;padding:1.4rem 1rem;text-align:center;font-size:1.3rem;font-weight:800;cursor:pointer;background:var(--accent-soft);min-height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.3rem;}
table.mini{border-collapse:collapse;width:100%;font-size:.82rem;}
table.mini td,table.mini th{border:1px solid var(--line);padding:.28rem .35rem;text-align:left;}
.ptable{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;font-size:.62rem;}
.ptable div{border:1px solid var(--line);border-radius:4px;padding:2px 1px;text-align:center;background:var(--panel2);}

#presentBar{position:fixed;inset:auto 0 0 0;z-index:300;background:rgba(12,18,24,.92);color:#fff;display:none;padding:.6rem;gap:.5rem;align-items:center;justify-content:center;flex-wrap:wrap;}
#presentBar.open{display:flex;}
#presentBar button{background:#2a3644;color:#fff;border-color:#43536a;}
body.focusUI #topbar,body.focusUI #toolbar,body.focusUI #side,body.focusUI #props,body.focusUI #minimap{display:none!important;}
body.focusUI #zoomctl{left:12px;}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:350;overflow:hidden;}
.confettiBit{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cfall linear forwards;}
@keyframes cfall{to{transform:translateY(105vh) rotate(560deg);opacity:.85;}}

@media (max-width:900px){
  #side{display:none;position:absolute;right:0;top:0;bottom:0;width:min(320px,88vw);box-shadow:var(--shadow);}
  #side.open{display:flex;}
  #topbar{gap:.25rem;padding:0 .35rem;}
  #topbar .ttl{width:5.6rem;font-size:.95rem;}
  #btnHand{display:none;}
  .roomchip{padding:.12rem .4rem;font-size:.85rem;}
  #avatars .av{width:26px;height:26px;}
  #props{left:8px;top:8px;width:min(232px,72vw);}
  #zoomctl{left:8px;bottom:64px;}
  #minimap{width:118px;height:82px;bottom:64px;}
  #toolbar{position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;height:58px;flex-direction:row;border-right:none;border-top:1px solid var(--line);padding:.3rem .4rem;overflow-x:auto;overflow-y:hidden;align-items:center;}
  #toolbar .sep{width:1px;height:32px;border-top:none;border-left:1px solid var(--line);margin:0 .3rem;}
  #favrow{flex-direction:row;width:auto;}
  #favrow.has{display:flex;}
  #boardwrap{margin-bottom:58px;}
  #topbar .ttl{width:7.2rem;}
  #savestate{display:none;}
  .tool{width:46px;height:46px;flex:none;}
}
@media print{
  body>*{display:none!important;}
  #printArea{display:block!important;position:static;}
  #printArea img{width:100%;}
}
#printArea{display:none;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<div id="app">
  <!-- ======= TOP BAR ======= -->
  <div id="topbar">
    <input class="ttl" id="boardTitle" type="text" value="우리 반 화이트보드" aria-label="보드 제목" />
    <div class="roomchip" title="현재 방 코드"><span class="dotlive" id="liveDot"></span>방 <code id="roomCodeLbl">------</code></div>
    <div id="avatars" aria-label="참여자"></div>
    <span id="savestate" role="status">자동 저장 준비됨</span>
    <div class="sp"></div>
    <button id="btnHand" title="손들기">✋ 손들기</button>
    <button id="btnShare" title="방 공유 (QR/링크)">공유</button>
    <button id="btnPresent" title="발표 모드">발표</button>
    <button id="btnSide" title="패널 열기/닫기">패널</button>
    <button id="btnMore" title="저장 · 내보내기 · 더보기">☰</button>
  </div>

  <div id="main">
    <!-- ======= TOOLBAR ======= -->
    <nav id="toolbar" aria-label="도구 모음"></nav>

    <!-- ======= BOARD ======= -->
    <div id="boardwrap">
      <canvas class="layer" id="cvbg"></canvas>
      <div id="mediaLayer"></div>
      <canvas class="layer" id="cv"></canvas>
      <canvas class="layer" id="cvOverlay"></canvas>
      <div id="remoteCursors"></div>
      <div id="laserFx"></div>

      <div id="props" hidden></div>

      <div id="zoomctl">
        <button id="zoomOut" aria-label="축소">−</button>
        <span id="zoomlbl">100%</span>
        <button id="zoomIn" aria-label="확대">＋</button>
        <button id="zoomFit" title="전부 보기" style="width:auto;padding:0 .5rem;">전부</button>
        <button id="zoomHome" title="원점" style="width:auto;padding:0 .5rem;">원점</button>
      </div>
      <div id="framebar"></div>
      <div id="minimap" title="미니맵 — 누르면 이동"><canvas id="mmCv" width="344" height="236"></canvas></div>
      <div id="textEditor"><textarea id="textArea" rows="2"></textarea></div>
    </div>

    <!-- ======= SIDE PANEL ======= -->
    <aside id="side" aria-label="사이드 패널">
      <div id="sidetabs" role="tablist">
        <button data-tab="props" class="on">속성</button>
        <button data-tab="chat">채팅</button>
        <button data-tab="people">사람·방</button>
        <button data-tab="extra">추가기능</button>
        <button data-tab="set">설정</button>
      </div>

      <section class="sidepage on" id="page-props"></section>

      <section class="sidepage" id="page-chat">
        <div id="chatlog" aria-live="polite"></div>

<script>
"use strict";
/* ================================================================

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

/* ---------------- state ---------------- */
const ME={ id:uid(), name:"나", color:"#e4572e", avatar:"🦊", anon:false, role:"host", hand:false, muted:false };
const PALETTE=["#182230","#ffffff","#e4572e","#f2a007","#ffd60a","#2fbf71","#0e7a5f","#2b7cd3","#123c69","#7c4dbd","#e75480","#8d6e63","#607d8b","#000000","#9e9e9e","#ff8a65","#4fc3f7","#aed581","#ba68c8","#f06292","#795548","#00acc1","#5c6bc0","#26a69a"];
const CB_PALETTE=["#000000","#e69f00","#56b4e9","#009e73","#f0e442","#0072b2","#d55e00","#cc79a7","#ffffff","#999999"]; // 색맹 친화 (Okabe-Ito)
const STICKY_COLORS=["#fff3a3","#ffd1dc","#c8f2c8","#bfe3ff","#e6ccff","#ffe0b2"];
const state={
  tool:"pen", color:"#182230", fill:"none", width:4, opacity:1, dash:"solid",
  font:"sans", fontSize:28, bold:false, italic:false, align:"left",
  bg:"dots", bgColor:"#ffffff", theme:"light",
  snap:false, guides:true, correct:false, palm:2, pressureCurve:1, tilt:true,
  drawSound:false, haptics:false, lang:"ko", followId:null, presenting:false,
  myRole:"editor", exportLock:false, bgImage:null, viewFilter:"",
  brushPreset:{name:"기본 펜",dash:[],jitter:0}, favTools:[], customPalettes:[], recentColors:[],
  penBtnAction:"eraser", captionSize:14, speechRate:1, voiceLang:"ko-KR",
};
let objects=[];            // 보드 객체 (z 순서)
let cam={x:0,y:0,z:1};
let selected=new Set();    // 선택된 객체 id
let clipboard=[]; let trash=[]; let versions=[]; let activityLog=[]; let commentsAll=[];
let undoStack=[], redoStack=[];
let framesCache=[];        // 프레임 목록 (objects에서 파생)
const imgCache=new Map();  // src -> HTMLImageElement
function getImg(src){ if(imgCache.has(src)) return imgCache.get(src); const im=new Image(); im.onload=()=>{imgCache.set(src,im);dirty();}; imgCache.set(src,im); im.src=src; return im; }
function logAct(text){ activityLog.unshift({t:nowT(),who:ME.anon?"익명":ME.name,text}); if(activityLog.length>120)activityLog.pop(); renderActivity(); }
function myName(){ return ME.anon?"익명":ME.name; }

/* ---------------- canvas layers ---------------- */
const wrap=$("#boardwrap"), cvBg=$("#cvbg"), cv=$("#cv"), cvOv=$("#cvOverlay");
const gBg=cvBg.getContext("2d"), g=cv.getContext("2d"), gOv=cvOv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){ const r=wrap.getBoundingClientRect(); W=r.width; H=r.height; DPR=Math.min(devicePixelRatio||1,2);
  [cvBg,cv,cvOv].forEach(c=>{c.width=W*DPR;c.height=H*DPR;}); dirtyBg(); dirty(); }
new ResizeObserver(()=>resize()).observe(wrap);
const w2s=(x,y)=>({x:(x-cam.x)*cam.z, y:(y-cam.y)*cam.z});
const s2w=(x,y)=>({x:x/cam.z+cam.x, y:y/cam.z+cam.y});
function viewWorld(){ return {x0:cam.x,y0:cam.y,x1:cam.x+W/cam.z,y1:cam.y+H/cam.z}; }

/* ---------------- render scheduling ---------------- */
let needBg=true, needMain=true, rafId=0;
function dirty(){ needMain=true; schedule(); }
function dirtyBg(){ needBg=true; schedule(); }
function schedule(){ if(!rafId) rafId=requestAnimationFrame(frame); }
function frame(){ rafId=0; if(needBg){needBg=false;drawBg();} if(needMain){needMain=false;drawMain();} drawOverlay(); if(needBg||needMain) schedule(); }

/* ---------------- background ---------------- */
const BG_COLORS={white:"#ffffff",grid:"#ffffff",dots:"#ffffff",lines:"#ffffff",dark:"#20262e",blueprint:"#123c69",chalk:"#2f4f3e",cork:"#c8a165"};
function drawBg(){ const c=gBg; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  const base = state.bgImage? "#ffffff" : (state.bg==="dark"||state.bg==="blueprint"||state.bg==="chalk") ? BG_COLORS[state.bg] : state.bgColor;
  c.fillStyle=base; c.fillRect(0,0,W,H);
  if(state.bgImage){ const im=getImg(state.bgImage); if(im.complete&&im.naturalWidth){ c.globalAlpha=.5; const sc=Math.max(W/im.naturalWidth,H/im.naturalHeight); c.drawImage(im,0,0,im.naturalWidth*sc,im.naturalHeight*sc); c.globalAlpha=1; } }
  const kind=state.bg; if(kind==="white") return;
  const step=28*cam.z; if(step<7) return;
  const ox=(-cam.x*cam.z)%step, oy=(-cam.y*cam.z)%step;
  const darkBg=(kind==="dark"||kind==="blueprint"||kind==="chalk");
  if(kind==="dots"){ c.fillStyle=darkBg?"rgba(255,255,255,.28)":"rgba(30,50,70,.20)";
    for(let x=ox;x<W;x+=step) for(let y=oy;y<H;y+=step){ c.beginPath(); c.arc(x,y,1.4,0,7); c.fill(); } }
  else if(kind==="grid"||kind==="blueprint"||kind==="dark"||kind==="chalk"){ c.strokeStyle=darkBg?"rgba(255,255,255,.16)":"rgba(30,50,70,.13)"; c.lineWidth=1; c.beginPath();
    for(let x=ox;x<W;x+=step){c.moveTo(x,0);c.lineTo(x,H);} for(let y=oy;y<H;y+=step){c.moveTo(0,y);c.lineTo(W,y);} c.stroke(); }
  else if(kind==="lines"){ c.strokeStyle="rgba(43,124,211,.30)"; c.lineWidth=1; c.beginPath(); for(let y=oy;y<H;y+=step){c.moveTo(0,y);c.lineTo(W,y);} c.stroke(); }
  else if(kind==="cork"){ c.fillStyle="rgba(120,72,20,.12)"; for(let i=0;i<40;i++){ c.fillRect((i*97)%W,(i*57)%H,3,3);} }
}

/* ---------------- object geometry ---------------- */
function objBBox(o){ switch(o.type){
  case "stroke": { let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0; o.pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}); const pad=(o.w||4)/2+2; return {x:x0-pad,y:y0-pad,w:x1-x0+pad*2,h:y1-y0+pad*2}; }
  case "text": { const w=o.w||measureTextW(o); return {x:o.x,y:o.y,w,h:(o.size*1.35)*(o.text.split("\n").length)}; }
  case "math": return {x:o.x,y:o.y,w:o.w||o.text.length*o.size*.62,h:o.size*1.5};
  case "sticker": case "stamp": return {x:o.x,y:o.y,w:o.size,h:o.size};
  case "reaction": return {x:o.x,y:o.y,w:34,h:34};
  case "comment": return {x:o.x-14,y:o.y-14,w:28,h:28};
  case "audio": case "dom": case "image": case "shape": case "frame": case "sticky": case "link": case "code": case "chart": case "table": case "checklist": case "connector": 
    if(o.type==="connector"){ const a=byId(o.from),b=byId(o.to); if(!a||!b) return {x:o.x||0,y:o.y||0,w:10,h:10}; const ca=center(a),cb=center(b); return {x:Math.min(ca.x,cb.x),y:Math.min(ca.y,cb.y),w:Math.abs(ca.x-cb.x)||10,h:Math.abs(ca.y-cb.y)||10}; }
    return {x:o.x,y:o.y,w:o.w||100,h:o.h||80};
  default: return {x:o.x||0,y:o.y||0,w:o.w||60,h:o.h||60};
}}
function center(o){ const b=objBBox(o); return {x:b.x+b.w/2,y:b.y+b.h/2}; }
function byId(id){ return objects.find(o=>o.id===id); }
function measureTextW(o){ g.font=`${o.italic?"italic ":""}${o.bold?"700 ":""}${o.size}px ${fontStack(o.font)}`; return Math.max(...o.text.split("\n").map(l=>g.measureText(l).width),10); }
function fontStack(f){ return f==="hand"?'"Gaegu","Nanum Pen Script",cursive': f==="mono"?'"JetBrains Mono",monospace': f==="serif"?'Georgia,"Times New Roman",serif':'"Pretendard Variable",Pretendard,sans-serif'; }

/* ---------------- draw objects ---------------- */
function drawMain(){ const c=g; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  c.translate(-cam.x*cam.z,-cam.y*cam.z); c.scale(cam.z,cam.z);
  const v=viewWorld(), pad=80/cam.z+80;
  for(const o of objects){ const b=objBBox(o);
    if(b.x+b.w<v.x0-pad||b.y+b.h<v.y0-pad||b.x>v.x1+pad||b.y>v.y1+pad) continue; // 뷰포트 컬링
    c.save(); drawObj(c,o); c.restore(); }
  syncMediaLayer();
}
function dashArr(o){ return o.dash==="dash"?[10,7]:o.dash==="dot"?[2,6]:[]; }
function strokeStyle(c,o){ c.strokeStyle=o.color; c.lineWidth=o.sw!=null?o.sw:(o.w||3); c.globalAlpha=o.opacity??1; c.setLineDash(dashArr(o)); c.lineCap="round"; c.lineJoin="round"; }
function drawObj(c,o){ switch(o.type){
  case "stroke": drawStroke(c,o); break;
  case "shape": drawShape(c,o); break;
  case "connector": { const a=byId(o.from),b=byId(o.to); if(!a||!b)break; const ca=center(a),cb=center(b); strokeStyle(c,{...o,color:o.color||"#5b6a7a",w:o.w||3}); c.beginPath(); c.moveTo(ca.x,ca.y);
    if(o.curve){ const mx=(ca.x+cb.x)/2; c.bezierCurveTo(mx,ca.y,mx,cb.y,cb.x,cb.y);} else c.lineTo(cb.x,cb.y); c.stroke();
    const ang=Math.atan2(cb.y-ca.y,cb.x-ca.x); c.setLineDash([]); c.fillStyle=o.color||"#5b6a7a"; c.beginPath(); c.moveTo(cb.x,cb.y); c.lineTo(cb.x-12*Math.cos(ang-.42),cb.y-12*Math.sin(ang-.42)); c.lineTo(cb.x-12*Math.cos(ang+.42),cb.y-12*Math.sin(ang+.42)); c.closePath(); c.fill(); break; }
  case "text": case "math": { c.globalAlpha=o.opacity??1; c.fillStyle=o.color; const fam=o.type==="math"?'italic Georgia,serif':fontStack(o.font);
    c.font=`${o.type==="math"?"italic ":o.italic?"italic ":""}${o.bold?"700 ":""}${o.size}px ${o.type==="math"?"Georgia,serif":fontStack(o.font)}`;
    c.textAlign=o.align||"left"; c.textBaseline="top";
    const lines=o.text.split("\n"); const ax=o.align==="center"?o.x+(o.w||measureTextW(o))/2 : o.align==="right"? o.x+(o.w||measureTextW(o)) : o.x;
    lines.forEach((l,i)=>c.fillText(l,ax,o.y+i*o.size*1.35)); if(o.underline){ c.fillRect(o.x,o.y+lines.length*o.size*1.35+2,(o.w||measureTextW(o)),Math.max(2,o.size/12)); } break; }
  case "sticky": { c.globalAlpha=o.opacity??1; c.fillStyle=o.color; roundRect(c,o.x,o.y,o.w,o.h,8); c.fill();
    c.fillStyle="rgba(0,0,0,.16)"; c.fillRect(o.x,o.y,o.w,14);
    c.fillStyle="#26303a"; c.font=`${o.size||17}px "Pretendard Variable",sans-serif`; c.textBaseline="top";
    wrapText(c,o.text,o.x+10,o.y+22,o.w-20,(o.size||17)*1.4,o.h-26); break; }
  case "frame": { c.globalAlpha=1; c.fillStyle="rgba(255,255,255,.55)"; if(state.bg==="dark"||state.bg==="chalk")c.fillStyle="rgba(255,255,255,.08)"; roundRect(c,o.x,o.y,o.w,o.h,6); c.fill();
    c.strokeStyle="#2b7cd3"; c.lineWidth=2.5; c.setLineDash([9,6]); roundRect(c,o.x,o.y,o.w,o.h,6); c.stroke(); c.setLineDash([]);
    c.fillStyle="#2b7cd3"; c.font="700 17px Pretendard,sans-serif"; c.textBaseline="bottom"; c.fillText("▦ "+(o.title||"프레임"),o.x+4,o.y-6); break; }
  case "image": { const im=getImg(o.src); c.globalAlpha=o.opacity??1; c.save(); const b={x:o.x,y:o.y,w:o.w,h:o.h};
    if(o.rotation){ c.translate(b.x+b.w/2,b.y+b.h/2); c.rotate(o.rotation*Math.PI/180); c.translate(-b.w/2,-b.h/2); b.x=0;b.y=0; }
    if(o.filter) c.filter=o.filter;
    if(im.complete&&im.naturalWidth) c.drawImage(im,b.x,b.y,b.w,b.h); else { c.fillStyle="#dde3e8"; c.fillRect(b.x,b.y,b.w,b.h); }
    c.restore(); break; }
  case "sticker": case "stamp": { c.globalAlpha=o.opacity??1; c.font=`${o.size}px serif`; c.textAlign="center"; c.textBaseline="middle";
    if(o.type==="stamp"&&o.shape){ drawStampShape(c,o); } else c.fillText(o.emoji,o.x+o.size/2,o.y+o.size/2); break; }
  case "reaction": { c.font="30px serif"; c.textAlign="center"; c.textBaseline="middle"; c.fillText(o.emoji,o.x+17,o.y+17); break; }
  case "comment": { c.fillStyle="#e8a13a"; c.beginPath(); c.arc(o.x,o.y,13,0,7); c.fill(); c.fillStyle="#fff"; c.font="700 14px sans-serif"; c.textAlign="center"; c.textBaseline="middle"; c.fillText("💬".length?"!": "!",o.x,o.y+1); c.fillStyle="#fff"; c.fillText(String(o.comments.length),o.x,o.y+1); break; }
  case "link": { c.globalAlpha=o.opacity??1; c.fillStyle=state.theme==="dark"?"#232e39":"#ffffff"; roundRect(c,o.x,o.y,o.w,o.h,10); c.fill(); c.strokeStyle="#2b7cd3"; c.lineWidth=1.6; roundRect(c,o.x,o.y,o.w,o.h,10); c.stroke();
    c.fillStyle="#2b7cd3"; c.fillRect(o.x,o.y,o.w,34); c.fillStyle="#fff"; c.font="700 14px Pretendard,sans-serif"; c.textBaseline="middle"; c.fillText("🔗 링크 카드",o.x+10,o.y+18);
    c.fillStyle=state.theme==="dark"?"#e8eef3":"#182230"; c.font="700 16px Pretendard,sans-serif"; wrapText(c,o.title||o.url,o.x+10,o.y+44,o.w-20,21,44);
    c.fillStyle="#5b6a7a"; c.font="12.5px 'JetBrains Mono',monospace"; wrapText(c,o.url,o.x+10,o.y+o.h-30,o.w-20,16,28); break; }
  case "code": { c.globalAlpha=o.opacity??1; c.fillStyle="#141a20"; roundRect(c,o.x,o.y,o.w,o.h,9); c.fill();
    c.fillStyle="#232e39"; c.fillRect(o.x,o.y,o.w,26); c.fillStyle="#ffb454"; c.font="700 12px 'JetBrains Mono',monospace"; c.textBaseline="middle"; c.fillText("〈/〉 "+(o.lang||"code"),o.x+9,o.y+14);
    c.font="13.5px 'JetBrains Mono',monospace"; c.textBaseline="top";
    o.text.split("\n").slice(0,Math.floor((o.h-34)/19)).forEach((l,i)=>{ c.fillStyle=/^\s*(\/\/|#)/.test(l)?"#7a8a99":/(function|const|let|var|return|if|for|class|import)/.test(l)?"#c792ea":"#d6e2ee"; c.fillText(l.slice(0,60),o.x+10,o.y+32+i*19); }); break; }
  case "chart": drawChart(c,o); break;
  case "table": drawTable(c,o); break;
  case "checklist": { c.globalAlpha=o.opacity??1; c.fillStyle=state.theme==="dark"?"#232e39":"#fff"; roundRect(c,o.x,o.y,o.w,o.h,9); c.fill(); c.strokeStyle="#b9c4cd"; c.lineWidth=1.4; roundRect(c,o.x,o.y,o.w,o.h,9); c.stroke();
    c.fillStyle=state.theme==="dark"?"#e8eef3":"#182230"; c.font="700 16px Pretendard,sans-serif"; c.textBaseline="top"; c.fillText(o.title||"체크리스트",o.x+12,o.y+10);
    c.font="15px Pretendard,sans-serif"; o.items.forEach((it,i)=>{ const y=o.y+40+i*26; if(y>o.y+o.h-20)return;
      c.strokeStyle="#8fa1b3"; c.strokeRect(o.x+12,y+2,15,15); if(it.done){ c.fillStyle="#0e7a5f"; c.font="700 15px sans-serif"; c.fillText("✓",o.x+14,y); c.font="15px Pretendard,sans-serif"; }
      c.fillStyle=it.done?"#8fa1b3":(state.theme==="dark"?"#e8eef3":"#26303a"); c.fillText((it.done?"̶":"")+it.t,o.x+36,y+1); }); break; }
  case "dom": case "audio": break; // DOM 레이어에서 그림
}}
function drawStampShape(c,o){ const cx=o.x+o.size/2, cy=o.y+o.size/2, r=o.size/2-3; c.fillStyle=o.color||"#e4572e"; c.strokeStyle=o.color||"#e4572e"; c.lineWidth=3;

function correctStroke(st){ const pts=st.pts; if(pts.length<8)return null;

  const d0=Math.hypot(pts[0].x-pts[pts.length-1].x,pts[0].y-pts[pts.length-1].y);
  const closed=d0<Math.max(w,h)*.38;
  const base={color:st.color,sw:Math.max(2,st.w),fill:"none",opacity:1,dash:"solid"};
  if(!closed){ // 직선 판정: 시작-끝 직선에서 평균 편차
    const a=pts[0],b=pts[pts.length-1]; const len=Math.hypot(b.x-a.x,b.y-a.y)||1; let dev=0;
    pts.forEach(p=>{ dev+=Math.abs((b.y-a.y)*p.x-(b.x-a.x)*p.y+b.x*a.y-b.y*a.x)/len; }); dev/=pts.length;
    if(dev<len*.06) return {type:"shape",shape:"line",x:a.x,y:a.y,w:b.x-a.x,h:b.y-a.y,...base};
    return null; }
  // 원 판정: 중심 거리 분산
  const cx=(x0+x1)/2, cy=(y0+y1)/2; const rs=pts.map(p=>Math.hypot(p.x-cx,p.y-cy)); const rm=rs.reduce((s,v)=>s+v,0)/rs.length;

  if(Math.sqrt(variance)<rm*.16&&Math.abs(w-h)<Math.max(w,h)*.45) return {type:"shape",shape:"ellipse",x:x0,y:y0,w,h,...base};
  // 사각형 판정: 모서리 근처 점 밀도
  const cornerScore=pts.filter(p=>{ const dx=Math.min(Math.abs(p.x-x0),Math.abs(p.x-x1)), dy=Math.min(Math.abs(p.y-y0),Math.abs(p.y-y1)); return dx<w*.16||dy<h*.16; }).length/pts.length;

/* ---------------- modal ---------------- */
function openModal(title,html,footBtns){ $("#modalTitle").textContent=title; $("#modalBody").innerHTML=html;
  const f=$("#modalFoot"); f.innerHTML=""; (footBtns||[]).forEach(b=>{ const btn=document.createElement("button"); btn.textContent=b.label; if(b.primary)btn.className="on"; btn.addEventListener("click",()=>{ b.fn&&b.fn(); if(!b.keep)closeModal(); }); f.appendChild(btn); });
  const cb=document.createElement("button"); cb.textContent="닫기"; cb.addEventListener("click",closeModal); f.appendChild(cb);
  $("#modalWrap").classList.add("open"); $("#modalBox").classList.toggle("wide",!!openModal.wide); }
function closeModal(){ $("#modalWrap").classList.remove("open"); }
$("#modalX").addEventListener("click",closeModal);
$("#modalWrap").addEventListener("click",e=>{ if(e.target.id==="modalWrap")closeModal(); });

/* ---------------- side tabs ---------------- */
$$("#sidetabs button").forEach(b=>b.addEventListener("click",()=>{ $$("#sidetabs button").forEach(x=>x.classList.toggle("on",x===b));
  $$(".sidepage").forEach(p=>p.classList.toggle("on",p.id==="page-"+b.dataset.tab)); if(innerWidth<=900)$("#side").classList.add("open"); }));
$("#btnSide").addEventListener("click",()=>{ if(innerWidth<=900)$("#side").classList.toggle("open"); else { const s=$("#side"); s.style.display=s.style.display==="none"?"":"none"; setTimeout(resize,30); } });

/* ---------------- chat ---------------- */
const chatLog=$("#chatlog");
function addChat(who,text,me,sys){ const d=document.createElement("div"); d.className="msg"+(sys?" sys":me?" me":"");
  d.innerHTML=sys?esc(text):`<div class="who" style="color:${me?state.color:"#2b7cd3"}">${esc(who)}</div>${esc(text)}`;
  chatLog.appendChild(d); chatLog.parentElement.scrollTop=1e7; if(chatLog.children.length>200)chatLog.firstChild.remove(); }
function sendChat(){ const v=$("#chatInput").value.trim(); if(!v)return; $("#chatInput").value="";
  const mid=uid(); seenChatIds.add(mid); addChat(myName(),v,true); broadcast({t:"chat",who:myName(),text:v,mid}); if(state.haptics&&navigator.vibrate)navigator.vibrate(5); }
$("#chatSend").addEventListener("click",sendChat);
$("#chatInput").addEventListener("keydown",e=>{ if(e.key==="Enter")sendChat(); e.stopPropagation(); });
$("#chatTranslate").addEventListener("click",()=>{ const last=[...chatLog.querySelectorAll(".msg:not(.sys)")].pop(); const txt=last?last.textContent:""; window.open("https://translate.google.com/?sl=auto&tl=en&text="+encodeURIComponent(txt),"__blank"); });
const REACTS=["👍","❤️","😂","😮","🎉","🔥"];
$("#reactRow").innerHTML=REACTS.map(r=>`<button data-react="${r}" style="font-size:1.3rem">${r}</button>`).join("");
$$("#reactRow [data-react]").forEach(b=>b.addEventListener("click",()=>{ const c=s2w(W/2,H/2); addObject({type:"reaction",emoji:b.dataset.react,x:c.x-17,y:c.y-17}); floatReaction(b.dataset.react,c); broadcast({t:"react",emoji:b.dataset.react}); }));

/* ---------------- people / room page ---------------- */
let peers=new Map(); // id -> {name,color,avatar,role,hand,muted,last,cam}
function renderPeople(){ const el=$("#page-people"); if(!el)return;
  const plist=[{id:ME.id,name:myName()+(ME.anon?"":" (나)"),color:ME.color,avatar:ME.avatar,role:ME.role,hand:ME.hand,me:true},...peers.values()];
  el.innerHTML=`<h3>방 관리</h3>
  <div class="kv"><span>방 코드</span><b>${roomCode}</b></div>
  <div class="kv"><span>내 권한</span><b>${ME.role==="host"?"방장":"참여자"} · ${state.myRole==="viewer"?"보기 전용":"그리기 가능"}</b></div>
  <div class="kv"><span>연결 방식</span><b>${!WB_FB_URL?"같은 기기 탭끼리만":fbIsConnected?"Firebase 실시간 — 다른 기기도 같은 방이면 바로 연결":"Firebase 연결 중…"}</b></div>

  :`<p class="hint">다른 기기(아이패드·폰·PC)와 실시간으로 같이 그리려면, 화이트보드 전용으로 만든 Firebase 프로젝트의 Realtime Database URL이 필요해요. 채팅방에서 쓰는 Firebase와는 따로 쓰는 전용 프로젝트예요.</p>`}

  <p class="hint">화이트보드 전용 Firebase가 기본으로 연결돼 있어서, 따로 설정하지 않아도 다른 기기와 실시간으로 같이 그릴 수 있어요. 다른 데이터베이스로 바꾸고 싶을 때만 위 칸에 새 주소를 붙여넣고 연결을 누르세요. 바꾼 주소는 이 기기의 이번 세션에만 적용돼요.</p>
  <div class="grid2 mt"><button id="pNewRoom">새 방 만들기</button><button id="pJoin">코드로 참가</button>
  <button id="pQR">QR로 입장</button><button id="pCopyCode">방 코드 복사</button></div>
  <label class="chk"><input type="checkbox" id="pAnon" ${ME.anon?"checked":""}> 익명 모드 (이름 없이 참여)</label>
  <div class="row" style="display:flex;gap:.35rem;align-items:center"><span class="small">닉네임</span><input type="text" id="pName" value="${esc(ME.name)}" style="flex:1"><button id="pNameOk">변경</button></div>
  <div class="row" style="display:flex;gap:.35rem;align-items:center"><span class="small">아바타</span><input type="text" id="pAvatar" value="${esc(ME.avatar)}" maxlength="2" style="width:4rem"><span class="small">커서 색</span><input type="color" id="pCurColor" value="${ME.color}"></div>
  <h3>참여자 (${plist.length})</h3>
  ${plist.map(p=>`<div class="li"><span class="av" style="background:${p.color};margin:0">${esc(p.avatar||"🙂")}${p.hand?'<span class="hand">✋</span>':""}</span>
    <div class="grow"><div class="nm">${esc(p.name)} ${p.muted?"🔇":""}</div><div class="small">${p.role==="host"?"방장":"참여자"}</div></div>
    ${!p.me&&state.followId===p.id?'<span class="pill host">따라가는 중</span>':""}
    ${!p.me?`<button data-follow="${p.id}">따라가기</button>`:""}
    ${ME.role==="host"&&!p.me?`<button data-role="${p.id}">권한</button><button data-mute="${p.id}">음소거</button>`:""}
  </div>`).join("")||""}
  <h3>최근 방</h3>${recentRooms.map(r=>`<div class="li"><div class="grow"><div class="nm">${esc(r.title)}</div><div class="small">코드 ${r.code} · ${esc(r.when)}</div></div><button data-rejoin="${r.code}">입장</button></div>`).join("")||'<p class="hint">아직 없어요.</p>'}
  <h3>활동 기록</h3><div id="actLog"></div>`;
  renderActivity();
  const on=(id,fn)=>{ const e2=el.querySelector(id); if(e2)e2.addEventListener("click",fn); };
  on("#pNewRoom",()=>roomDialog(true)); on("#pJoin",()=>roomDialog(false)); on("#pQR",showQR); on("#pCopyCode",()=>{ navigator.clipboard&&navigator.clipboard.writeText(roomCode); toast("방 코드를 복사했어요: "+roomCode); });
  on("#pFbGo",()=>fbSetUrl(el.querySelector("#pFbUrl")?el.querySelector("#pFbUrl").value:""));
  const an=el.querySelector("#pAnon"); an.addEventListener("change",()=>{ ME.anon=an.checked; broadcastPresence(); renderPeople(); renderAvatars(); toast(ME.anon?"익명으로 표시돼요":"이름이 표시돼요"); });
  on("#pNameOk",()=>{ ME.name=el.querySelector("#pName").value.trim()||"나"; ME.avatar=el.querySelector("#pAvatar").value||"🦊"; ME.color=el.querySelector("#pCurColor").value; broadcastPresence(); renderPeople(); renderAvatars(); toast("프로필을 바꿨어요"); });

  el.querySelectorAll("[data-role]").forEach(b=>b.addEventListener("click",()=>{ broadcast({t:"setrole",to:b.dataset.role,role:"viewer"}); toast("상대에게 보기 전용 권한을 보냈어요 (한 번 더 누르면 그리기)"); broadcast({t:"setrole2",to:b.dataset.role}); }));
  el.querySelectorAll("[data-mute]").forEach(b=>b.addEventListener("click",()=>{ broadcast({t:"muteReq",to:b.dataset.mute}); toast("음소거 요청을 보냈어요"); }));
  el.querySelectorAll("[data-rejoin]").forEach(b=>b.addEventListener("click",()=>joinRoom(b.dataset.rejoin,""))); }
function renderActivity(){ const el=$("#actLog"); if(!el)return; el.innerHTML=activityLog.slice(0,30).map(a=>`<div class="kv"><span>${esc(a.who)} — ${esc(a.text)}</span><b>${esc(a.t)}</b></div>`).join("")||'<p class="hint">아직 활동이 없어요.</p>'; }
function renderAvatars(){ const el=$("#avatars"); const plist=[{name:myName(),color:ME.color,avatar:ME.avatar,hand:ME.hand},...peers.values()];
  el.innerHTML=plist.slice(0,6).map(p=>`<span class="av" style="background:${p.color}" title="${esc(p.name)}">${esc(p.avatar||"🙂")}${p.hand?'<span class="hand">✋</span>':""}</span>`).join("")+(plist.length>6?`<span class="av" style="background:#5b6a7a">+${plist.length-6}</span>`:""); }
$("#btnHand").addEventListener("click",()=>{ ME.hand=!ME.hand; $("#btnHand").classList.toggle("on",ME.hand); broadcast({t:"hand",hand:ME.hand}); renderAvatars(); renderPeople(); if(ME.hand)toast("손을 들었어요 ✋"); });

/* ---------------- settings page ---------------- */
function renderSettings(){ const el=$("#page-set"); if(!el)return;
  el.innerHTML=`<h3>보드</h3>

  q("#setBgImg").addEventListener("click",()=>$("#fileBg").click());
  q("#setBgVid").addEventListener("click",()=>{ pendingBgVideo=true; $("#fileImg").click(); });
  q("#setTheme").addEventListener("click",()=>{ state.theme=state.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=state.theme; dirty(); renderSettings(); });
  q("#setBoardTheme").addEventListener("click",openBoardThemes);
  el.querySelectorAll("[data-viewf]").forEach(b=>b.addEventListener("click",()=>{ state.viewFilter=b.dataset.viewf; wrap.className=state.viewFilter; toast("보기 필터를 바꿨어요"); }));
  q("#setContrast").addEventListener("change",e=>document.documentElement.dataset.contrast=e.target.checked?"high":"");
  q("#setBigText").addEventListener("change",e=>document.documentElement.dataset.bigtext=e.target.checked?"1":"");
  q("#setCB").addEventListener("change",e=>{ colorblindOn=e.target.checked; renderProps(); toast(colorblindOn?"색맹 친화 팔레트(Okabe-Ito)로 바꿨어요":"기본 팔레트로 돌아왔어요"); });
  q("#setSnap").addEventListener("change",e=>state.snap=e.target.checked);
  q("#setGuides").addEventListener("change",e=>state.guides=e.target.checked);
  q("#setPalm").addEventListener("input",e=>{ state.palm=+e.target.value; renderSettings(); });
  q("#setPress").addEventListener("input",e=>{ state.pressureCurve=+e.target.value; renderSettings(); });
  q("#setTilt").addEventListener("change",e=>state.tilt=e.target.checked);
  q("#setPenBtn").value=state.penBtnAction; q("#setPenBtn").addEventListener("change",e=>state.penBtnAction=e.target.value);
  q("#setSnd").addEventListener("change",e=>state.drawSound=e.target.checked);

  q("#setCap").addEventListener("input",e=>{ state.captionSize=+e.target.value; document.getElementById("chatlog").style.fontSize=state.captionSize+"px"; });

  q("#setExportLock").addEventListener("change",e=>{ state.exportLock=e.target.checked; toast(state.exportLock?"내보내기 제한 켜짐":"내보내기 제한 꺼짐"); });
  q("#setLinkExpire").addEventListener("click",()=>toast("공유 링크 만료: 이 방 코드는 "+linkExpire+"까지 유효하게 표시돼요 (세션 기준)"));

  q("#setA11y").addEventListener("click",()=>{ const issues=[]; if(objects.some(o=>o.type==="image"&&!o.alt))issues.push("설명(alt)이 없는 이미지가 있어요 — 선택해서 설명을 붙이면 화면 낭독에 좋아요.");

}
let boardDesc="", boardTags="", boardFav=false, linkExpire="오늘 자정", shotBlock=false, pendingBgVideo=false;

function T_box(x,y,w,h,label,fill,color){ return {type:"shape",shape:"roundrect",x,y,w,h,color:color||"#5b6a7a",fill:fill||"#ffffff",label,sw:2.5,opacity:1,dash:"solid"}; }
function T_title(x,y,text,size,color){ return {type:"text",x,y,text,size:size||30,color:color||"#182230",font:"sans",bold:true,align:"left",opacity:1}; }
function T_sticky(x,y,text,color){ return {type:"sticky",x,y,w:170,h:120,text,size:16,color:color||STICKY_COLORS[0],opacity:1}; }
function T_shape(shape,x,y,w,h,label,fill){ return {type:"shape",shape,x,y,w,h,color:"#5b6a7a",fill:fill||"#eef4fb",label,sw:2.5,opacity:1,dash:"solid"}; }
function tplCols(cols,x0,y0){ const out=[]; cols.forEach((c,i)=>{ const x=x0+i*300; out.push(T_box(x,y0,270,470,"",c.c)); out.push(T_title(x+16,y0+12,c.t,21)); (c.items||["","",""]).forEach((it,j)=>out.push(T_sticky(x+18,y0+56+j*132,it||"여기에 써보세요",STICKY_COLORS[j%STICKY_COLORS.length]))); }); return out; }
function tplMatrix(cells,x0,y0,title){ const out=[T_title(x0,y0,title,28)]; cells.forEach((c,i)=>{ const x=x0+(i%2)*430, y=y0+56+Math.floor(i/2)*250; out.push(T_box(x,y,400,225,"",c.c)); out.push(T_title(x+16,y+12,c.t,20)); out.push(T_sticky(x+18,y+52,"여기에 써보세요",STICKY_COLORS[i%4])); }); return out; }
function tplTable(cols,rows,x0,y0,title){ const data=[cols]; for(let i=0;i<rows;i++)data.push(cols.map(()=>"")); return [T_title(x0,y0,title,28),{type:"table",x:x0,y:y0+52,w:Math.max(560,cols.length*170),h:52+rows*46,rows:data,opacity:1}]; }
function tplChecklist(title,items,x0,y0){ return [T_title(x0,y0,title,28),{type:"checklist",x:x0,y:y0+52,w:430,h:70+items.length*27,title,items:items.map(t=>({t,done:false})),opacity:1}]; }
function tplMindmap(center,branches,x0,y0){ const out=[T_shape("ellipse",x0+330,y0+190,240,110,center,"#ffd60a")]; const pos=[[-40,-30],[330,-60],[700,-30],[700,300],[330,430],[-40,300]];
  branches.forEach((b,i)=>{ const [dx,dy]=pos[i%pos.length]; const s=T_shape("roundrect",x0+dx+ (i>3?40:0),y0+dy+60,210,84,b,"#eef4fb"); out.push(s); out.push({type:"connector",from:"__c",to:"__b"+i,color:"#8fa1b3",w:2.5}); s._bid="__b"+i; }); out[0]._bid="__c"; return out; }
function tplTree(root,levels,x0,y0){ const out=[T_shape("roundrect",x0+300,y0,220,64,root,"#ffd60a")]; const kids=levels[0]||["항목 1","항목 2","항목 3"];
  kids.forEach((k,i)=>{ const x=x0+i*300; const s=T_shape("roundrect",x,y0+130,220,60,k,"#eef4fb"); s._bid="__k"+i; out.push(s); out.push({type:"connector",from:"__r",to:"__k"+i,color:"#8fa1b3",w:2.5});
    (levels[1]||["세부","세부"]).forEach((d,j)=>{ const dd=T_shape("roundrect",x+j*112,y0+250,104,52,d,"#ffffff"); dd._bid="__d"+i+"_"+j; out.push(dd); out.push({type:"connector",from:"__k"+i,to:"__d"+i+"_"+j,color:"#b9c4cd",w:2}); }); });
  out[0]._bid="__r"; return out; }
function tplFrames(n,labels,x0,y0,w=460,h=300){ const out=[]; for(let i=0;i<n;i++){ out.push({type:"frame",x:x0+i*(w+70),y:y0,w,h,title:labels[i]||("컷 "+(i+1)),opacity:1}); out.push(T_title(x0+i*(w+70)+14,y0+12,labels[i]||("컷 "+(i+1)),19)); } return out; }

function tplFishbone(x0,y0){ const out=[T_title(x0,y0,"피시본 다이어그램 (원인 분석)",26),{type:"shape",shape:"arrow",x:x0+20,y:y0+260,w:760,h:0,color:"#182230",sw:4,opacity:1,dash:"solid"},T_shape("ellipse",x0+790,y0+215,170,90,"문제","#ffd1dc")];

function tplFlowAuto(steps,x0,y0){ const out=[T_title(x0,y0,"플로우차트",28)]; let prev=null;

function applyTemplate(i){ const [name,cat,fn]=TEMPLATES[i]; pushHistory();
  const c=s2w(W/2-300,H/2-200); const made=fn().map(o=>({...o})); const idMap={};
  made.forEach(o=>{ o.id=uid(); if(o._bid){ idMap[o._bid]=o.id; delete o._bid; } o.x=(o.x||0)+c.x; o.y=(o.y||0)+c.y; if(o.type==="stroke")o.pts.forEach(p=>{p.x+=c.x;p.y+=c.y;}); });
  made.forEach(o=>{ if(o.type==="connector"){ o.from=idMap[o.from]||o.from; o.to=idMap[o.to]||o.to; } });
  made.forEach(o=>{ objects.push(o); broadcast({t:"op",op:{kind:"add",obj:stripObj(o)}}); });
  dirty(); logAct("템플릿 적용 — "+name); toast("템플릿을 넣었어요: "+name); xp(5); }

function saveVersion(label,silent){ versions.unshift({label:label||"수동 저장",when:nowT(),snap:snapshot()}); if(versions.length>25)versions.pop(); if(!silent)toast("버전을 저장했어요"); }
function openVersions(){ openModal("버전 기록 — 보드 되돌리기", versions.length? versions.map((v,i)=>`<div class="li"><div class="grow"><div class="nm">${esc(v.label)}</div><div class="small">${esc(v.when)}</div></div><button data-ver="${i}">이 버전으로 되돌리기</button></div>`).join("") : '<p class="hint">아직 버전이 없어요. 그리면 자동 저장 버전이 쌓여요.</p>',

  $$("#modalBody [data-ver]").forEach(b=>b.addEventListener("click",()=>{ saveVersion("되돌리기 전 백업",true); restore(versions[+b.dataset.ver].snap); pushHistory(); broadcast({t:"state",objects:objects.map(stripObj)}); closeModal(); toast("예전 보드로 되돌렸어요"); })); }

  $$("#modalBody [data-untrash]").forEach(b=>b.addEventListener("click",()=>{ const o=trash.splice(+b.dataset.untrash,1)[0]; delete o.deletedAt; addObject(o); openTrash(); renderExtra(); })); }
function openSearch(){ openModal("보드 내 검색",`<div style="display:flex;gap:.35rem"><input type="text" id="srchQ" placeholder="찾을 글자…" style="flex:1"><button id="srchGo">찾기</button></div><div id="srchOut" class="mt"></div>`,[]);
  $("#srchGo").addEventListener("click",()=>{ const q=$("#srchQ").value.trim(); if(!q)return;
    const hits=objects.filter(o=>(o.text&&o.text.includes(q))||(o.items&&o.items.some(i=>i.t.includes(q)))||(o.label&&o.label.includes(q))||(o.title&&o.title.includes(q)));
    $("#srchOut").innerHTML=hits.length?hits.map(o=>`<div class="li"><div class="grow"><div class="nm">${objName(o)} — ${esc((o.text||o.label||o.title||"").slice(0,30))}</div></div><button data-goto="${o.id}">이동</button></div>`).join(""):'<p class="hint">찾지 못했어요.</p>';

function snapshotPNG(scale=1){ const pad=30; if(!objects.length)return null;
  let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0; objects.forEach(o=>{const b=objBBox(o);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);});
  const w=Math.min(2400,(x1-x0+pad*2)*scale), h=Math.min(2400,(y1-y0+pad*2)*scale); const cvs=document.createElement("canvas"); cvs.width=w; cvs.height=h; const c=cvs.getContext("2d");
  c.fillStyle=state.bg==="dark"?"#20262e":"#ffffff"; c.fillRect(0,0,w,h); const sc=w/(x1-x0+pad*2); c.scale(sc,sc); c.translate(-x0+pad,-y0+pad);
  objects.forEach(o=>{ if(o.type==="dom"||o.type==="audio")return; c.save(); drawObj(c,o); c.restore(); }); return cvs; }
function openGallery(){ const cvs=snapshotPNG(.5); openModal("그림 갤러리 — 저장한 그림 모음", (galleryItems.length? galleryItems.map((g,i)=>`<div class="li"><img src="${g.img}" style="width:90px;height:64px;object-fit:cover;border-radius:8px"><div class="grow"><div class="nm">${esc(g.name)}</div><div class="small">${esc(g.when)}</div></div><button data-gal="${i}">PNG로 받기</button></div>`).join(""):'<p class="hint">아직 갤러리에 저장한 그림이 없어요. 아래 버튼으로 지금 보드를 갤러리에 넣을 수 있어요.</p>'),
  [{label:"지금 보드를 갤러리에 저장",fn:()=>{ if(cvs){ galleryItems.unshift({name:$("#boardTitle").value,when:nowT(),img:cvs.toDataURL("image/png")}); } openGallery(); },keep:true}]);
  $$("#modalBody [data-gal]").forEach(b=>b.addEventListener("click",()=>{ const a=document.createElement("a"); a.href=galleryItems[+b.dataset.gal].img; a.download="board.png"; a.click(); })); }

function showHeatmap(){ const cvs=document.createElement("canvas"); cvs.width=W; cvs.height=H; const c=cvs.getContext("2d");
  objects.forEach(o=>{ if(o.type!=="stroke")return; o.pts.forEach(p=>{ const s=w2s(p.x,p.y); const gr=c.createRadialGradient(s.x,s.y,0,s.x,s.y,26); gr.addColorStop(0,"rgba(255,60,0,.5)"); gr.addColorStop(1,"rgba(255,60,0,0)"); c.fillStyle=gr; c.fillRect(s.x-26,s.y-26,52,52); }); });
  const url=cvs.toDataURL(); openModal("히트맵 — 어디를 많이 그렸나",`<img src="${url}" style="width:100%;border:1px solid var(--line);border-radius:10px;background:#fff">`,[]); }
function boardReport(){ const texts=objects.filter(o=>o.text).map(o=>o.text); const checks=objects.filter(o=>o.type==="checklist");

/* 안전한 수식 계산기 (토크나이저 + 재귀 하강 파서 — eval/Function 미사용) */
function safeCalc(expr){ const toks=[]; let i=0;
  while(i<expr.length){ const ch=expr[i]; if(ch===" "){ i++; continue; }
    if(/[\d.]/.test(ch)){ let n=""; while(i<expr.length&&/[\d.]/.test(expr[i]))n+=expr[i++]; toks.push({t:"n",v:parseFloat(n)}); continue; }
    if("+-*/%^()".includes(ch)){ toks.push({t:ch}); i++; continue; } throw new Error("bad char"); }
  let pos=0; const peek=()=>toks[pos], next=()=>toks[pos++];
  function parseExpr(){ let v=parseTerm(); while(peek()&&(peek().t==="+"||peek().t==="-")){ const op=next().t; const r=parseTerm(); v=op==="+"?v+r:v-r; } return v; }
  function parseTerm(){ let v=parsePow(); while(peek()&&(peek().t==="*"||peek().t==="/"||peek().t==="%")){ const op=next().t; const r=parsePow(); v=op==="*"?v*r:op==="/"?v/r:v%r; } return v; }
  function parsePow(){ let v=parseUnary(); if(peek()&&peek().t==="^"){ next(); v=Math.pow(v,parsePow()); } return v; }
  function parseUnary(){ if(peek()&&peek().t==="-"){ next(); return -parseUnary(); } return parseAtom(); }
  function parseAtom(){ const tk=next(); if(!tk)throw new Error("end"); if(tk.t==="n")return tk.v; if(tk.t==="("){ const v=parseExpr(); if(!next()||toks[pos-1].t!==")")throw new Error("paren"); return v; } throw new Error("atom"); }
  const out=parseExpr(); if(pos<toks.length)throw new Error("trailing"); return Math.round(out*1e10)/1e10; }
let scoreBoard=[], attended=false;
function beep(freq=660,dur=.25){ try{ const ctx=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)()); const o=ctx.createOscillator(),gn=ctx.createGain();
  o.frequency.value=freq; gn.gain.setValueAtTime(.12,ctx.currentTime); gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur); o.connect(gn).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur); }catch(e){} }

function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function mkMC(q,opts,ans,why,topic){ const idx=opts.map((o,i)=>i); for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  const no=idx.map(i=>opts[i]); return {type:"객관식",q,opts:no,ans:no.indexOf(opts[ans]),why,topic}; }
function diffRange(diff,age){ const base={유아:[1,10],초등:[2,50],중등:[5,200],고등:[10,999],성인:[10,999]}[age]||[2,50]; const mult={쉬움:.3,보통:1,어려움:2.2,"매우 어려움":4}[diff]||1; return [base[0],Math.round(base[1]*mult)]; }
function genMath(age,diff,topic){ const [lo,hi]=diffRange(diff,age);
  if(topic==="곱셈"){ const a=rnd(2,age==="유아"?5:diff==="어려움"||diff==="매우 어려움"?99:12), b=rnd(2,12); const ans=a*b; return mkMC(`${a} × ${b} = ?`,[String(ans),String(ans+ (rnd(1,5))),String(ans-rnd(1,4)),String(ans+10)],0,`${a} × ${b} = ${ans}예요.`,topic); }
  if(topic==="나눗셈"){ const b=rnd(2,12), ans=rnd(2,15), a=b*ans; return mkMC(`${a} ÷ ${b} = ?`,[String(ans),String(ans+1),String(ans-1),String(ans+2)],0,`${b} × ${ans} = ${a}이므로 ${a} ÷ ${b} = ${ans}예요.`,topic); }
  if(topic==="분수"){ const d=[4,5,8,10][rnd(0,3)], n=rnd(1,d-1); return mkMC(`피자 한 판을 ${d}조각으로 나눴어요. 그중 ${n}조각은 전체의 얼마인가요?`,[`${n}/${d}`,`${d}/${n}`,`${n}/${d+n}`,`1/${n}`],0,`전체가 ${d}조각, 그중 ${n}조각이므로 ${n}/${d}예요.`,topic); }
  const a=rnd(lo,hi), b=rnd(lo,hi); if(topic==="덧셈·뺄셈"&&Math.random()<.5) return mkMC(`${a} − ${Math.min(b,a)} = ?`,[String(a-Math.min(b,a)),String(a-Math.min(b,a)+1),String(a-Math.min(b,a)-1),String(a)],0,`${a} − ${Math.min(b,a)} = ${a-Math.min(b,a)}예요.`,topic);
  return mkMC(`${a} + ${b} = ?`,[String(a+b),String(a+b+1),String(a+b-1),String(a+b+10)],0,`${a} + ${b} = ${a+b}예요.`,topic); }
function genMathShape(age,diff,topic){ if(topic==="둘레·넓이"){ const w=rnd(2,15), h=rnd(2,15); return mkMC(`가로 ${w}cm, 세로 ${h}cm인 직사각형의 넓이는?`,[`${w*h}cm²`,`${2*(w+h)}cm²`,`${w+h}cm²`,`${w*h+5}cm²`],0,`넓이 = 가로 × 세로 = ${w} × ${h} = ${w*h}cm²예요.`,topic); }
  return mkMC("변 4개와 꼭짓점 4개를 가진 도형은?",["삼각형","사각형","오각형","원"],1,"변 4개 = 사각형이에요.",topic); }
function genMathMeasure(age,diff,topic){ if(topic==="시간"){ const h=rnd(1,5); return mkMC(`${h}시간은 몇 분인가요?`,[`${h*60}분`,`${h*10}분`,`${h*100}분`,`${h*30}분`],0,`1시간 = 60분이므로 ${h}시간 = ${h*60}분이에요.`,topic); }
  const m=rnd(2,9); return mkMC(`${m}m는 몇 cm인가요?`,[`${m*100}cm`,`${m*10}cm`,`${m*1000}cm`,`${m}cm`],0,`1m = 100cm이므로 ${m}m = ${m*100}cm예요.`,topic); }
function genMathPattern(){ const s=rnd(2,9), d=rnd(2,9); const seq=[s,s+d,s+2*d,s+3*d]; return mkMC(`수 패턴: ${seq.join(", ")}, ? — 다음 수는?`,[String(s+4*d),String(s+5*d),String(s+4*d+1),String(s+3*d)],0,`${d}씩 커지는 규칙이에요. ${s+3*d} + ${d} = ${s+4*d}예요.`,"수 패턴"); }

      if(!q)continue;

function qbRender(){ const z=$("#qbOut"); if(!z||!qbState)return; const {qs,answers}=qbState;

   `<div class="grid2"><button id="qbGrade">채점하기</button><button id="qbBoard">문제를 보드에 붙이기</button></div><div id="qbScore" class="mt" style="font-weight:800"></div>`;

function startSpeechRec(mode){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("이 브라우저는 음성 인식을 지원하지 않아요 (크롬에서 써보세요)"); return; }
  const rec=new SR(); rec.lang=state.voiceLang; rec.interimResults=false; toast("🎤 듣고 있어요… 말해보세요");
  rec.onresult=e=>{ const txt=e.results[0][0].transcript;
    if(mode==="cmd"){ const cmds=[["펜","pen"],["지우개","eraser"],["선택","select"],["텍스트","text"],["포스트잇","sticky"],["레이저","laser"]];
      const hit=cmds.find(([k])=>txt.includes(k)); if(hit){ setTool(hit[1]); toast("음성 명령: "+hit[0]+" 도구로 바꿨어요"); return; }
      if(txt.includes("지워")||txt.includes("취소")){ undo(); return; } toast("알아듣지 못했어요: "+txt); return; }
    const c=s2w(W/2,H/2); addObject({type:"text",x:c.x,y:c.y,text:txt,size:26,color:state.color,font:"sans",bold:false,italic:false,align:"left",opacity:1}); toast("음성을 글로 넣었어요"); };
  rec.onerror=()=>toast("음성 인식에 실패했어요"); rec.start(); }

function toSVG(){ let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0; objects.forEach(o=>{const b=objBBox(o);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);});
  if(!objects.length){x0=0;y0=0;x1=100;y1=100;}
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" width="${x1-x0}" height="${y1-y0}"><rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="white"/>`;
  objects.forEach(o=>{ if(o.type==="stroke"){ s+=`<polyline points="${o.pts.map(p=>p.x+","+p.y).join(" ")}" fill="none" stroke="${o.color}" stroke-width="${o.w}" stroke-linecap="round" opacity="${o.opacity??1}"/>`; }
    else if(o.type==="shape"){ const b=objBBox(o); if(o.shape==="ellipse")s+=`<ellipse cx="${b.x+b.w/2}" cy="${b.y+b.h/2}" rx="${b.w/2}" ry="${b.h/2}" fill="${o.fill==="none"?"none":o.fill}" stroke="${o.color}" stroke-width="${o.w}"/>`; else s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="${o.fill==="none"?"none":o.fill}" stroke="${o.color}" stroke-width="${o.w}"/>`; }
    else if(o.type==="text"||o.type==="sticky"){ s+=`<text x="${o.x}" y="${o.y+(o.size||16)}" font-size="${o.size||16}" fill="${o.type==="sticky"?"#26303a":o.color}">${esc((o.text||"").split("\n")[0])}</text>`; } });
  return s+"</svg>"; }

let playedNotes=[];

  const whites=[0,2,4,5,7,9,11,12,14,16,17,19,21,23]; const blacks={0:1,1:3,3:6,4:8,5:10,7:13,8:15,10:18,11:20,12:22};
  whites.forEach((off,i)=>{ const d=document.createElement("div"); d.className="wkey"; d.dataset.midi=base+off;
    d.innerHTML=`<span class="klab">${NOTE_NAMES[off%12]}${pianoOctave+Math.floor(off/12)}</span>`;
    d.addEventListener("pointerdown",e=>{ e.preventDefault(); hitKey(base+off,d); }); pk.appendChild(d); });
  Object.entries(blacks).forEach(([wi,off])=>{ const d=document.createElement("div"); d.className="bkey"; d.dataset.midi=base+off;
    d.style.left=`calc(${(+wi+1)/14*100}% - ${(26/2)}px)`; d.style.width="26px";
    d.addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); hitKey(base+off,d); }); pk.appendChild(d); }); }
function hitKey(midi,el){ playNote(midi,curInst,0,1.4); if(el){ el.classList.add("hit"); setTimeout(()=>el.classList.remove("hit"),220); }

function drawStaff(notes){ const cvx=$("#staffCv"); if(!cvx)return; const c=cvx.getContext("2d"); const w=cvx.width,h=cvx.height;
  c.clearRect(0,0,w,h); c.strokeStyle="#889"; c.lineWidth=1; for(let i=0;i<5;i++){ c.beginPath(); c.moveTo(10,30+i*10); c.lineTo(w-10,30+i*10); c.stroke(); }

const SEQ_ROWS=[["킥","킥 드럼"],["스네어","스네어 드럼"],["하이햇","하이햇"],["베이스(도레미)","piano"],["리드(도레미)","piano"]];

/* ================================================================

   주소를 붙여넣지 않아도 열자마자 이 전용 Firebase로 기기 간 실시간
   동기화가 된다. 다른 데이터베이스로 바꾸고 싶을 때만 사람·방 탭의

function fbSetUrl(url){ url=(url||"").trim().replace(/\/+$/,"");

function fbListen(ref,ev,cb){ try{ ref.on(ev,cb); fbListeners.push([ref,ev,cb]); }catch(e){} }
function fbDetachRoom(){ fbListeners.forEach(([r,ev,cb])=>{ try{ r.off(ev,cb); }catch(e){} }); fbListeners=[];
  if(fbRoom){ try{ fbRoom.child("presence/"+ME.id).remove(); fbRoom.child("cursors/"+ME.id).remove(); fbRoom.child("live/"+ME.id).remove(); }catch(e){} fbRoom=null; }

function fbPublishPresence(){ if(!fbRoom)return; try{ fbRoom.child("presence/"+ME.id).set({...meInfo(),last:Date.now()}).catch(()=>{}); }catch(e){} }
function fbOnObj(snap){ const rec=snap.val(); if(!rec||!rec.obj)return; if(rec.by===ME.id)return; const obj=rec.obj;
  const i=objects.findIndex(o=>o.id===obj.id); if(i>=0)objects[i]=obj; else objects.push(obj); dirty(); drawMinimap(); }
function fbConnectRoom(code){ fbDetachRoom(); fbReady=false; fbJoinTs=Date.now();
  if(!fbInit()){ setFbConn(false); return; }
  const roomRef=fbDb.ref("rooms/"+code); fbRoom=roomRef;
  try{ roomRef.child("presence/"+ME.id).onDisconnect().remove(); roomRef.child("cursors/"+ME.id).onDisconnect().remove(); roomRef.child("live/"+ME.id).onDisconnect().remove(); }catch(e){}
  fbPublishPresence();
  const objRef=roomRef.child("objects");
  fbListen(objRef,"child_added",fbOnObj); fbListen(objRef,"child_changed",fbOnObj);
  fbListen(objRef,"child_removed",snap=>{ const rec=snap.val(); if(rec&&rec.by===ME.id)return; const id=snap.key;
    if(byId(id)){ objects=objects.filter(o=>o.id!==id); selected.delete(id); dirty(); drawMinimap(); } });
  // 방에 이미 있는 그림은 child_added로 들어오고, 내 로컬에만 있는 객체는 올려서 합친다

    objects.filter(o=>!have.has(o.id)).forEach(o=>{ const c=fbClean(stripObj(o)); if(c)roomRef.child("objects/"+o.id).set({obj:c,by:ME.id,ts:Date.now()}).catch(()=>{}); }); }).catch(()=>{});

  fbListen(liveRef,"child_added",onLive); fbListen(liveRef,"child_changed",onLive);
  fbListen(liveRef,"child_removed",snap=>{ remoteLive.delete(snap.key); dirty(); });
  const curRef=roomRef.child("cursors");
  const onCur=snap=>{ if(snap.key===ME.id)return; const v=snap.val(); if(v)drawRemoteCursor({from:snap.key,x:v.x,y:v.y,name:v.name,color:v.color,laser:v.laser,tool:v.tool}); };
  fbListen(curRef,"child_added",onCur); fbListen(curRef,"child_changed",onCur);
  const presRef=roomRef.child("presence");
  fbListen(presRef,"child_added",snap=>{ if(snap.key===ME.id)return; const v=snap.val()||{}; const isNew=!peers.has(snap.key);
    peers.set(snap.key,{...v,id:snap.key,last:v.last||Date.now()}); renderAvatars(); renderPeople();
    if(isNew&&Date.now()-fbJoinTs>2000){ toast("👋 "+(v.name||"참여자")+"님이 들어왔어요"); addChat("","",false,true); chatLog.lastChild.textContent=(v.name||"참여자")+"님이 들어왔어요"; entranceFx(); } });
  fbListen(presRef,"child_changed",snap=>{ if(snap.key===ME.id)return; const v=snap.val()||{}; peers.set(snap.key,{...v,id:snap.key,last:v.last||Date.now()}); renderAvatars(); });
  fbListen(presRef,"child_removed",snap=>{ if(snap.key===ME.id)return; peers.delete(snap.key); remoteLive.delete(snap.key);
    const ce=cursorEls.get(snap.key); if(ce){ ce.remove(); cursorEls.delete(snap.key); } renderAvatars(); renderPeople(); });
  const chatRef=roomRef.child("chat").limitToLast(40);
  fbListen(chatRef,"child_added",snap=>{ const rec=snap.val(); if(!rec||rec.by===ME.id)return;
    if(fbSeenChatKeys.has(snap.key))return; fbSeenChatKeys.add(snap.key);
    if(rec.mid){ if(seenChatIds.has(rec.mid))return; seenChatIds.add(rec.mid); }
    addChat(rec.who||"참여자",rec.text||"",false); });
  const evRef=roomRef.child("events").limitToLast(30);
  fbListen(evRef,"child_added",snap=>{ const rec=snap.val(); if(!rec||rec.by===ME.id||!rec.msg)return;
    if(rec.ts&&rec.ts<fbJoinTs-2500)return; onSync({...rec.msg,from:rec.by}); });
  fbReady=true; }
function connectRoom(code){ if(bc)bc.close(); roomCode=code; $("#roomCodeLbl").textContent=code; joinedAt=Date.now();

  fbConnectRoom(code);
  peers.clear(); broadcast({t:"hello",me:meInfo()}); broadcastPresence();
  if(pingTimer)clearInterval(pingTimer);
  pingTimer=setInterval(()=>{ broadcast({t:"ping",me:meInfo()}); const cut=Date.now()-12000;
    for(const [id,p] of peers){ if(p.last&&p.last<cut){ peers.delete(id); const ce=cursorEls.get(id); if(ce){ ce.remove(); cursorEls.delete(id); } renderAvatars(); renderPeople(); } } },3000);
  recentRooms.unshift({code,title:$("#boardTitle").value,when:nowT()}); recentRooms=recentRooms.slice(0,6); }
function meInfo(){ return {id:ME.id,name:myName(),color:ME.color,avatar:ME.avatar,role:ME.role,hand:ME.hand,muted:voiceMuted}; }
const FB_EVENT_TYPES=["cam","hand","react","note","poll","vote","score","timer","setrole","setrole2","muteReq","rtc","toast","join-req","join-res"];
function broadcast(msg){ if(!msg)return;
  if(FB_EVENT_TYPES.includes(msg.t)&&!msg._eid)msg._eid=uid();
  if(bc){ try{ bc.postMessage({...msg,from:ME.id}); }catch(e){} }
  fbBroadcast(msg); }
function fbBroadcast(msg){ if(!fbRoom)return; const ts=Date.now();
  try{
    if(msg.t==="op"&&msg.op){ const oref=fbRoom.child("objects");
      if(msg.op.kind==="add"||msg.op.kind==="update"){ const o=fbClean(stripObj(msg.op.obj)); if(o)oref.child(msg.op.obj.id).set({obj:o,by:ME.id,ts}).catch(()=>{}); }
      else if(msg.op.kind==="del"){ (msg.op.ids||[]).forEach(id=>oref.child(id).remove().catch(()=>{})); }
      return; }
    if(msg.t==="state"&&!msg.to){ const map={}; (msg.objects||[]).forEach(o=>{ const c=fbClean(stripObj(o)); if(c)map[o.id]={obj:c,by:ME.id,ts}; });
      if(Object.keys(map).length)fbRoom.child("objects").set(map).catch(()=>{}); else fbRoom.child("objects").remove().catch(()=>{}); return; }
    if(msg.t==="chat"){ fbRoom.child("chat").push({who:msg.who,text:msg.text,mid:msg.mid||"",by:ME.id,ts}).catch(()=>{}); return; }
    if(msg.t==="cursor"){ const t2=performance.now(); if(t2-fbCursorLast<90)return; fbCursorLast=t2;
      fbRoom.child("cursors/"+ME.id).set({x:msg.x,y:msg.y,name:msg.name,color:msg.color,laser:!!msg.laser,tool:msg.tool,ts}).catch(()=>{}); return; }
    if(msg.t==="ping"||msg.t==="hello"){ fbPublishPresence(); return; }

/* ---------------- WebRTC voice ---------------- */
let voiceStream=null, voiceMuted=false, rtcPeers=new Map(), voiceOn=false;
async function toggleVoice(){ if(voiceOn){ voiceOn=false; if(voiceStream)voiceStream.getTracks().forEach(t=>t.stop()); rtcPeers.forEach(pc=>pc.close()); rtcPeers.clear(); toast("음성 채팅을 껐어요"); renderPeople(); return; }
  try{ voiceStream=await navigator.mediaDevices.getUserMedia({audio:true}); voiceOn=true;
    peers.forEach((p,id)=>makePC(id,true)); toast("🎙 음성 채팅 켜짐 — 방 사람들과 말할 수 있어요"); renderPeople();
    // 자동 자막 (음성 인식 지원 시)
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ const rec=new SR(); rec.lang=state.voiceLang; rec.continuous=true; rec.interimResults=true;
      rec.onresult=e=>{ const txt=[...e.results].map(r=>r[0].transcript).join(""); const el=$("#liveCaption"); if(el)el.textContent="자막: "+txt; }; try{ rec.start(); }catch(e){} }
  }catch(e){ toast("마이크 권한이 필요해요"); } }
function setVoiceMute(m){ voiceMuted=m; if(voiceStream)voiceStream.getAudioTracks().forEach(t=>t.enabled=!m); }
async function makePC(id,initiate){ if(rtcPeers.has(id))return rtcPeers.get(id);
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); rtcPeers.set(id,pc);
  if(voiceStream)voiceStream.getTracks().forEach(t=>pc.addTrack(t,voiceStream));
  pc.ontrack=e=>{ let a=document.getElementById("rtc-"+id); if(!a){ a=document.createElement("audio"); a.id="rtc-"+id; a.autoplay=true; document.body.appendChild(a); } a.srcObject=e.streams[0]; };
  pc.onicecandidate=e=>{ if(e.candidate)broadcast({t:"rtc",to:id,kind:"ice",data:e.candidate}); };
  if(initiate){ const offer=await pc.createOffer(); await pc.setLocalDescription(offer); broadcast({t:"rtc",to:id,kind:"offer",data:offer}); }
  return pc; }
async function handleRTC(m){ if(m.to!==ME.id)return; const pc=await makePC(m.from,false);
  if(m.kind==="offer"){ await pc.setRemoteDescription(m.data); const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); broadcast({t:"rtc",to:m.from,kind:"answer",data:ans}); }
  else if(m.kind==="answer"){ await pc.setRemoteDescription(m.data); }
  else if(m.kind==="ice"){ try{ await pc.addIceCandidate(m.data); }catch(e){} } }

document.addEventListener("keydown",e=>{ const tag=document.activeElement.tagName; const typing=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT";

  if(typing)return;

  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); downloadText("whiteboard.json",JSON.stringify({title:$("#boardTitle").value,objects:objects.map(stripObj)})); toast("보드 파일을 저장했어요"); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="c"){ if(selected.size){ clipboard=[...selected].map(byId).filter(Boolean).map(o=>JSON.parse(JSON.stringify(stripObj(o)))); toast("복사했어요"); } return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="v"){ if(clipboard.length){ const news=clipboard.map(o=>{ const c=JSON.parse(JSON.stringify(o)); c.id=uid(); c.x+=28; c.y+=28; if(c.type==="stroke")c.pts.forEach(p=>{p.x+=28;p.y+=28;}); return addObject(c,true); }); pushHistory(); news.forEach(n=>broadcast({t:"op",op:{kind:"add",obj:stripObj(n)}})); selectOnly(news.map(n=>n.id)); toast("붙여넣었어요"); } return; }
  if(e.key==="Delete"||e.key==="Backspace"){ if(selected.size)removeObjects([...selected]); return; }
  const km={v:"select",h:"hand",p:"pen",e:"eraser",l:"laser",t:"text",n:"sticky",f:null};
  const k=e.key.toLowerCase(); if(k==="f"){ fitAll(); return; } if(km[k])setTool(km[k]); });
