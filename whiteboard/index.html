function init(){ buildToolbar(); setTool("pen"); resize(); renderProps(); renderPeople(); renderExtra(); renderSettings(); renderVote();
  connectRoom(genCode()); ME.role="host"; renderAvatars(); seedBoard(); fitAll(); drawMinimap(); renderFrameBar();
  addChat("",WB_FB_URL?"보드 준비 완료! 방 코드를 친구에게 알려주면, 친구가 다른 기기(아이패드·폰·PC)에서 이 페이지를 열고 같은 코드로 들어와 바로 같이 그릴 수 있어요.":"보드 준비 완료! 같은 기기의 탭끼리는 바로 같이 그릴 수 있어요. 다른 기기와 실시간으로 그리려면 사람·방 탭에서 화이트보드 전용 Firebase 주소를 먼저 설정해 주세요.",false,true);
  logAct("보드 시작"); saveVersion("시작 상태",true);
  if(matchMedia("(prefers-color-scheme: dark)").matches){ state.theme="dark"; document.documentElement.dataset.theme="dark"; dirtyBg(); dirty(); renderSettings(); } }
init();
/* ---------------- 야구 게임 ---------------- */
let bb=null;
function openBaseball(el){ bb={ el, inning:1, half:"초", outs:0, balls:0, strikes:0, bases:[0,0,0],
  score:{us:[],them:[]}, totalInnings:9, pitching:null, raf:0, mode:"solo", over:false, msg:"플레이 볼!" };
  el.innerHTML=`<h3 style="margin-top:0">⚾ 야구 게임</h3>
  <div class="row" style="display:flex;gap:.35rem;flex-wrap:wrap;align-items:center">
   <select id="bbInn"><option value="3">3이닝</option><option value="6">6이닝</option><option value="9" selected>9이닝</option></select>
   <select id="bbMode"><option value="solo">혼자 (컴퓨터와)</option><option value="duo">둘이서 (번갈아 기기 사용)</option></select>
   <button id="bbStart">경기 시작</button></div>
  <div id="bbField" class="mt"></div><div id="bbCtl" class="mt"></div><div id="bbLog" class="small mt" style="max-height:90px;overflow-y:auto"></div>`;
  $("#bbStart").addEventListener("click",()=>{ bb.totalInnings=+$("#bbInn").value; bb.mode=$("#bbMode").value;
    bb.inning=1; bb.half="초"; bb.score={us:Array(bb.totalInnings).fill(null),them:Array(bb.totalInnings).fill(null)}; bb.over=false;
    bbLog("⚾ 경기 시작! "+(bb.mode==="solo"?"우리 팀이 선공(초 공격)이에요":"팀 A가 선공이에요")); newHalf(); bbRender(); });
  bbRender(); }
function bbTeamNames(){ return bb.mode==="solo"?["우리 팀","상대 팀"]:["팀 A","팀 B"]; }
function bbAttackIdx(){ return bb.half==="초"?0:1; } // 0=us/A 선공
function bbLog(t){ if(!bb)return; const z=$("#bbLog"); if(z){ z.innerHTML=`<div>${esc(t)}</div>`+z.innerHTML; } bb.msg=t; }
function newHalf(){ bb.outs=0; bb.bases=[0,0,0]; bb.balls=0; bb.strikes=0;
  bbLog(`— ${bb.inning}회${bb.half} ${bbTeamNames()[bbAttackIdx()]} 공격 —`); broadcast({t:"toast",msg:`⚾ ${bb.inning}회${bb.half} 시작`}); }
function bbRender(){ if(!bb)return; const f=$("#bbField"), c=$("#bbCtl"); if(!f||!c)return; const [A,B]=bbTeamNames();
  const line=(arr)=>arr.map(v=>v===null?"":v).join(" ");
  const total=arr=>arr.reduce((s,v)=>s+(v||0),0);
  f.innerHTML=`<div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-start">
   <svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="베이스 상황">
     <rect x="0" y="0" width="150" height="150" rx="12" fill="#2e7d46"/>
     <polygon points="75,128 128,75 75,22 22,75" fill="#c9a06a" stroke="#fff" stroke-width="2"/>
     <rect x="66" y="119" width="18" height="18" transform="rotate(45 75 128)" fill="#fff"/>
     <rect x="119" y="66" width="18" height="18" transform="rotate(45 128 75)" fill="${bb.bases[0]?"#ffd60a":"#fff"}"/>
     <rect x="66" y="13" width="18" height="18" transform="rotate(45 75 22)" fill="${bb.bases[1]?"#ffd60a":"#fff"}"/>
     <rect x="13" y="66" width="18" height="18" transform="rotate(45 22 75)" fill="${bb.bases[2]?"#ffd60a":"#fff"}"/>
     <circle cx="75" cy="75" r="7" fill="#fff"/></svg>
   <div style="flex:1;min-width:180px">
    <table class="mini"><tr><th>팀</th>${Array.from({length:bb.totalInnings},(_,i)=>`<th>${i+1}</th>`).join("")}<th>R</th></tr>
    <tr><td>${A}</td>${bb.score.us.map(v=>`<td>${v===null?"":v}</td>`).join("")}<td><b>${total(bb.score.us)}</b></td></tr>
    <tr><td>${B}</td>${bb.score.them.map(v=>`<td>${v===null?"":v}</td>`).join("")}<td><b>${total(bb.score.them)}</b></td></tr></table>
    <div class="kv"><span>${bb.inning}회${bb.half} · ${bbTeamNames()[bbAttackIdx()]} 공격</span><b>${bb.outs}아웃</b></div>
    <div class="kv"><span>볼카운트</span><b>B ${"●".repeat(bb.balls)}${"○".repeat(4-bb.balls)} · S ${"●".repeat(bb.strikes)}${"○".repeat(2-bb.strikes)}</b></div>
    <div style="font-weight:800;margin-top:.3rem">${esc(bb.msg)}</div>
    <div id="bbPitchZone" style="margin-top:.4rem"></div>
   </div></div>`;
  if(bb.over){ c.innerHTML=`<div class="flashcard" style="min-height:70px">🏆 경기 종료 — ${total(bb.score.us)} : ${total(bb.score.them)}<div class="small">${total(bb.score.us)===total(bb.score.them)?"무승부!":(total(bb.score.us)>total(bb.score.them)?A:B)+" 승리!"}</div></div>
   <div class="grid2 mt"><button id="bbBoard">결과를 보드에 붙이기</button><button id="bbAgain">다시 하기</button></div>`;
    $("#bbAgain").addEventListener("click",()=>openBaseball(bb.el));
    $("#bbBoard").addEventListener("click",()=>{ const cc=s2w(W/2,H/2); addObject({type:"sticky",x:cc.x-120,y:cc.y-70,w:240,h:140,text:`⚾ 야구 결과\n${A} ${total(bb.score.us)} : ${total(bb.score.them)} ${B}\n${total(bb.score.us)===total(bb.score.them)?"무승부":(total(bb.score.us)>total(bb.score.them)?A:B)+" 승리!"}`,color:"#c8f2c8",size:16,opacity:1}); });
    return; }
  const iAmBatting = bb.mode==="solo" ? bbAttackIdx()===0 : true;
  if(iAmBatting){ c.innerHTML=`<div class="grid3"><button id="bbPitch">⚾ 투구 보기</button><button id="bbSwing" disabled style="font-size:1.05rem;font-weight:800">🏏 스윙!</button><button id="bbTake" disabled>👀 지켜보기</button></div>
    <p class="hint">투구 보기를 누르면 공이 날아와요. 공이 홈플레이트에 닿는 순간 스윙! 타이밍이 완벽하면 홈런, 스트라이크 존 밖 공은 지켜보면 볼이 돼요.</p>`;
    $("#bbPitch").addEventListener("click",bbPitchBall);
    $("#bbSwing").addEventListener("click",bbSwing);
    $("#bbTake").addEventListener("click",bbTake); }
  else { c.innerHTML=`<p class="hint" style="margin-top:0">수비 중 — 던질 구종을 고르세요. 상대 타자가 칩니다.</p>
    <div class="grid3"><button data-pt="fast">직구 (빠름)</button><button data-pt="curve">커브 (느리고 휘어짐)</button><button data-pt="change">체인지업 (속도 속임)</button></div>`;
    c.querySelectorAll("[data-pt]").forEach(b2=>b2.addEventListener("click",()=>bbDefend(b2.dataset.pt))); } }
function bbPitchBall(){ if(bb.pitching)return; const types=[["직구",760],["커브",1180],["체인지업",1050],["슬라이더",900]];
  const [tn,dur]=types[Math.floor(Math.random()*types.length)]; const inZone=Math.random()<.68;
  const zone=$("#bbPitchZone"); bb.pitching={start:performance.now(),dur,inZone,type:tn,swung:false};
  const sw=$("#bbSwing"), tk=$("#bbTake"); if(sw)sw.disabled=false; if(tk)tk.disabled=false;
  bbLog(`${tn} 투구! ${inZone?"":"(존 밖으로 빠지는 공…)"}`);
  const stepFn=()=>{ if(!bb.pitching)return; const p=(performance.now()-bb.pitching.start)/dur;
    if(zone){ const drift=tn==="커브"?Math.sin(p*Math.PI)*22:tn==="슬라이더"?p*p*16:0;
      zone.innerHTML=`<div style="position:relative;height:64px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden">
       <div style="position:absolute;left:50%;top:8px;width:74px;height:48px;margin-left:-37px;border:2px dashed ${inZone?"#2b7cd3":"#d64545"};border-radius:6px"></div>
       <div style="position:absolute;left:calc(50% + ${drift-8}px);top:${6+p*44}px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #d64545;transform:scale(${.5+p*.9})"></div></div>`; }
    if(p>=1){ bbPitchArrive(); return; } bb.raf=requestAnimationFrame(stepFn); };
  stepFn(); }
function bbJudge(q){ // q: 0..1 타이밍 품질
  if(q>.93)return "hr"; if(q>.82)return Math.random()<.5?"d2":"d3"; if(q>.66)return Math.random()<.6?"d1":"d2";
  if(q>.5)return Math.random()<.55?"d1":"out"; if(q>.34)return Math.random()<.5?"foul":"out"; return "miss"; }
function bbSwing(){ if(!bb.pitching||bb.pitching.swung)return; bb.pitching.swung=true; cancelAnimationFrame(bb.raf);
  const p=(performance.now()-bb.pitching.start)/bb.pitching.dur; const pit=bb.pitching; bb.pitching=null;
  if(p<.55){ bbLog("너무 일찍 휘둘렀어요 — 헛스윙!"); bbStrike(); return; }
  const q=1-Math.abs(p-.97)/.45; const res=pit.inZone? bbJudge(Math.max(0,q)) : (Math.random()<.35?"foul":"miss");
  if(res==="miss"){ bbLog("헛스윙!"); bbStrike(); }
  else if(res==="foul"){ bbLog("파울!"); if(bb.strikes<2)bb.strikes++; bbRender(); }
  else bbHit(res); }
function bbTake(){ if(!bb.pitching)return; cancelAnimationFrame(bb.raf); const pit=bb.pitching; bb.pitching=null;
  if(pit.inZone){ bbLog("루킹 스트라이크!"); bbStrike(); } else { bbLog("볼! 잘 참았어요"); bbBall(); } }
function bbPitchArrive(){ if(!bb.pitching)return; const pit=bb.pitching; bb.pitching=null;
  if(pit.inZone){ bbLog("그냥 보내면 스트라이크!"); bbStrike(); } else { bbLog("볼!"); bbBall(); } }
function bbStrike(){ bb.strikes++; if(bb.strikes>=3){ bbLog("삼진 아웃!"); bbOut(); } bbRender(); }
function bbBall(){ bb.balls++; if(bb.balls>=4){ bbLog("볼넷! 1루로 걸어 나가요"); bbAdvance(1,true); bb.balls=0; bb.strikes=0; } bbRender(); }
function bbOut(){ bb.outs++; bb.balls=0; bb.strikes=0; if(bb.outs>=3)endHalf(); bbRender(); }
function bbAdvance(n,walk){ let runs=0; const b=bb.bases;
  if(walk){ if(b[0]&&b[1]&&b[2])runs++; if(b[0]&&b[1])b[2]=1; if(b[0])b[1]=1; b[0]=1; }
  else { for(let i=0;i<n;i++){ if(b[2])runs++; b[2]=b[1]; b[1]=b[0]; b[0]= i===0?1:0; } }
  if(runs)addRuns(runs); return runs; }
function addRuns(r){ const key=bbAttackIdx()===0?"us":"them"; const cur=bb.score[key][bb.inning-1]||0; bb.score[key][bb.inning-1]=cur+r; }
function bbHit(res){ const names={d1:"안타! ⚾",d2:"2루타! ⚾⚾",d3:"3루타!",hr:"🎉 홈런!!!"};
  if(res==="hr"){ let runs=1+bb.bases.filter(Boolean).length; bb.bases=[0,0,0]; addRuns(runs); bbLog(names.hr+` ${runs}점!`); xp(15); broadcast({t:"toast",msg:"🎉 홈런! "+runs+"점"}); }
  else { const n={d1:1,d2:2,d3:3}[res]; const runs=bbAdvance(n,false); bbLog(names[res]+(runs?` ${runs}점 득점!`:"")); if(runs)bbLog(bb.msg); }
  bb.balls=0; bb.strikes=0; bbRender(); }
function endHalf(){ const key=bbAttackIdx()===0?"us":"them"; if(bb.score[key][bb.inning-1]===null)bb.score[key][bb.inning-1]=0;
  if(bb.half==="초"){ bb.half="말"; } else { if(bb.inning>=bb.totalInnings){ bb.over=true; bbLog("경기 종료!"); broadcast({t:"toast",msg:"⚾ 경기 종료!"}); bbRender(); return; } bb.inning++; bb.half="초"; }
  newHalf(); bbRender(); }
function bbDefend(type){ // 수비: AI 타자 결과
  const swingP={fast:.62,curve:.5,change:.55}[type]||.55; const r=Math.random();
  if(r>swingP){ if(Math.random()<.5){ bbLog("상대 타자 헛스윙 — 스트라이크!"); bbStrike(); } else { bbLog("상대 타자가 참았어요 — 볼"); bbBall(); } return; }
  const q=Math.random(); const res=q>.93?"hr":q>.82?"d2":q>.66?"d1":q>.45?"out":"foul";
  if(res==="foul"){ bbLog("상대 타자 파울"); if(bb.strikes<2)bb.strikes++; bbRender(); }
  else if(res==="out"){ bbLog("상대 타자 아웃! 잘 던졌어요"); bbOut(); }
  else { bbLog("상대 타자에게 맞았어요 — "+({d1:"안타",d2:"2루타",hr:"홈런"})[res]); if(res==="hr"){ let runs=1+bb.bases.filter(Boolean).length; bb.bases=[0,0,0]; addRuns(runs); bb.balls=0; bb.strikes=0; bbRender(); } else { bbAdvance({d1:1,d2:2}[res],false); bb.balls=0; bb.strikes=0; bbRender(); } } }
</script>
