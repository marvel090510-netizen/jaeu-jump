<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>공유 화이트보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=JetBrains+Mono:wght@400;700&family=Jua&display=swap" />
<style>
:root{
  --bg:#edf1f7; --panel:#ffffff; --panel2:#f1f5fa; --ink:#1b2432; --ink2:#5d6b80; --line:#dde4ee;
  --accent:#0bb07b; --accent2:#ff6b4a; --accent-soft:#dcf7ec; --danger:#e5484d; --warn:#f5a623;
  --sel:#2f7df6;
  --shadow:0 12px 32px rgba(31,52,86,.16),0 2px 6px rgba(31,52,86,.08); --shadow-sm:0 2px 8px rgba(31,52,86,.10); --radius:16px;
  --tb:56px; color-scheme:light;
}
[data-theme="dark"]{ --bg:#0f141c; --panel:#1a222e; --panel2:#222c3a; --ink:#edf3f9; --ink2:#9fb0c3; --line:#2f3d4f; --accent-soft:#123528; --shadow:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.35); --shadow-sm:0 2px 8px rgba(0,0,0,.35); color-scheme:dark; }
[data-contrast="high"]{ --ink:#000; --ink2:#222; --line:#666; --accent:#00563f; }
[data-theme="dark"][data-contrast="high"]{ --ink:#fff; --ink2:#e8e8e8; --line:#9aa; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;font-size:14px;}
[data-bigtext="1"] body{font-size:16.5px;}
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem;}
button{font:inherit;color:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:.34rem .65rem;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;justify-content:center;line-height:1.15;font-weight:600;box-shadow:0 1px 2px rgba(31,52,86,.07);transition:transform .08s ease,box-shadow .15s ease,border-color .15s ease,color .15s ease,background .15s ease;}
button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
button:active{transform:translateY(1px);box-shadow:none;}
button.on{color:var(--sel);font-weight:800;}
button.on:hover{color:var(--sel);}
button:disabled{opacity:.45;cursor:not-allowed;}
button.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff;}
input[type="text"],input[type="password"],input[type="number"],input[type="url"],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:.42rem .6rem;min-height:2.25rem;}
textarea{line-height:1.45;}
input[type="range"]{min-height:1.6rem;accent-color:var(--accent);}
input[type="color"]{width:2.4rem;height:2.25rem;padding:2px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;}
label.chk{display:inline-flex;align-items:center;gap:.45rem;padding:.35rem .2rem;cursor:pointer;min-height:2.25rem;}
label.chk input{width:1.15rem;height:1.15rem;accent-color:var(--accent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
svg.ic{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
svg.ic .f{fill:currentColor;stroke:none;}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100dvh;}
#topbar{height:var(--tb);flex:none;display:flex;align-items:center;gap:.45rem;padding:0 .6rem;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(31,52,86,.07);z-index:60;position:relative;}
#topbar .ttl{font-family:"Jua","Pretendard Variable",sans-serif;font-weight:400;font-size:1.22rem;letter-spacing:.01em;border:none;background:transparent;min-width:0;width:11.5rem;padding:.3rem .4rem;}
#topbar .ttl:hover{border:1px solid var(--line);}
.roomchip{display:flex;align-items:center;gap:.4rem;background:var(--accent-soft);border:1.5px solid var(--line);border-radius:999px;padding:.2rem .6rem .2rem .75rem;font-weight:800;white-space:nowrap;box-shadow:var(--shadow-sm);}
.roomchip code{font-family:"JetBrains Mono",monospace;font-size:.95rem;letter-spacing:.06em;}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;}
.dotlive.off{background:var(--warn);}
#avatars{display:flex;align-items:center;margin-left:.15rem;}
.av{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);margin-left:-7px;display:flex;align-items:center;justify-content:center;font-size:.95rem;color:#fff;font-weight:700;position:relative;cursor:pointer;flex:none;}
.av:first-child{margin-left:0;}
.av .hand{position:absolute;top:-9px;right:-6px;font-size:.72rem;}
#savestate{color:var(--ink2);font-size:.8rem;white-space:nowrap;}
#topbar .sp{flex:1;}
.tbtn{width:2.5rem;padding:.3rem;}
.tbtn .lbl{display:none;}

#main{flex:1;display:flex;min-height:0;position:relative;}
/* left toolbar */
#toolbar{flex:none;width:64px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);margin:.55rem 0 .55rem .55rem;display:flex;flex-direction:column;align-items:center;padding:.5rem 0;gap:3px;overflow-y:auto;overflow-x:hidden;z-index:55;scrollbar-width:thin;}
#toolbar .sep{width:34px;border-top:1px solid var(--line);margin:.35rem 0;flex:none;}
.tool{width:46px;height:46px;border:none;background:transparent;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;padding:0;box-shadow:none;}
.tool:hover{background:var(--accent-soft);color:var(--accent);transform:none;box-shadow:none;}
.tool.on::after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--sel);}
.tool.on{color:var(--sel);}
.tool .fav{position:absolute;top:1px;right:2px;font-size:.55rem;color:var(--warn);display:none;}
.tool.faved .fav{display:block;}
#favrow{display:none;width:100%;flex-direction:column;align-items:center;gap:2px;}
#favrow.has{display:flex;}

/* board */
#boardwrap{flex:1;position:relative;min-width:0;overflow:hidden;background:#fff;}
#boardwrap.inv{filter:invert(1) hue-rotate(180deg);}
#boardwrap.gray{filter:grayscale(1);}
#boardwrap.invgray{filter:invert(1) hue-rotate(180deg) grayscale(1);}
canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block;}
#cvbg{z-index:1;} #mediaLayer{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none;}
#cv{z-index:3;touch-action:none;cursor:crosshair;}
#cvOverlay{z-index:4;pointer-events:none;}
.mediaObj{position:absolute;transform-origin:0 0;border:2px solid #2b7cd3;border-radius:8px;overflow:hidden;background:#000;pointer-events:none;}
.mediaObj .tag{position:absolute;top:0;left:0;background:#2b7cd3;color:#fff;font-size:11px;padding:2px 7px;font-weight:700;z-index:2;}
.mediaObj video,.mediaObj iframe{width:100%;height:100%;border:0;display:block;}
.mediaObj.audioM{background:var(--panel);display:flex;align-items:center;padding:6px;}
.mediaObj.audioM audio{width:100%;}
#remoteCursors{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;}
.rcursor{position:absolute;transform:translate(-2px,-2px);transition:left .07s linear,top .07s linear;will-change:left,top;}
.rcursor .nm{font-size:11px;font-weight:700;color:#fff;padding:1px 6px;border-radius:0 8px 8px 8px;margin-left:12px;white-space:nowrap;}
#laserFx{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden;}
.laserDot{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#ff3b30 0%,rgba(255,59,48,.45) 55%,transparent 72%);transform:translate(-50%,-50%);}

/* floating props */
#props{position:absolute;left:86px;top:10px;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:.55rem;width:238px;max-height:calc(100% - 130px);overflow-y:auto;}
#props h4{margin:.15rem 0 .45rem;font-size:.82rem;color:var(--ink2);letter-spacing:.02em;}
#props .row{display:flex;align-items:center;gap:.4rem;margin:.32rem 0;flex-wrap:wrap;}
#props .row label{font-size:.8rem;color:var(--ink2);width:3.4rem;flex:none;}
#swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:.3rem 0;}
.sw{aspect-ratio:1;border-radius:9px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;min-height:0;box-shadow:none;}
.sw:hover{transform:scale(1.12);box-shadow:var(--shadow-sm);}
.sw.sel{outline:2px solid var(--accent);outline-offset:1px;}
#recentSw{display:flex;gap:4px;flex-wrap:wrap;}
#recentSw .sw{width:20px;height:20px;}
input[type=range].grow{flex:1;min-width:60px;}
.val{font-size:.78rem;color:var(--ink2);min-width:2rem;text-align:right;font-variant-numeric:tabular-nums;}

/* zoom + minimap */
#zoomctl{position:absolute;left:86px;bottom:12px;z-index:40;display:flex;gap:.3rem;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.22rem;box-shadow:var(--shadow);}
#zoomctl button{border:none;background:transparent;width:2.3rem;}
#zoomlbl{font-variant-numeric:tabular-nums;font-weight:700;min-width:3rem;text-align:center;}
#minimap{position:absolute;right:12px;bottom:12px;z-index:40;width:172px;height:118px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;}
#minimap canvas{width:100%;height:100%;display:block;}
#framebar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:41;display:none;gap:.35rem;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.28rem .55rem;box-shadow:var(--shadow);max-width:92%;overflow-x:auto;}
#framebar.has{display:flex;}
#framebar .fb{white-space:nowrap;font-size:.82rem;}
#followBar{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:42;display:flex;gap:.45rem;align-items:center;background:var(--panel);border:1.5px solid var(--sel);border-radius:999px;padding:.28rem .35rem .28rem .8rem;box-shadow:var(--shadow);font-weight:700;font-size:.86rem;max-width:94%;}
#followBar[hidden]{display:none;}
#followBar .fl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#followBar button{border-radius:999px;padding:.2rem .7rem;min-height:1.9rem;flex:none;}

/* right panel */
#side{flex:none;width:312px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);margin:.55rem .55rem .55rem 0;overflow:hidden;display:flex;flex-direction:column;z-index:55;min-height:0;}
#sidetabs{display:flex;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none;}
#sidetabs button{flex:1;border:none;border-radius:0;background:transparent;font-size:.82rem;font-weight:700;padding:.6rem .1rem;color:var(--ink2);white-space:nowrap;min-width:3.4rem;box-shadow:none;}
#sidetabs button:hover{transform:none;box-shadow:none;color:var(--accent);}
#sidetabs button.on{color:var(--sel);box-shadow:inset 0 -2px 0 var(--sel);}
.sidepage{flex:1;overflow-y:auto;padding:.6rem;display:none;min-height:0;}
.sidepage.on{display:block;}
.sidepage h3{margin:.75rem 0 .45rem;font-size:1.02rem;font-family:"Jua","Pretendard Variable",sans-serif;font-weight:400;letter-spacing:.01em;}
.sidepage h3:first-child{margin-top:0;}
.sidepage p.hint{color:var(--ink2);font-size:.82rem;line-height:1.5;margin:.25rem 0;}
.acc{border:1.5px solid var(--line);border-radius:14px;margin:.5rem 0;overflow:hidden;background:var(--panel);box-shadow:0 1px 3px rgba(31,52,86,.05);}
.acc>summary{padding:.6rem .7rem;font-weight:700;cursor:pointer;background:var(--panel2);list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:2.5rem;}
.acc>summary::-webkit-details-marker{display:none;}
.acc .accbody{padding:.55rem .65rem;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;}
.grid2 button,.grid3 button{font-size:.82rem;padding:.45rem .3rem;text-align:center;}
.wfull{width:100%;}
.mt{margin-top:.5rem;} .mb{margin-bottom:.5rem;}
.small{font-size:.8rem;color:var(--ink2);}
.kv{display:flex;justify-content:space-between;gap:.5rem;padding:.28rem 0;border-bottom:1px dashed var(--line);font-size:.86rem;}
.kv b{font-variant-numeric:tabular-nums;}

/* chat */
#chatlog{display:flex;flex-direction:column;gap:.45rem;padding-bottom:.4rem;}
.msg{max-width:92%;padding:.45rem .65rem;border-radius:16px 16px 16px 5px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;word-break:break-word;line-height:1.45;}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-radius:16px 16px 5px 16px;}
.msg .who{font-size:.72rem;font-weight:800;margin-bottom:.12rem;}
.msg.sys{align-self:center;background:transparent;border:none;color:var(--ink2);font-size:.78rem;text-align:center;}
#chatbar{display:flex;gap:.35rem;}
#chatbar input{flex:1;min-width:0;}

/* lists */
.li{display:flex;align-items:center;gap:.5rem;padding:.5rem .55rem;border:1.5px solid var(--line);border-radius:14px;margin:.4rem 0;background:var(--panel);}
.li .grow{flex:1;min-width:0;}
.li .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pill{font-size:.72rem;font-weight:800;border-radius:999px;padding:.1rem .5rem;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;}
.pill.host{background:var(--accent);color:#fff;border-color:var(--accent);}
.pill.view{background:#f3e2c7;}
.commentpin{border-left:3px solid var(--warn);}

/* modals */
.modalWrap{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:.7rem;}
.modalWrap.open{display:flex;}
.modal{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);width:min(680px,100%);max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;}
.modal.wide{width:min(880px,100%);}
.modal header{display:flex;align-items:center;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line);}
.modal header h2{font-size:1.18rem;margin:0;flex:1;font-family:"Jua","Pretendard Variable",sans-serif;font-weight:400;}
.modal .mbody{padding:.8rem .9rem;overflow-y:auto;}
.modal footer{padding:.6rem .9rem;border-top:1px solid var(--line);display:flex;gap:.4rem;justify-content:flex-end;flex-wrap:wrap;}
.x{width:2.4rem;border:none;background:transparent;font-size:1.1rem;}

/* toast */
#toasts{position:fixed;top:calc(var(--tb) + 10px);left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:min(480px,94vw);}
.toast{background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-size:.9rem;font-weight:600;box-shadow:var(--shadow);animation:tin .25s ease;max-width:100%;text-align:center;}
@keyframes tin{from{opacity:0;transform:translateY(-6px);}to{opacity:1;}}
.reactionFloat{position:absolute;font-size:30px;animation:rfloat 1.6s ease-out forwards;pointer-events:none;z-index:8;}
@keyframes rfloat{from{opacity:1;transform:translateY(0) scale(.7);}to{opacity:0;transform:translateY(-90px) scale(1.25);}}

/* text editor overlay */
#textEditor{position:absolute;z-index:90;display:none;background:transparent;}
#textEditor textarea{background:rgba(255,255,255,.92);border:2px dashed var(--accent);border-radius:6px;padding:4px 6px;resize:both;min-width:120px;}
[data-theme="dark"] #textEditor textarea{background:rgba(20,26,32,.92);color:#fff;}

/* music studio */
#pianoKeys{display:flex;position:relative;height:150px;user-select:none;touch-action:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111;}
.wkey{flex:1;background:linear-gradient(#fdfdfd,#e8e8e8);border-right:1px solid #bbb;position:relative;cursor:pointer;}
.wkey:active,.wkey.hit{background:#ffd9a8;}
.wkey .klab{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;color:#888;}
.bkey{position:absolute;top:0;height:58%;background:linear-gradient(#444,#0a0a0a);border-radius:0 0 5px 5px;z-index:2;cursor:pointer;border:1px solid #000;}
.bkey:active,.bkey.hit{background:#7a4b12;}
.seqgrid{display:grid;gap:3px;}
.seqcell{aspect-ratio:1;border-radius:6px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;padding:0;min-height:0;box-shadow:none;}
.seqcell:hover{transform:none;box-shadow:none;}
.seqcell.on{background:var(--accent);border-color:var(--accent);}
.seqcell.play{outline:2px solid var(--warn);}
#staffCv{width:100%;height:110px;background:#fff;border:1px solid var(--line);border-radius:10px;}
[data-theme="dark"] #staffCv{background:#f4f4f4;}

/* games */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:230px;}
.ttt button{aspect-ratio:1;font-size:1.7rem;font-weight:800;padding:0;}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:300px;}
.c4 button{aspect-ratio:1;border-radius:50%;padding:0;font-size:1rem;}
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:280px;}
.bingo button{aspect-ratio:1;padding:0;font-weight:700;}
.bingo button.hit{background:var(--accent);color:#fff;}
.flashcard{border:2px solid var(--accent);border-radius:18px;padding:1.4rem 1rem;text-align:center;font-size:1.3rem;font-weight:800;cursor:pointer;background:var(--accent-soft);min-height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.3rem;}
table.mini{border-collapse:collapse;width:100%;font-size:.82rem;}
table.mini td,table.mini th{border:1px solid var(--line);padding:.28rem .35rem;text-align:left;}
.ptable{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;font-size:.62rem;}
.ptable div{border:1px solid var(--line);border-radius:4px;padding:2px 1px;text-align:center;background:var(--panel2);}

#presentBar{position:fixed;inset:auto 0 0 0;z-index:300;background:rgba(12,18,24,.92);color:#fff;display:none;padding:.6rem;gap:.5rem;align-items:center;justify-content:center;flex-wrap:wrap;}
#presentBar.open{display:flex;}
#presentBar button{background:#2a3644;color:#fff;border-color:#43536a;}
body.focusUI #topbar,body.focusUI #toolbar,body.focusUI #side,body.focusUI #props,body.focusUI #minimap{display:none!important;}
body.focusUI #zoomctl{left:12px;}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:350;overflow:hidden;}
.confettiBit{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cfall linear forwards;}
@keyframes cfall{to{transform:translateY(105vh) rotate(560deg);opacity:.85;}}

/* ===== UI refresh: game-style polish ===== */
#topbar>button{border-radius:999px;background:var(--panel2);padding:.34rem .8rem;}
#topbar .av{box-shadow:0 0 0 2px var(--panel),var(--shadow-sm);}
#boardwrap{background:#f8fafc;}
[data-theme="dark"] #boardwrap{background:#131a23;}
#side ::-webkit-scrollbar,.sidepage::-webkit-scrollbar,#toolbar::-webkit-scrollbar,.bwin .bbody::-webkit-scrollbar{width:9px;height:9px;}
#side ::-webkit-scrollbar-thumb,.sidepage::-webkit-scrollbar-thumb,#toolbar::-webkit-scrollbar-thumb,.bwin .bbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--panel);}
.ttt button:hover,.c4 button:hover,.bingo button:hover{transform:none;}
.pill{border-radius:999px;}
#zoomctl button{border-radius:999px;}
#zoomctl button:hover{transform:none;box-shadow:none;background:var(--accent-soft);}
#props{box-shadow:var(--shadow);}
#props h4{font-family:"Jua","Pretendard Variable",sans-serif;font-weight:400;font-size:.95rem;color:var(--ink);}

/* board floating windows (기능을 보드 위에서 바로 쓰는 창) */
#boardWins{position:absolute;inset:0;z-index:30;pointer-events:none;}
.bwin{position:absolute;pointer-events:auto;width:min(440px,95%);max-height:calc(100% - 20px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
.bwin>header{display:flex;align-items:center;gap:.4rem;padding:.45rem .6rem;background:var(--panel2);border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;flex:none;}
.bwin>header:active{cursor:grabbing;}
.bwin>header b{font-size:1rem;font-family:"Jua","Pretendard Variable",sans-serif;font-weight:400;}
.bwin .bx{width:2rem;height:2rem;min-height:2rem;padding:0;border-radius:8px;}
.bwin .bbody{overflow-y:auto;padding:.6rem;overscroll-behavior:contain;}
#actTicker{font-size:.78rem;color:var(--sel);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16rem;}
.actline{color:var(--sel);font-weight:700;}
/* piano touch feel */
.wkey{transition:transform .05s ease,background .05s ease;}

  <!-- ======= TOP BAR ======= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
"use strict";
/* ================================================================
   공유 화이트보드 — 무한 캔버스 엔진
   성능: 배경/본문/오버레이 3레이어 분리, rAF 스로틀 렌더, 뷰포트 컬링,
   포인터 코얼레싱, 동기화 메시지 배칭.
   실시간 연결: 화이트보드 전용 Firebase Realtime Database로 방 코드별
   동기화 — 아이패드·안드로이드 폰·PC 등 다른 기기끼리도 같은 방 코드면
   스트로크·객체·커서·채팅이 거의 지연 없이 오간다. 채팅방용 Firebase와는
   분리된 전용 프로젝트를 쓴다. 같은 기기의 탭끼리는 BroadcastChannel이
   빠른 경로로 함께 동작하고, WebRTC 음성 시그널링도 같은 채널을 쓴다.
================================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const nowT=()=>new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg,ms=2600){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),ms);}
function download(name, blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
function downloadText(name,text,type="application/json"){download(name,new Blob([text],{type}));}
function mailTo(subject,body){ const a=document.createElement("a"); a.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body); document.body.appendChild(a); a.click(); a.remove(); }

/* ---------------- state ---------------- */
const ME={ id:uid(), name:"나", color:"#e4572e", avatar:"🦊", anon:false, role:"host", hand:false, muted:false };
const PALETTE=["#182230","#ffffff","#e4572e","#f2a007","#ffd60a","#2fbf71","#0e7a5f","#2b7cd3","#123c69","#7c4dbd","#e75480","#8d6e63","#607d8b","#000000","#9e9e9e","#ff8a65","#4fc3f7","#aed581","#ba68c8","#f06292","#795548","#00acc1","#5c6bc0","#26a69a"];
const CB_PALETTE=["#000000","#e69f00","#56b4e9","#009e73","#f0e442","#0072b2","#d55e00","#cc79a7","#ffffff","#999999"]; // 색맹 친화 (Okabe-Ito)
const STICKY_COLORS=["#fff3a3","#ffd1dc","#c8f2c8","#bfe3ff","#e6ccff","#ffe0b2"];
const state={
  tool:"pen", color:"#182230", fill:"none", width:4, opacity:1, dash:"solid",
  font:"sans", fontSize:28, bold:false, italic:false, align:"left",
  bg:"dots", bgColor:"#ffffff", theme:"light",
  snap:false, guides:true, correct:false, palm:2, pressureCurve:1, tilt:true,
  drawSound:false, haptics:false, lang:"ko", followId:null, presenting:false,
  myRole:"editor", exportLock:false, bgImage:null, viewFilter:"",
  brushPreset:{name:"기본 펜",dash:[],jitter:0}, favTools:[], customPalettes:[], recentColors:[],
  penBtnAction:"eraser", captionSize:14, speechRate:1, voiceLang:"ko-KR",
};
let objects=[];            // 보드 객체 (z 순서)
let cam={x:0,y:0,z:1};
let selected=new Set();    // 선택된 객체 id
let clipboard=[]; let trash=[]; let versions=[]; let activityLog=[]; let commentsAll=[];
let undoStack=[], redoStack=[];
let framesCache=[];        // 프레임 목록 (objects에서 파생)
const imgCache=new Map();  // src -> HTMLImageElement
function getImg(src){ if(imgCache.has(src)) return imgCache.get(src); const im=new Image(); im.onload=()=>{imgCache.set(src,im);dirty();}; imgCache.set(src,im); im.src=src; return im; }
function logAct(text){ activityLog.unshift({t:nowT(),who:ME.anon?"익명":ME.name,text}); if(activityLog.length>120)activityLog.pop(); renderActivity(); }
function myName(){ return ME.anon?"익명":ME.name; }

/* ---------------- canvas layers ---------------- */
const wrap=$("#boardwrap"), cvBg=$("#cvbg"), cv=$("#cv"), cvOv=$("#cvOverlay");
const gBg=cvBg.getContext("2d"), g=cv.getContext("2d"), gOv=cvOv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){ const r=wrap.getBoundingClientRect(); W=r.width; H=r.height; DPR=Math.min(devicePixelRatio||1,2);
  [cvBg,cv,cvOv].forEach(c=>{c.width=W*DPR;c.height=H*DPR;}); dirtyBg(); dirty(); }
new ResizeObserver(()=>resize()).observe(wrap);
const w2s=(x,y)=>({x:(x-cam.x)*cam.z, y:(y-cam.y)*cam.z});
const s2w=(x,y)=>({x:x/cam.z+cam.x, y:y/cam.z+cam.y});
function viewWorld(){ return {x0:cam.x,y0:cam.y,x1:cam.x+W/cam.z,y1:cam.y+H/cam.z}; }

/* ---------------- render scheduling ---------------- */
let needBg=true, needMain=true, rafId=0;
function dirty(){ needMain=true; schedule(); }
function dirtyBg(){ needBg=true; schedule(); }
function schedule(){ if(!rafId) rafId=requestAnimationFrame(frame); }
function frame(){ rafId=0; if(needBg){needBg=false;drawBg();} if(needMain){needMain=false;drawMain();} drawOverlay(); if(needBg||needMain) schedule(); }

/* ---------------- background ---------------- */
const BG_COLORS={white:"#ffffff",grid:"#ffffff",dots:"#ffffff",lines:"#ffffff",dark:"#20262e",blueprint:"#123c69",chalk:"#2f4f3e",cork:"#c8a165"};
function drawBg(){ const c=gBg; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  const base = state.bgImage? "#ffffff" : (state.bg==="dark"||state.bg==="blueprint"||state.bg==="chalk") ? BG_COLORS[state.bg] : state.bgColor;
  c.fillStyle=base; c.fillRect(0,0,W,H);
  if(state.bgImage){ const im=getImg(state.bgImage); if(im.complete&&im.naturalWidth){ c.globalAlpha=.5; const sc=Math.max(W/im.naturalWidth,H/im.naturalHeight); c.drawImage(im,0,0,im.naturalWidth*sc,im.naturalHeight*sc); c.globalAlpha=1; } }
  const kind=state.bg; if(kind==="white") return;
  const step=28*cam.z; if(step<7) return;
  const ox=(-cam.x*cam.z)%step, oy=(-cam.y*cam.z)%step;
  const darkBg=(kind==="dark"||kind==="blueprint"||kind==="chalk");
  if(kind==="dots"){ c.fillStyle=darkBg?"rgba(255,255,255,.28)":"rgba(30,50,70,.20)";
    for(let x=ox;x<W;x+=step) for(let y=oy;y<H;y+=step){ c.beginPath(); c.arc(x,y,1.4,0,7); c.fill(); } }
  else if(kind==="grid"||kind==="blueprint"||kind==="dark"||kind==="chalk"){ c.strokeStyle=darkBg?"rgba(255,255,255,.16)":"rgba(30,50,70,.13)"; c.lineWidth=1; c.beginPath();
    for(let x=ox;x<W;x+=step){c.moveTo(x,0);c.lineTo(x,H);} for(let y=oy;y<H;y+=step){c.moveTo(0,y);c.lineTo(W,y);} c.stroke(); }
  else if(kind==="lines"){ c.strokeStyle="rgba(43,124,211,.30)"; c.lineWidth=1; c.beginPath(); for(let y=oy;y<H;y+=step){c.moveTo(0,y);c.lineTo(W,y);} c.stroke(); }
  else if(kind==="cork"){ c.fillStyle="rgba(120,72,20,.12)"; for(let i=0;i<40;i++){ c.fillRect((i*97)%W,(i*57)%H,3,3);} }
}

/* ---------------- object geometry ---------------- */
function objBBox(o){ switch(o.type){
  case "stroke": { let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0; o.pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}); const pad=(o.w||4)/2+2; return {x:x0-pad,y:y0-pad,w:x1-x0+pad*2,h:y1-y0+pad*2}; }
  case "text": { const w=o.w||measureTextW(o); return {x:o.x,y:o.y,w,h:(o.size*1.35)*(o.text.split("\n").length)}; }
  case "math": return {x:o.x,y:o.y,w:o.w||o.text.length*o.size*.62,h:o.size*1.5};
  case "sticker": case "stamp": return {x:o.x,y:o.y,w:o.size,h:o.size};
  case "reaction": return {x:o.x,y:o.y,w:34,h:34};
  case "comment": return {x:o.x-14,y:o.y-14,w:28,h:28};
  case "audio": case "dom": case "image": case "shape": case "frame": case "sticky": case "link": case "code": case "chart": case "table": case "checklist": case "connector": 
    if(o.type==="connector"){ const a=byId(o.from),b=byId(o.to); if(!a||!b) return {x:o.x||0,y:o.y||0,w:10,h:10}; const ca=center(a),cb=center(b); return {x:Math.min(ca.x,cb.x),y:Math.min(ca.y,cb.y),w:Math.abs(ca.x-cb.x)||10,h:Math.abs(ca.y-cb.y)||10}; }
    return {x:o.x,y:o.y,w:o.w||100,h:o.h||80};
  default: return {x:o.x||0,y:o.y||0,w:o.w||60,h:o.h||60};
}}
function center(o){ const b=objBBox(o); return {x:b.x+b.w/2,y:b.y+b.h/2}; }
function byId(id){ return objects.find(o=>o.id===id); }
function measureTextW(o){ g.font=`${o.italic?"italic ":""}${o.bold?"700 ":""}${o.size}px ${fontStack(o.font)}`; return Math.max(...o.text.split("\n").map(l=>g.measureText(l).width),10); }
function fontStack(f){ return f==="hand"?'"Gaegu","Nanum Pen Script",cursive': f==="mono"?'"JetBrains Mono",monospace': f==="serif"?'Georgia,"Times New Roman",serif':'"Pretendard Variable",Pretendard,sans-serif'; }

/* ---------------- draw objects ---------------- */
function drawMain(){ const c=g; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  c.translate(-cam.x*cam.z,-cam.y*cam.z); c.scale(cam.z,cam.z);
  const v=viewWorld(), pad=80/cam.z+80;
  for(const o of objects){ const b=objBBox(o);
    if(b.x+b.w<v.x0-pad||b.y+b.h<v.y0-pad||b.x>v.x1+pad||b.y>v.y1+pad) continue; // 뷰포트 컬링
    c.save(); drawObj(c,o); c.restore(); }
  syncMediaLayer();
}
function dashArr(o){ return o.dash==="dash"?[10,7]:o.dash==="dot"?[2,6]:[]; }
function strokeStyle(c,o){ c.strokeStyle=o.color; c.lineWidth=o.sw!=null?o.sw:(o.w||3); c.globalAlpha=o.opacity??1; c.setLineDash(dashArr(o)); c.lineCap="round"; c.lineJoin="round"; }
function drawObj(c,o){ switch(o.type){
  case "stroke": drawStroke(c,o); break;
  case "shape": drawShape(c,o); break;
  case "connector": { const a=byId(o.from),b=byId(o.to); if(!a||!b)break; const ca=center(a),cb=center(b); strokeStyle(c,{...o,color:o.color||"#5b6a7a",w:o.w||3}); c.beginPath(); c.moveTo(ca.x,ca.y);
    if(o.curve){ const mx=(ca.x+cb.x)/2; c.bezierCurveTo(mx,ca.y,mx,cb.y,cb.x,cb.y);} else c.lineTo(cb.x,cb.y); c.stroke();
    const ang=Math.atan2(cb.y-ca.y,cb.x-ca.x); c.setLineDash([]); c.fillStyle=o.color||"#5b6a7a"; c.beginPath(); c.moveTo(cb.x,cb.y); c.lineTo(cb.x-12*Math.cos(ang-.42),cb.y-12*Math.sin(ang-.42)); c.lineTo(cb.x-12*Math.cos(ang+.42),cb.y-12*Math.sin(ang+.42)); c.closePath(); c.fill(); break; }
  case "text": case "math": { c.globalAlpha=o.opacity??1; c.fillStyle=o.color; const fam=o.type==="math"?'italic Georgia,serif':fontStack(o.font);
    c.font=`${o.type==="math"?"italic ":o.italic?"italic ":""}${o.bold?"700 ":""}${o.size}px ${o.type==="math"?"Georgia,serif":fontStack(o.font)}`;
    c.textAlign=o.align||"left"; c.textBaseline="top";
    const lines=o.text.split("\n"); const ax=o.align==="center"?o.x+(o.w||measureTextW(o))/2 : o.align==="right"? o.x+(o.w||measureTextW(o)) : o.x;
    lines.forEach((l,i)=>c.fillText(l,ax,o.y+i*o.size*1.35)); if(o.underline){ c.fillRect(o.x,o.y+lines.length*o.size*1.35+2,(o.w||measureTextW(o)),Math.max(2,o.size/12)); } break; }
  case "sticky": { c.globalAlpha=o.opacity??1; c.fillStyle=o.color; roundRect(c,o.x,o.y,o.w,o.h,8); c.fill();
    c.fillStyle="rgba(0,0,0,.16)"; c.fillRect(o.x,o.y,o.w,14);
    c.fillStyle="#26303a"; c.font=`${o.size||17}px "Pretendard Variable",sans-serif`; c.textBaseline="top";
    wrapText(c,o.text,o.x+10,o.y+22,o.w-20,(o.size||17)*1.4,o.h-26); break; }
  case "frame": { c.globalAlpha=1; c.fillStyle="rgba(255,255,255,.55)"; if(state.bg==="dark"||state.bg==="chalk")c.fillStyle="rgba(255,255,255,.08)"; roundRect(c,o.x,o.y,o.w,o.h,6); c.fill();
    c.strokeStyle="#2b7cd3"; c.lineWidth=2.5; c.setLineDash([9,6]); roundRect(c,o.x,o.y,o.w,o.h,6); c.stroke(); c.setLineDash([]);

function snapshot(){ return JSON.stringify(objects.map(stripObj)); }
function stripObj(o){ const c={...o}; delete c._video; delete c.stream; return c; }
function pushHistory(){ undoStack.push(snapshot()); if(undoStack.length>80)undoStack.shift(); redoStack.length=0; updateUndoBtns(); markSaved(); }
function restore(snap){ objects=JSON.parse(snap); selected.clear(); mediaEls.forEach((el,id)=>{ if(!objects.find(o=>o.id===id)){el.remove();mediaEls.delete(id);} }); dirty(); renderProps(); }
function undo(){ if(!undoStack.length)return; redoStack.push(snapshot()); restore(undoStack.pop()); broadcast({t:"state", objects:objects.map(stripObj)}); updateUndoBtns(); toast("실행 취소"); }
function redo(){ if(!redoStack.length)return; undoStack.push(snapshot()); restore(redoStack.pop()); broadcast({t:"state", objects:objects.map(stripObj)}); updateUndoBtns(); toast("다시 실행"); }
function updateUndoBtns(){ const u=$("#btnUndo"),r=$("#btnRedo"); if(u)u.disabled=!undoStack.length; if(r)r.disabled=!redoStack.length; }

function addObject(o, silent){ o.id=o.id||uid(); o.author=o.author||myName(); objects.push(o); if(!silent){ pushHistory(); broadcast({t:"op",op:{kind:"add",obj:stripObj(o)}}); xp(2); } dirty(); return o; }
function removeObjects(ids){ ids.forEach(id=>{ const o=byId(id); if(o){ trash.unshift({...stripObj(o),deletedAt:nowT()}); } });
  objects=objects.filter(o=>!ids.includes(o.id)); selected.clear(); pushHistory(); broadcast({t:"op",op:{kind:"del",ids}}); dirty(); renderProps(); }
function mutate(o){ pushHistory(); broadcast({t:"op",op:{kind:"update",obj:stripObj(o)}}); dirty(); }

    else if(!wasSel) selected=new Set([o.id]);

function snapVal(v){ return state.snap? Math.round(v/28)*28 : v; }
function doMove(w){ const dx0=w.x-moving.sx, dy0=w.y-moving.sy; guideLines=[];
  [...selected].map(byId).filter(Boolean).forEach(o=>{ const st=moving.starts.get(o.id); if(!st)return;
    let nx=snapVal(st.x+dx0), ny=snapVal(st.y+dy0);
    if(state.guides){ // 자석 가이드: 다른 객체 중심/모서리에 스냅
      const b=objBBox(o); const others=objects.filter(x=>!selected.has(x.id)).slice(0,60);
      for(const ot of others){ const ob=objBBox(ot); [ob.x,ob.x+ob.w/2,ob.x+ob.w].forEach(gx=>{ if(Math.abs((nx)-gx)<7/cam.z){ nx=gx; guideLines.push({v:gx}); } });
        [ob.y,ob.y+ob.h/2,ob.y+ob.h].forEach(gy=>{ if(Math.abs((ny)-gy)<7/cam.z){ ny=gy; guideLines.push({h:gy}); } }); } }
    const ddx=nx-st.x, ddy=ny-st.y;
    if(o.type==="stroke"){ o.pts.forEach((p,i)=>{ p.x=st.raw[i].x+ddx; p.y=st.raw[i].y+ddy; }); }
    else if(o.type!=="connector"){ o.x=st.ox+ddx; o.y=st.oy+ddy; } });
  dirty(); }
function doResize(w){ const o=byId(resizing.id); if(!o)return; const b=resizing.b0;
  const nw=Math.max(24,snapVal(w.x)-b.x), nh=Math.max(20,snapVal(w.y)-b.y);
  if(o.type==="stroke"){ const sx=nw/b.w, sy=nh/b.h; if(!resizing.raw)resizing.raw=o.pts.map(p=>({...p})); o.pts.forEach((p,i)=>{ p.x=b.x+(resizing.raw[i].x-b.x)*sx; p.y=b.y+(resizing.raw[i].y-b.y)*sy; }); }
  else { o.w=nw; o.h=nh; } dirty(); }

/* ---------------- shape auto-correct ---------------- */
function correctStroke(st){ const pts=st.pts; if(pts.length<8)return null;
  let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0; pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});
  const w=x1-x0,h=y1-y0; if(w<24&&h<24)return null;
  const d0=Math.hypot(pts[0].x-pts[pts.length-1].x,pts[0].y-pts[pts.length-1].y);
  const closed=d0<Math.max(w,h)*.38;
  const base={color:st.color,sw:Math.max(2,st.w),fill:"none",opacity:1,dash:"solid"};
  if(!closed){ // 직선 판정: 시작-끝 직선에서 평균 편차
    const a=pts[0],b=pts[pts.length-1]; const len=Math.hypot(b.x-a.x,b.y-a.y)||1; let dev=0;
    pts.forEach(p=>{ dev+=Math.abs((b.y-a.y)*p.x-(b.x-a.x)*p.y+b.x*a.y-b.y*a.x)/len; }); dev/=pts.length;
    if(dev<len*.06) return {type:"shape",shape:"line",x:a.x,y:a.y,w:b.x-a.x,h:b.y-a.y,...base};
    return null; }
  // 원 판정: 중심 거리 분산
  const cx=(x0+x1)/2, cy=(y0+y1)/2; const rs=pts.map(p=>Math.hypot(p.x-cx,p.y-cy)); const rm=rs.reduce((s,v)=>s+v,0)/rs.length;
  const variance=rs.reduce((s,v)=>s+(v-rm)**2,0)/rs.length;
  if(Math.sqrt(variance)<rm*.16&&Math.abs(w-h)<Math.max(w,h)*.45) return {type:"shape",shape:"ellipse",x:x0,y:y0,w,h,...base};
  // 사각형 판정: 모서리 근처 점 밀도
  const cornerScore=pts.filter(p=>{ const dx=Math.min(Math.abs(p.x-x0),Math.abs(p.x-x1)), dy=Math.min(Math.abs(p.y-y0),Math.abs(p.y-y1)); return dx<w*.16||dy<h*.16; }).length/pts.length;
  if(cornerScore>.82) return {type:"shape",shape:"rect",x:x0,y:y0,w,h,...base};
  return null; }

/* ---------------- templates ---------------- */
function T_box(x,y,w,h,label,fill,color){ return {type:"shape",shape:"roundrect",x,y,w,h,color:color||"#5b6a7a",fill:fill||"#ffffff",label,sw:2.5,opacity:1,dash:"solid"}; }
function T_title(x,y,text,size,color){ return {type:"text",x,y,text,size:size||30,color:color||"#182230",font:"sans",bold:true,align:"left",opacity:1}; }
function T_sticky(x,y,text,color){ return {type:"sticky",x,y,w:170,h:120,text,size:16,color:color||STICKY_COLORS[0],opacity:1}; }
function T_shape(shape,x,y,w,h,label,fill){ return {type:"shape",shape,x,y,w,h,color:"#5b6a7a",fill:fill||"#eef4fb",label,sw:2.5,opacity:1,dash:"solid"}; }
function tplCols(cols,x0,y0){ const out=[]; cols.forEach((c,i)=>{ const x=x0+i*300; out.push(T_box(x,y0,270,470,"",c.c)); out.push(T_title(x+16,y0+12,c.t,21)); (c.items||["","",""]).forEach((it,j)=>out.push(T_sticky(x+18,y0+56+j*132,it||"여기에 써보세요",STICKY_COLORS[j%STICKY_COLORS.length]))); }); return out; }
function tplMatrix(cells,x0,y0,title){ const out=[T_title(x0,y0,title,28)]; cells.forEach((c,i)=>{ const x=x0+(i%2)*430, y=y0+56+Math.floor(i/2)*250; out.push(T_box(x,y,400,225,"",c.c)); out.push(T_title(x+16,y+12,c.t,20)); out.push(T_sticky(x+18,y+52,"여기에 써보세요",STICKY_COLORS[i%4])); }); return out; }
function tplTable(cols,rows,x0,y0,title){ const data=[cols]; for(let i=0;i<rows;i++)data.push(cols.map(()=>"")); return [T_title(x0,y0,title,28),{type:"table",x:x0,y:y0+52,w:Math.max(560,cols.length*170),h:52+rows*46,rows:data,opacity:1}]; }
function tplChecklist(title,items,x0,y0){ return [T_title(x0,y0,title,28),{type:"checklist",x:x0,y:y0+52,w:430,h:70+items.length*27,title,items:items.map(t=>({t,done:false})),opacity:1}]; }
function tplMindmap(center,branches,x0,y0){ const out=[T_shape("ellipse",x0+330,y0+190,240,110,center,"#ffd60a")]; const pos=[[-40,-30],[330,-60],[700,-30],[700,300],[330,430],[-40,300]];
  branches.forEach((b,i)=>{ const [dx,dy]=pos[i%pos.length]; const s=T_shape("roundrect",x0+dx+ (i>3?40:0),y0+dy+60,210,84,b,"#eef4fb"); out.push(s); out.push({type:"connector",from:"__c",to:"__b"+i,color:"#8fa1b3",w:2.5}); s._bid="__b"+i; }); out[0]._bid="__c"; return out; }
function tplTree(root,levels,x0,y0){ const out=[T_shape("roundrect",x0+300,y0,220,64,root,"#ffd60a")]; const kids=levels[0]||["항목 1","항목 2","항목 3"];
  kids.forEach((k,i)=>{ const x=x0+i*300; const s=T_shape("roundrect",x,y0+130,220,60,k,"#eef4fb"); s._bid="__k"+i; out.push(s); out.push({type:"connector",from:"__r",to:"__k"+i,color:"#8fa1b3",w:2.5});

function applyTemplate(i){ const [name,cat,fn]=TEMPLATES[i]; pushHistory();
  const c=s2w(W/2-300,H/2-200); const made=fn().map(o=>({...o})); const idMap={};
  made.forEach(o=>{ o.id=uid(); if(o._bid){ idMap[o._bid]=o.id; delete o._bid; } o.x=(o.x||0)+c.x; o.y=(o.y||0)+c.y; if(o.type==="stroke")o.pts.forEach(p=>{p.x+=c.x;p.y+=c.y;}); });
  made.forEach(o=>{ if(o.type==="connector"){ o.from=idMap[o.from]||o.from; o.to=idMap[o.to]||o.to; } });
  made.forEach(o=>{ objects.push(o); broadcast({t:"op",op:{kind:"add",obj:stripObj(o)}}); });
  dirty(); logAct("템플릿 적용 — "+name); toast("템플릿을 넣었어요: "+name); xp(5); }

function snapshotPNG(scale=1){ const pad=30; if(!objects.length)return null;

  const w=Math.min(2400,(x1-x0+pad*2)*scale), h=Math.min(2400,(y1-y0+pad*2)*scale); const cvs=document.createElement("canvas"); cvs.width=w; cvs.height=h; const c=cvs.getContext("2d");
  c.fillStyle=state.bg==="dark"?"#20262e":"#ffffff"; c.fillRect(0,0,w,h); const sc=w/(x1-x0+pad*2); c.scale(sc,sc); c.translate(-x0+pad,-y0+pad);

/* 안전한 수식 계산기 (토크나이저 + 재귀 하강 파서 — eval/Function 미사용) */
function safeCalc(expr){ const toks=[]; let i=0;
  while(i<expr.length){ const ch=expr[i]; if(ch===" "){ i++; continue; }
    if(/[\d.]/.test(ch)){ let n=""; while(i<expr.length&&/[\d.]/.test(expr[i]))n+=expr[i++]; toks.push({t:"n",v:parseFloat(n)}); continue; }
    if("+-*/%^()".includes(ch)){ toks.push({t:ch}); i++; continue; } throw new Error("bad char"); }
  let pos=0; const peek=()=>toks[pos], next=()=>toks[pos++];
  function parseExpr(){ let v=parseTerm(); while(peek()&&(peek().t==="+"||peek().t==="-")){ const op=next().t; const r=parseTerm(); v=op==="+"?v+r:v-r; } return v; }
  function parseTerm(){ let v=parsePow(); while(peek()&&(peek().t==="*"||peek().t==="/"||peek().t==="%")){ const op=next().t; const r=parsePow(); v=op==="*"?v*r:op==="/"?v/r:v%r; } return v; }
  function parsePow(){ let v=parseUnary(); if(peek()&&peek().t==="^"){ next(); v=Math.pow(v,parsePow()); } return v; }
  function parseUnary(){ if(peek()&&peek().t==="-"){ next(); return -parseUnary(); } return parseAtom(); }
  function parseAtom(){ const tk=next(); if(!tk)throw new Error("end"); if(tk.t==="n")return tk.v; if(tk.t==="("){ const v=parseExpr(); if(!next()||toks[pos-1].t!==")")throw new Error("paren"); return v; } throw new Error("atom"); }
  const out=parseExpr(); if(pos<toks.length)throw new Error("trailing"); return Math.round(out*1e10)/1e10; }

function beep(freq=660,dur=.25){ try{ const ctx=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)()); if(ctx.state!=="running"){ try{ const p=ctx.resume(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} } const o=ctx.createOscillator(),gn=ctx.createGain();
  o.frequency.value=freq; gn.gain.setValueAtTime(.12,ctx.currentTime); gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur); o.connect(gn).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur); }catch(e){} }

    const shuffle=a=>{ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; };

function startSpeechRec(mode){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("이 브라우저는 음성 인식을 지원하지 않아요 (크롬에서 써보세요)"); return; }
  const rec=new SR(); rec.lang=state.voiceLang; rec.interimResults=false; toast("🎤 듣고 있어요… 말해보세요");
  rec.onresult=e=>{ const txt=e.results[0][0].transcript;
    if(mode==="cmd"){ const cmds=[["펜","pen"],["지우개","eraser"],["선택","select"],["텍스트","text"],["포스트잇","sticky"],["레이저","laser"]];
      const hit=cmds.find(([k])=>txt.includes(k)); if(hit){ setTool(hit[1]); toast("음성 명령: "+hit[0]+" 도구로 바꿨어요"); return; }
      if(txt.includes("지워")||txt.includes("취소")){ undo(); return; } toast("알아듣지 못했어요: "+txt); return; }
    const c=s2w(W/2,H/2); addObject({type:"text",x:c.x,y:c.y,text:txt,size:26,color:state.color,font:"sans",bold:false,italic:false,align:"left",opacity:1}); toast("음성을 글로 넣었어요"); };
  rec.onerror=()=>toast("음성 인식에 실패했어요"); rec.start(); }

function toSVG(){ let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0; objects.forEach(o=>{const b=objBBox(o);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);});
  if(!objects.length){x0=0;y0=0;x1=100;y1=100;}
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" width="${x1-x0}" height="${y1-y0}"><rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="white"/>`;
  objects.forEach(o=>{ if(o.type==="stroke"){ s+=`<polyline points="${o.pts.map(p=>p.x+","+p.y).join(" ")}" fill="none" stroke="${o.color}" stroke-width="${o.w}" stroke-linecap="round" opacity="${o.opacity??1}"/>`; }
    else if(o.type==="shape"){ const b=objBBox(o); if(o.shape==="ellipse")s+=`<ellipse cx="${b.x+b.w/2}" cy="${b.y+b.h/2}" rx="${b.w/2}" ry="${b.h/2}" fill="${o.fill==="none"?"none":o.fill}" stroke="${o.color}" stroke-width="${o.w}"/>`; else s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="${o.fill==="none"?"none":o.fill}" stroke="${o.color}" stroke-width="${o.w}"/>`; }
    else if(o.type==="text"||o.type==="sticky"){ s+=`<text x="${o.x}" y="${o.y+(o.size||16)}" font-size="${o.size||16}" fill="${o.type==="sticky"?"#26303a":o.color}">${esc((o.text||"").split("\n")[0])}</text>`; } });
  return s+"</svg>"; }

function drawMinimap(){ const c=$("#mmCv").getContext("2d"); const mw=344,mh=236; c.clearRect(0,0,mw,mh);
  c.fillStyle=state.theme==="dark"?"#1e262f":"#f5f7f8"; c.fillRect(0,0,mw,mh); if(!objects.length)return;
  let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0; objects.forEach(o=>{const b=objBBox(o);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);});
  const v=viewWorld(); x0=Math.min(x0,v.x0); y0=Math.min(y0,v.y0); x1=Math.max(x1,v.x1); y1=Math.max(y1,v.y1);
  const sc=Math.min(mw/(x1-x0),mh/(y1-y0)); const ox=(mw-(x1-x0)*sc)/2, oy=(mh-(y1-y0)*sc)/2;
  objects.forEach(o=>{ const b=objBBox(o); c.fillStyle=o.type==="stroke"?(o.color||"#333"):"#2b7cd3"; c.globalAlpha=.75; c.fillRect(ox+(b.x-x0)*sc,oy+(b.y-y0)*sc,Math.max(2,b.w*sc),Math.max(2,b.h*sc)); });
  c.globalAlpha=1; c.strokeStyle="#e4572e"; c.lineWidth=2.5; c.strokeRect(ox+(v.x0-x0)*sc,oy+(v.y0-y0)*sc,(v.x1-v.x0)*sc,(v.y1-v.y0)*sc);
  $("#minimap")._map={x0,y0,sc,ox,oy}; }
$("#minimap").addEventListener("click",e=>{ const m=$("#minimap")._map; if(!m)return; const r=e.currentTarget.getBoundingClientRect();
  const wx=m.x0+((e.clientX-r.left)*(344/r.width)-m.ox)/m.sc, wy=m.y0+((e.clientY-r.top)*(236/r.height)-m.oy)/m.sc;

/* ================================================================
   음악 스튜디오 — WebAudio 합성 악기 300종+
   각 악기 = 패밀리 합성 레시피 + 음역/밝기 변형으로 실제 연주 가능
================================================================ */
let AC=null, masterGain=null, musicDest=null;
/* 믹서/마스터링 상태 — 악기 버스 → 3밴드 EQ → 컴프레서 → (리버브/딜레이 병렬) → 마스터 */
const mix={vol:.85,low:0,mid:0,high:0,rev:.22,dly:0,master:true};
let eqLow,eqMid,eqHigh,compNode,revGainNode,dlyGainNode,finalGain;
function makeIR(dur,decay){ const rate=AC.sampleRate, len=Math.floor(rate*dur), buf=AC.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } return buf; }
function applyMix(){ if(!AC||!finalGain)return; finalGain.gain.value=mix.vol; eqLow.gain.value=mix.low; eqMid.gain.value=mix.mid; eqHigh.gain.value=mix.high;
  revGainNode.gain.value=mix.rev; dlyGainNode.gain.value=mix.dly; compNode.threshold.value=mix.master?-18:0; compNode.ratio.value=mix.master?6:1; }
/* 오디오 복구: iOS는 전화·잠금·앱 전환 뒤 컨텍스트가 "interrupted"가 되는데
   예전 코드는 "suspended"만 resume해서 한 번 끊기면 새로고침 전까지 무음이었다.
   running이 아닌 모든 상태에서 resume을 시도하고, 사용자 제스처·화면 복귀
   때마다 다시 깨우며, 상태 변화를 감지해 자동 복구한다. */
function resumeAudio(){ if(!AC||AC.state==="running")return; try{ const p=AC.resume(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }
function resumeCtx(c){ if(!c||c.state==="running")return; try{ const p=c.resume(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }
["pointerdown","touchend","keydown"].forEach(ev=>window.addEventListener(ev,()=>{ resumeAudio(); resumeCtx(typeof beep!=="undefined"?beep.ctx:null); resumeCtx(typeof drawSndCtx!=="undefined"?drawSndCtx:null); },{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{ if(!document.hidden)resumeAudio(); });
function audio(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
    AC.onstatechange=()=>{ if(AC&&AC.state!=="running"&&!document.hidden)resumeAudio(); };
    masterGain=AC.createGain(); masterGain.gain.value=.9; // 악기 입력 버스 (playNote가 여기로 연결)
    eqLow=AC.createBiquadFilter(); eqLow.type="lowshelf"; eqLow.frequency.value=220;

   위치를 받을 방법이 없었고 ② 카메라가 30초 뒤 지워지는 일회성 이벤트
   큐로 가서 연속 이동 때 누락·역순이 생겼고 ③ 상대의 좌상단 좌표를 그대로
   복사해 기기마다 화면 크기가 다르면 중심이 어긋났고 ④ 스로틀이 마지막
   위치를 버려 상대가 멈춘 지점까지 못 따라갔다.
   새 방식: 화면 "중심점+줌"을 전용 cams/<id> 노드(최신값 유지)와
   BroadcastChannel로 보내고, 시작 즉시 cam-req로 현재 위치를 요청하며,
   타임스탬프로 오래된 업데이트를 버리고, 마지막 위치는 trailing 전송으로
   반드시 보낸다. 팔로워가 직접 화면을 움직이면 따라가기가 풀린다. */
let followApplying=false, followLastTs=0, camLastSent=0, camPending=null, camSendTimer=null;
function camCenter(){ return {cx:cam.x+W/(2*cam.z), cy:cam.y+H/(2*cam.z), z:cam.z, ts:Date.now()}; }
function sendCamNow(p){ camLastSent=performance.now(); camPending=null;
  if(bc){ try{ bc.postMessage({t:"cam",cam:p,from:ME.id}); }catch(e){} }
  if(fbRoom){ try{ fbRoom.child("cams/"+ME.id).set(p).catch(()=>{}); }catch(e){} } }
function broadcastCam(force){ const p=camCenter(); const t=performance.now();
  if(!force&&t-camLastSent<60){ camPending=p;
    if(!camSendTimer)camSendTimer=setTimeout(()=>{ camSendTimer=null; if(camPending)sendCamNow(camPending); },70);
    return; }
  if(camSendTimer){ clearTimeout(camSendTimer); camSendTimer=null; }
  sendCamNow(p); }
function applyFollowCam(id,c,force){ if(state.followId!==id||!c)return;
  if(c.ts&&!force){ if(followLastTs&&c.ts<=followLastTs)return; }
  if(c.ts)followLastTs=c.ts;
  const z=clamp(c.z||cam.z||1,.08,6); let nx,ny;
  if(c.cx!=null&&c.cy!=null){ nx=c.cx-W/(2*z); ny=c.cy-H/(2*z); }        // 중심 기준 — 기기 화면 크기가 달라도 같은 중심을 본다
  else if(c.x!=null&&c.y!=null){ nx=c.x; ny=c.y; }                        // 예전 형식(좌상단) 호환
  else return;
  followApplying=true;
  cam={x:nx,y:ny,z};
  dirtyBg(); dirty(); $("#zoomlbl").textContent=Math.round(z*100)+"%"; drawMinimap();
  followApplying=false; }
function notePeerCam(id,c){ if(!c)return; const p=peers.get(id); if(p)p.cam=c;
  if(state.followId===id)applyFollowCam(id,c); }
function followName(){ const p=state.followId?peers.get(state.followId):null; return p?(p.name||"참여자"):"참여자"; }
function updateFollowUI(){ const bar=$("#followBar"); if(!bar)return;
  if(state.followId){ bar.hidden=false; $("#followLbl").textContent="👀 "+followName()+"님 화면 따라가는 중"; }
  else bar.hidden=true; }
function startFollow(id){ const p=peers.get(id); state.followId=id; followLastTs=0;
  if(p&&p.cam)applyFollowCam(id,p.cam,true);                            // 마지막으로 알려진 위치로 즉시 이동
  broadcast({t:"cam-req",to:id});                                       // 상대에게 현재 화면을 지금 보내달라고 요청
  updateFollowUI(); renderPeople();
  toast("👀 "+(p?(p.name||"참여자"):"참여자")+"님 따라가기 시작 — 상대 화면을 같이 봐요"); }
function stopFollow(reason){ if(!state.followId)return; state.followId=null; followLastTs=0;
  updateFollowUI(); renderPeople();
  if(reason==="local")toast("화면을 직접 움직여 따라가기를 해제했어요");
  else if(reason==="left")toast("따라가던 참여자가 나가서 따라가기를 해제했어요");
  else if(reason!=="silent")toast("따라가기를 해제했어요"); }
$("#followStop").addEventListener("click",()=>stopFollow());
function broadcastCursor(w,laser){ broadcast({t:"cursor",x:w.x,y:w.y,name:myName(),color:ME.color,laser:!!laser,tool:state.tool}); }
/* ---------------- 기능 상태 실시간 공유 (feat) ----------------
   게임·위젯·문제은행·월드컵·시퀀서 같은 "기능"의 상태를 방 코드별
   Firebase feat/<키> 노드 + BroadcastChannel로 동기화한다. 보드에 오브젝트로
   붙이는 방식이 아니라, 같은 방의 모든 기기가 같은 기능 상태를 함께 쓰는 방식. */
let featApplying=false, featSeen={};
function featSync(key,data){ if(featApplying)return; const ts=Date.now(); featSeen[key]=ts;
  if(bc){ try{ bc.postMessage({t:"feat",key,data,from:ME.id,ts}); }catch(e){} }
  if(fbRoom){ try{ const c=fbClean(data); if(c)fbRoom.child("feat/"+key).set({data:c,by:ME.id,ts}).catch(()=>{}); }catch(e){} } }
function applyFeatRemote(key,data,from,ts){ if(!data||typeof FEAT_APPLIERS==="undefined")return; const ap=FEAT_APPLIERS[key]; if(!ap)return;
  featApplying=true; try{ ap(data,from); }catch(e){} featApplying=false; }
/* 기능별 공유 상태 적용기 — Firebase feat / BroadcastChannel feat가 여기로 들어온다 */
const FEAT_APPLIERS={
 poll:d=>applyPoll(d),
 timer:d=>{ timerState=Object.assign({},timerState,d); if($("#tmDisp"))timerRender(); else if(timerState.running)timerTickStart(); },
 stop:d=>{ stopState=Object.assign({},stopState,d); if($("#swDisp"))stopRender(); },
 seq:d=>{ const wasPlaying=!!seqTimer;
   if(d.tracks){ tracks=d.tracks; bpm=d.bpm||bpm; stepsPerBar=d.stepsPerBar||16; seqBars=d.seqBars||1; swingVal=d.swing||0; if(d.chords)chords=d.chords; }
   else if(d.state){ bpm=d.bpm||bpm; tracks=defTracks(); d.state.forEach((r,ri)=>{ if(tracks[ri])tracks[ri].steps=r; }); }
   if($("#seqZone")){ buildSeq(); const bl=$("#msBpmLbl"); if(bl)bl.textContent=bpm; const be=$("#msBpm"); if(be)be.value=bpm; const cp=$("#chordProg"); if(cp)cp.textContent=chords.join(" → "); }
   if(d.playing&&!wasPlaying)startSeq(d); else if(!d.playing&&wasPlaying)stopSeq(true); },
 inst:d=>{ const inst=INSTRUMENTS.find(i=>i.id===d.id); if(inst){ curInst=inst; const mc=$("#msCur"); if(mc)mc.textContent=inst.name; } },
 wc:d=>{ wcState=d; if($("#wcBody"))wcRender(); },
 aki:d=>{ akiState=d; if($("#akiBody"))akiRender(); },
 qb:d=>{ qbState=d; if($("#qbOut"))qbRender(); },
 ttt:d=>{ tttState=d; if($("#tttGrid"))renderTTT(); },
 c4:d=>{ c4State=d; if($("#c4Grid"))renderC4(); },
 bingo:d=>{ bingoState=d; if($("#bingoGrid"))renderBingo(); },
 mem:d=>{ memState=d; if($("#memGrid"))renderMemory(); },
 bb:d=>{ bbShared=d; if(typeof bb!=="undefined"&&bb&&bb.el)bbAdopt(); },
 score:d=>{ scoreBoard=d; if($("#scoreList"))openWidget("score",true); },
 calc:d=>{ lastCalc=d; const o=$("#calcOut"); if(o)o.textContent="= "+d.res; const inp=$("#calcIn"); if(inp&&document.activeElement!==inp)inp.value=d.expr; },
 unit:d=>{ lastUnit=d; if($("#uCat"))openWidget("unit",true); },
 dice:d=>{ lastDice=d; const o=$("#diceOut"); if(o)o.textContent=d.out; const mg=$("#diceMsg"); if(mg)mg.textContent=d.msg; },
 flash:d=>{ flashState=d; if($("#fcCard")&&flashShowFn)flashShowFn(); },

 picker:d=>{ pickerState={names:d.names||"",text:d.text||"",result:d.result||null}; const o=$("#pkOut"); if(o)o.innerHTML=pickerRenderHTML(pickerState.result); const ta=$("#pkNames"); if(ta&&document.activeElement!==ta)ta.value=pickerState.names; },
 dday:d=>{ ddayState=d; if($("#ddDate"))openWidget("dday",true); }
};
function onSync(m){ if(!m||m.from===ME.id)return;
  if(m._eid){ if(seenEventIds.has(m._eid))return; seenEventIds.add(m._eid);
    if(seenEventIds.size>400){ const it=seenEventIds.values(); for(let i=0;i<150;i++)seenEventIds.delete(it.next().value); } }
  const P=peers.get(m.from);
  switch(m.t){
   case "hello": { const isNew=!peers.has(m.from); peers.set(m.from,{...m.me,last:Date.now()}); if(m.me&&m.me.cam)notePeerCam(m.from,m.me.cam); renderAvatars(); renderPeople();
     if(objects.length&&bc) bc.postMessage({t:"state",objects:objects.map(stripObj),to:m.from,from:ME.id});
     if(isNew){ toast("👋 "+m.me.name+"님이 들어왔어요"); addChat("","",false,true); chatLog.lastChild.textContent=m.me.name+"님이 들어왔어요"; entranceFx(); notify("화이트보드",m.me.name+"님이 방에 들어왔어요"); } break; }
   case "ping": { const prevP=peers.get(m.from); peers.set(m.from,{...m.me,last:Date.now(),cam:(m.me&&m.me.cam)||(prevP&&prevP.cam)||null}); if(m.me&&m.me.cam)notePeerCam(m.from,m.me.cam); renderAvatars(); break; }
   case "state": if(m.to&&m.to!==ME.id)break; if(joinedAt>Date.now()-15000||!objects.length){ objects=m.objects; selected.clear(); dirty(); drawMinimap(); } break;
   case "op": applyOp(m.op); break;
   case "live": if(m.obj){ remoteLive.set(m.from,m.obj); dirty(); } break;
   case "live-end": remoteLive.delete(m.from); dirty(); break;
   case "cursor": drawRemoteCursor(m); break;
   case "cam": notePeerCam(m.from,m.cam); break;
   case "cam-req": if(!m.to||m.to===ME.id) broadcastCam(true); break;
   case "chat": if(m.mid){ if(seenChatIds.has(m.mid))break; seenChatIds.add(m.mid); } addChat(m.who,m.text,false); notify("채팅",m.who+": "+m.text); break;
   case "hand": if(P){P.hand=m.hand; renderAvatars(); renderPeople();} if(m.hand)toast("✋ "+(P?P.name:"참여자")+"님이 손을 들었어요"); break;
   case "react": { const c=s2w(W/2,H/2); floatReaction(m.emoji,c); break; }
   case "toast": toast(m.msg); break;
   case "note": { const inst=INSTRUMENTS.find(i=>i.name===m.inst); if(inst&&!voiceMuted)playNoteRemote(m.midi,inst); break; }
   case "poll": applyPoll({q:m.poll.q,opts:m.poll.opts,votes:m.poll.opts.map(()=>0),voted:[],startedAt:Date.now()}); ensurePollWin(); break;
   case "vote": break; // 투표 집계는 feat 상태(poll)가 단일 소스 — 이벤트로 중복 집계하지 않음
   case "score": scoreBoard=m.board; break;
   case "timer": break; // 타이머는 feat 상태로 동기화한다 (예전의 초당 토스트 스팸 버그 수정)
   case "feat": applyFeatRemote(m.key,m.data,m.from,m.ts); break;
   case "openwin": openWinRemote(m.win,m.arg); break;
   case "recplay": scheduleRecPlay(m); break;
   case "bbpitch": if(typeof bb!=="undefined"&&bb&&bb.el&&!bb.pitching)bbPitchBall(true,m); break;
   case "bbswing": if(typeof bb!=="undefined"&&bb&&bb.pitching)bbSwing(); break;
   case "bbtake": if(typeof bb!=="undefined"&&bb&&bb.pitching)bbTake(); break;
   case "setrole": if(m.to===ME.id){ state.myRole=state.myRole==="viewer"?"editor":"viewer"; toast(state.myRole==="viewer"?"권한이 '보기 전용'으로 바뀌었어요":"권한이 '그리기 가능'으로 바뀌었어요"); } break;
   case "muteReq": if(m.to===ME.id){ setVoiceMute(true); toast("방장이 음소거했어요"); } break;
   case "rtc": handleRTC(m); break;
   case "join-req": if(ME.role==="host"){ broadcast({t:"join-res",to:m.from,ok:!roomPwHash||m.pw===roomPwHash}); } break;
   case "join-res": if(m.to===ME.id){ if(m.ok){ toast("방에 입장했어요"); } else { toast("비밀번호가 틀렸어요"); } } break;
  } }
function applyOp(op){ if(!op)return;
  if(op.kind==="add"){ if(!byId(op.obj.id))objects.push(op.obj); }
  if(op.kind==="update"){ const i=objects.findIndex(o=>o.id===op.obj.id); if(i>=0)objects[i]=op.obj; else objects.push(op.obj); }
  if(op.kind==="del"){ objects=objects.filter(o=>!op.ids.includes(o.id)); }
  dirty(); drawMinimap(); }
function drawRemoteCursor(m){ let el=cursorEls.get(m.from);
  if(!el){ el=document.createElement("div"); el.className="rcursor"; el.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 3l14 7-6.5 1.5L9 18z" fill="${m.color}" stroke="#fff"/></svg><span class="nm" style="background:${m.color}">${esc(m.name)}</span>`; $("#remoteCursors").appendChild(el); cursorEls.set(m.from,el); }
  const s=w2s(m.x,m.y); el.style.left=s.x+"px"; el.style.top=s.y+"px"; el.style.opacity=1;
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.opacity=0; },4000);
  if(m.laser)drawLaserDot(s.x,s.y,false); }

function entranceFx(){ const c=$("#confetti"); const colors=["#e4572e","#f2a007","#2fbf71","#2b7cd3","#e75480"];
  for(let i=0;i<26;i++){ const d=document.createElement("div"); d.className="confettiBit"; d.style.left=Math.random()*100+"vw"; d.style.background=colors[i%5]; d.style.animationDuration=(1.1+Math.random())+"s"; d.style.transform=`rotate(${Math.random()*360}deg)`; c.appendChild(d); setTimeout(()=>d.remove(),2400); } }
function notify(title,body){ if(document.hidden&&"Notification" in window&&Notification.permission==="granted"){ try{ new Notification(title,{body}); }catch(e){} } if(state.haptics&&navigator.vibrate)navigator.vibrate(30); }

/* ---------------- WebRTC voice ---------------- */
let voiceStream=null, voiceMuted=false, rtcPeers=new Map(), voiceOn=false;
async function toggleVoice(){ if(voiceOn){ voiceOn=false; if(voiceStream)voiceStream.getTracks().forEach(t=>t.stop()); rtcPeers.forEach(pc=>pc.close()); rtcPeers.clear(); toast("음성 채팅을 껐어요"); renderPeople(); return; }
  try{ voiceStream=await navigator.mediaDevices.getUserMedia({audio:true}); voiceOn=true;
    peers.forEach((p,id)=>makePC(id,true)); toast("🎙 음성 채팅 켜짐 — 방 사람들과 말할 수 있어요"); renderPeople();
    // 자동 자막 (음성 인식 지원 시)
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ const rec=new SR(); rec.lang=state.voiceLang; rec.continuous=true; rec.interimResults=true;
      rec.onresult=e=>{ const txt=[...e.results].map(r=>r[0].transcript).join(""); const el=$("#liveCaption"); if(el)el.textContent="자막: "+txt; }; try{ rec.start(); }catch(e){} }
  }catch(e){ toast("마이크 권한이 필요해요"); } }
function setVoiceMute(m){ voiceMuted=m; if(voiceStream)voiceStream.getAudioTracks().forEach(t=>t.enabled=!m); }
async function makePC(id,initiate){ if(rtcPeers.has(id))return rtcPeers.get(id);
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); rtcPeers.set(id,pc);
  if(voiceStream)voiceStream.getTracks().forEach(t=>pc.addTrack(t,voiceStream));
  pc.ontrack=e=>{ let a=document.getElementById("rtc-"+id); if(!a){ a=document.createElement("audio"); a.id="rtc-"+id; a.autoplay=true; document.body.appendChild(a); } a.srcObject=e.streams[0]; };
  pc.onicecandidate=e=>{ if(e.candidate)broadcast({t:"rtc",to:id,kind:"ice",data:e.candidate}); };
  if(initiate){ const offer=await pc.createOffer(); await pc.setLocalDescription(offer); broadcast({t:"rtc",to:id,kind:"offer",data:offer}); }
  return pc; }
async function handleRTC(m){ if(m.to!==ME.id)return; const pc=await makePC(m.from,false);
  if(m.kind==="offer"){ await pc.setRemoteDescription(m.data); const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); broadcast({t:"rtc",to:m.from,kind:"answer",data:ans}); }
  else if(m.kind==="answer"){ await pc.setRemoteDescription(m.data); }
  else if(m.kind==="ice"){ try{ await pc.addIceCandidate(m.data); }catch(e){} } }

  bb.balls=0; bb.strikes=0; bbRender(); }
function endHalf(){ const key=bbAttackIdx()===0?"us":"them"; if(bb.score[key][bb.inning-1]===null)bb.score[key][bb.inning-1]=0;
  if(bb.half==="초"){ bb.half="말"; } else { if(bb.inning>=bb.totalInnings){ bb.over=true; bbLog("경기 종료!"); broadcast({t:"toast",msg:"⚾ 경기 종료!"}); bbRender(); return; } bb.inning++; bb.half="초"; }
  newHalf(); bbRender(); }
function bbDefend(type){ // 수비: AI 타자 결과
  const swingP={fast:.62,curve:.5,change:.55}[type]||.55; const r=Math.random();
  if(r>swingP){ if(Math.random()<.5){ bbLog("상대 타자 헛스윙 — 스트라이크!"); bbStrike(); } else { bbLog("상대 타자가 참았어요 — 볼"); bbBall(); } return; }
  const q=Math.random(); const res=q>.93?"hr":q>.82?"d2":q>.66?"d1":q>.45?"out":"foul";
  if(res==="foul"){ bbLog("상대 타자 파울"); if(bb.strikes<2)bb.strikes++; bbRender(); }
  else if(res==="out"){ bbLog("상대 타자 아웃! 잘 던졌어요"); bbOut(); }
  else { bbLog("상대 타자에게 맞았어요 — "+({d1:"안타",d2:"2루타",hr:"홈런"})[res]); if(res==="hr"){ let runs=1+bb.bases.filter(Boolean).length; bb.bases=[0,0,0]; addRuns(runs); bb.balls=0; bb.strikes=0; bbRender(); } else { bbAdvance({d1:1,d2:2}[res],false); bb.balls=0; bb.strikes=0; bbRender(); } } }
