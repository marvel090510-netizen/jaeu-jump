<body>

<script>
"use strict";
/* =========================================================
   성공하고싶은 재우 - Jump King style vertical platformer
   완전 구현: PNG 픽셀아트 배경/버튼(코드생성 data-URL),
   충전점프, 이벤트, 태초귀환, 조작설정 위치/크기 저장
   ========================================================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const VW = 480;           // virtual width (fixed)
let VH = 800;             // virtual height (responsive)
function resize(){
  const c = document.getElementById('game-container');
  const w = c.clientWidth, h = c.clientHeight;
  VH = Math.round(VW * (h / w));
  if(VH < 640) VH = 640;
  if(VH > 1180) VH = 1180;
  cv.width = VW; cv.height = VH;
  ctx.imageSmoothingEnabled = false;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,150));
/* ---------- Persistent settings ---------- */
const SETTINGS_KEY='jaewoo_settings_v1';
const HIGH_KEY='jaewoo_highest_v1';
function loadSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');
    return {
      layout: s.layout||'split',
      leftX: s.leftX??0, leftY: s.leftY??0,
      rightX: s.rightX??0, rightY: s.rightY??0,
      jumpX: s.jumpX??0, jumpY: s.jumpY??0,
      btnScale: s.btnScale??1.0
    };
  }catch(e){ return {layout:'split',leftX:0,leftY:0,rightX:0,rightY:0,jumpX:0,jumpY:0,btnScale:1.0}; }
}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(SET)); }catch(e){} }
let SET = loadSettings();
/* =========================================================
   PIXEL-ART ASSET GENERATION (data-URL like offscreen canvases)
   ========================================================= */
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.imageSmoothingEnabled=false; return {c,x}; }
/* --- tall world background per zone (built once) --- */
const ZONE_H = 620; // virtual px per zone tile
const BG = {};
function noiseFill(x,w,h,fn){
  for(let py=0;py<h;py+=2) for(let px=0;px<w;px+=2){
    const col = fn(px,py);
    if(col){ x.fillStyle=col; x.fillRect(px,py,2,2); }
  }
}
function buildZoneMeadow(){
  const {c,x}=mkCanvas(VW,ZONE_H);
  const g=x.createLinearGradient(0,0,0,ZONE_H);
  g.addColorStop(0,'#1a2a4a'); g.addColorStop(.25,'#2d5a6a'); g.addColorStop(.55,'#5aa06a'); g.addColorStop(.8,'#8ec98a'); g.addColorStop(1,'#5a9a5a');
  x.fillStyle=g; x.fillRect(0,0,VW,ZONE_H);
  // far mountains (top)
  x.fillStyle='#20304a';
  for(let i=0;i<6;i++){ const bx=i*90-30, by=40+Math.sin(i)*20, bw=120, bh=120;
    x.beginPath(); x.moveTo(bx,ZONE_H*.35); x.lineTo(bx+bw/2,by); x.lineTo(bx+bw,ZONE_H*.35); x.fill(); }
  // floating islands mid
  for(let i=0;i<7;i++){
    const ix=((i*97)%VW), iy=180+((i*53)%180), iw=70+((i*31)%50);
    x.fillStyle='#3a6b35'; x.fillRect(ix,iy,iw,8);
    x.fillStyle='#5a9a4a'; x.fillRect(ix,iy,iw,4);
    x.fillStyle='#2a4a25';
    x.beginPath(); x.moveTo(ix,iy+8); x.lineTo(ix+iw/2,iy+8+30+((i*17)%25)); x.lineTo(ix+iw,iy+8); x.fill();
    // waterfall
    if(i%2===0){ x.fillStyle='rgba(150,220,255,.55)'; x.fillRect(ix+iw/2-3,iy+8,6,60+((i*23)%50));
      x.fillStyle='rgba(200,240,255,.5)'; x.fillRect(ix+iw/2-2,iy+8,2,60); }
  }
  // clouds low
  for(let i=0;i<10;i++){ x.fillStyle='rgba(230,245,255,.18)'; const cx=(i*67)%VW,cy=380+((i*41)%180),cw=60+((i*29)%70);
    x.fillRect(cx,cy,cw,6); x.fillRect(cx+10,cy-4,cw-20,6); }
  // ground hint
  x.fillStyle='#4a8a4a'; x.fillRect(0,ZONE_H-60,VW,60);
  x.fillStyle='#3a6a3a'; x.fillRect(0,ZONE_H-30,VW,30);
  return c;
}
function buildZoneCanyon(){
  const {c,x}=mkCanvas(VW,ZONE_H);
  const g=x.createLinearGradient(0,0,0,ZONE_H);
  g.addColorStop(0,'#3a1a0a'); g.addColorStop(.35,'#7a3a1a'); g.addColorStop(.7,'#b5641f'); g.addColorStop(1,'#6b2d0a');
  x.fillStyle=g; x.fillRect(0,0,VW,ZONE_H);
  // canyon walls
  for(let i=0;i<5;i++){ const wx=i*110-40, wy=80+((i*37)%80);
    x.fillStyle='rgba(90,40,10,.6)'; x.beginPath(); x.moveTo(wx,0); x.lineTo(wx+60,ZONE_H); x.lineTo(wx+100,ZONE_H); x.lineTo(wx+140,0); x.fill(); }
  // floating rock debris
  for(let i=0;i<18;i++){ const rx=(i*73)%VW, ry=60+((i*53)%480), rw=20+((i*19)%40);
    x.fillStyle='#5a2a10'; x.fillRect(rx,ry,rw,6); x.fillStyle='#3a1a08'; x.fillRect(rx,ry+6,rw,4); }
  // dust haze
  noiseFill(x,VW,ZONE_H,()=>Math.random()<.06?'rgba(200,120,60,.15)':null);
  x.fillStyle='#5a2a10'; x.fillRect(0,ZONE_H-50,VW,50);
  return c;
}
function buildZoneIce(){
  const {c,x}=mkCanvas(VW,ZONE_H);
  const g=x.createLinearGradient(0,0,0,ZONE_H);
  g.addColorStop(0,'#0a2a4a'); g.addColorStop(.4,'#3a6a9a'); g.addColorStop(.75,'#8ac0e0'); g.addColorStop(1,'#d0e8f5');
  x.fillStyle=g; x.fillRect(0,0,VW,ZONE_H);
  // ice spires
  for(let i=0;i<8;i++){ const sx=i*70-20, sy=60+((i*43)%120), sw=50;
    x.fillStyle='rgba(200,235,255,.5)'; x.beginPath(); x.moveTo(sx+sw/2,sy); x.lineTo(sx,ZONE_H*.6); x.lineTo(sx+sw,ZONE_H*.6); x.fill(); }
  // ice shards
  for(let i=0;i<40;i++){ const ix=(i*97)%VW, iy=(i*61)%ZONE_H;
    x.fillStyle='rgba(240,250,255,.6)'; x.fillRect(ix,iy,2,6); x.fillRect(ix-2,iy+2,6,2); }
  // snow patches
  noiseFill(x,VW,ZONE_H,()=>Math.random()<.04?'rgba(255,255,255,.25)':null);
  x.fillStyle='#b8d8e8'; x.fillRect(0,ZONE_H-40,VW,40);
  return c;
}
function buildZoneStorm(){
  const {c,x}=mkCanvas(VW,ZONE_H);
  const g=x.createLinearGradient(0,0,0,ZONE_H);
  g.addColorStop(0,'#0a0420'); g.addColorStop(.4,'#2a1050'); g.addColorStop(.75,'#4a2080'); g.addColorStop(1,'#1a0838');
  x.fillStyle=g; x.fillRect(0,0,VW,ZONE_H);
  // storm clouds
  for(let i=0;i<24;i++){ const cx=(i*83)%VW, cy=(i*47)%ZONE_H, cw=80+((i*33)%90);
    x.fillStyle='rgba(90,40,140,.35)'; x.fillRect(cx,cy,cw,10); x.fillRect(cx+15,cy-6,cw-30,8); }
  // lightning bolts
  for(let i=0;i<5;i++){ const lx=(i*131)%VW, ly=(i*91)%ZONE_H;
    x.strokeStyle='rgba(220,180,255,.8)'; x.lineWidth=2; x.beginPath();
    let px=lx,py=ly; x.moveTo(px,py);
    for(let s=0;s<5;s++){ px+=(Math.random()-.5)*14; py+=14+Math.random()*10; x.lineTo(px,py); }
    x.stroke(); }
  // purple glow
  noiseFill(x,VW,ZONE_H,()=>Math.random()<.03?'rgba(180,120,255,.18)':null);
  x.fillStyle='#1a0838'; x.fillRect(0,ZONE_H-50,VW,50);
  return c;
}
function buildZonePeak(){
  const {c,x}=mkCanvas(VW,ZONE_H);
  const g=x.createLinearGradient(0,0,0,ZONE_H);
  g.addColorStop(0,'#04040f'); g.addColorStop(.5,'#0a0a28'); g.addColorStop(1,'#1a1a4a');
  x.fillStyle=g; x.fillRect(0,0,VW,ZONE_H);
  // stars
  for(let i=0;i<120;i++){ const sx=(i*137)%VW, sy=(i*89)%ZONE_H;
    const b=.3+Math.random()*.7; x.fillStyle='rgba(255,255,255,'+b+')'; x.fillRect(sx,sy,Math.random()<.2?2:1,Math.random()<.2?2:1); }
  // moon
  x.fillStyle='#f5f0d0'; x.beginPath(); x.arc(VW-70,90,34,0,7); x.fill();
  x.fillStyle='#e8e0b0'; x.beginPath(); x.arc(VW-82,80,8,0,7); x.fill();
  // distant peaks
  x.fillStyle='#0a0a2a';
  for(let i=0;i<5;i++){ const bx=i*120-40; x.beginPath(); x.moveTo(bx,ZONE_H); x.lineTo(bx+80,ZONE_H*.5+((i*41)%60)); x.lineTo(bx+160,ZONE_H); x.fill(); }
  // gold sparkle at bottom
  noiseFill(x,VW,ZONE_H,()=>Math.random()<.015?'rgba(255,215,100,.6)':null);
  x.fillStyle='#0a0a2a'; x.fillRect(0,ZONE_H-40,VW,40);
  return c;
}
function buildZoneValley(){
  const {c,x}=mkCanvas(VW,ZONE_H);
  const g=x.createLinearGradient(0,0,0,ZONE_H);
  g.addColorStop(0,'#0a0a1a'); g.addColorStop(.5,'#141430'); g.addColorStop(1,'#05050d');
  x.fillStyle=g; x.fillRect(0,0,VW,ZONE_H);
  // dark clouds
  for(let i=0;i<26;i++){ const cx=(i*79)%VW, cy=(i*53)%ZONE_H, cw=90+((i*37)%80);
    x.fillStyle='rgba(30,30,60,.5)'; x.fillRect(cx,cy,cw,12); x.fillRect(cx+20,cy-6,cw-40,10); }
  // floating island undersides
  for(let i=0;i<8;i++){ const ix=((i*113)%VW), iy=60+((i*71)%420), iw=60+((i*37)%70);
    x.fillStyle='#1a1a2a'; x.beginPath(); x.moveTo(ix,iy); x.lineTo(ix+iw/2,iy+20+((i*13)%30)); x.lineTo(ix+iw,iy); x.fill();
    x.fillStyle='#2a2a3a'; x.fillRect(ix,iy-4,iw,4); }
  // waterfalls fading down
  for(let i=0;i<5;i++){ const wx=(i*131)%VW, wy=60+((i*67)%200);
    x.fillStyle='rgba(80,140,200,.3)'; x.fillRect(wx,wy,5,120+((i*23)%80)); }
  // mist
  noiseFill(x,VW,ZONE_H,()=>Math.random()<.05?'rgba(70,90,140,.12)':null);
  // bottom fog
  const fog=x.createLinearGradient(0,ZONE_H-200,0,ZONE_H);
  fog.addColorStop(0,'rgba(20,30,50,0)'); fog.addColorStop(1,'rgba(10,15,30,.9)');
  x.fillStyle=fog; x.fillRect(0,ZONE_H-200,VW,200);
  return c;
}
function buildAllBackgrounds(){
  BG.meadow = buildZoneMeadow();
  BG.canyon = buildZoneCanyon();
  BG.ice    = buildZoneIce();
  BG.storm  = buildZoneStorm();
  BG.peak   = buildZonePeak();
  BG.valley = buildZoneValley();
}
buildAllBackgrounds();
/* --- Title background --- */
function buildTitleBG(){
  const {c,x}=mkCanvas(VW,VH);
  // sky gradient right
  const g=x.createLinearGradient(VW*.35,0,VW*.35,VH);
  g.addColorStop(0,'#12062a'); g.addColorStop(.45,'#2a1450'); g.addColorStop(.8,'#1a2a50'); g.addColorStop(1,'#0a1428');
  x.fillStyle=g; x.fillRect(VW*.35,0,VW*.65,VH);
  // stars
  for(let i=0;i<80;i++){ const sx=VW*.4+Math.random()*VW*.6, sy=Math.random()*VH*.6;
    x.fillStyle='rgba(255,255,255,'+(.3+Math.random()*.7)+')'; x.fillRect(sx,sy,Math.random()<.25?2:1,Math.random()<.25?2:1); }
  // moon
  x.fillStyle='#f8f4d8'; x.beginPath(); x.arc(VW-90,110,40,0,7); x.fill();
  x.fillStyle='rgba(200,190,150,.5)'; x.beginPath(); x.arc(VW-100,100,10,0,7); x.fill();
  x.beginPath(); x.arc(VW-72,124,7,0,7); x.fill();
  // giant floating island
  x.fillStyle='#3a6b35'; x.fillRect(VW*.5,VH*.42,VW*.5,22);
  x.fillStyle='#5a9a4a'; x.fillRect(VW*.5,VH*.42,VW*.5,6);
  // island underside (rocky)
  x.fillStyle='#2a3a2a'; x.beginPath();
  x.moveTo(VW*.5,VH*.42+22); x.lineTo(VW*.68,VH*.72); x.lineTo(VW*.72,VH*.62); x.lineTo(VW*.78,VH*.76); x.lineTo(VW*.85,VH*.6); x.lineTo(VW,VH*.42+22); x.fill();
  // waterfall
  const wf=x.createLinearGradient(0,VH*.42,0,VH);
  wf.addColorStop(0,'rgba(180,230,255,.85)'); wf.addColorStop(1,'rgba(120,180,240,0)');
  x.fillStyle=wf; x.fillRect(VW*.66,VH*.42,14,VH*.55);
  x.fillStyle='rgba(220,245,255,.7)'; x.fillRect(VW*.665,VH*.42,4,VH*.55);
  // castle
  x.fillStyle='#1a1a3a'; x.fillRect(VW*.76,VH*.2,34,90);
  x.fillRect(VW*.8,VH*.14,22,120);
  x.fillRect(VW*.88,VH*.24,20,70);
  // towers tops
  for(const [cx,cy,cw,ch] of [[VW*.76,VH*.2,34,6],[VW*.8,VH*.14,22,8],[VW*.88,VH*.24,20,5]]){
    x.fillStyle='#2a2a4a'; x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+cw/2,cy-ch); x.lineTo(cx+cw,cy); x.fill();
  }
  // windows
  x.fillStyle='#ffd060';
  for(let i=0;i<4;i++){ x.fillRect(VW*.775,VH*.24+i*20,6,8); x.fillRect(VW*.81,VH*.18+i*22,5,7); }
  // summit glow
  const gl=x.createRadialGradient(VW*.85,VH*.12,10,VW*.85,VH*.12,160);
  gl.addColorStop(0,'rgba(255,240,180,.5)'); gl.addColorStop(1,'rgba(255,240,180,0)');
  x.fillStyle=gl; x.fillRect(VW*.5,0,VW*.5,VH*.5);
  // dark left safety panel
  const lp=x.createLinearGradient(0,0,VW*.55,0);
  lp.addColorStop(0,'rgba(4,4,14,.96)'); lp.addColorStop(.7,'rgba(6,6,20,.85)'); lp.addColorStop(1,'rgba(6,6,20,0)');
  x.fillStyle=lp; x.fillRect(0,0,VW*.55,VH);
  return c;
}
const TITLE_BG = buildTitleBG();
/* =========================================================
   GAME STATE
   ========================================================= */
const S = {
  screen:'title',   // title, game, settings, success, pause
  time:0,
  keys:{left:false,right:false,jump:false},
  mobile:{left:false,right:false,jump:false},
  player:null,
  platforms:[], moving:[], crumble:[], spikes:[], obstacles:[],
  rocks:[], particles:[],
  cameraY:0, cameraTargetY:0, shake:0,
  jumpCharging:false, chargePower:0, epochCooldown:0,
  highest:parseInt(localStorage.getItem(HIGH_KEY)||'0',10),
  success:false,
  // events
  eventTimer:0, eventDuration:0, eventType:null, eventText:'', eventDanger:false,
  invuln:0, shieldHits:0, moon:false, cloud:false, darkFog:0,
  gustTimer:0, gustDir:0, lightningTimer:0, quakeTimer:0, rockTimer:0,
  pauseBtnRect:{x:0,y:0,w:0,h:0},
  settingsHit:[],
  titleHit:[],
  toast:null, toastTimer:0
};
const ZONES = [
  {name:'깊은 구름 계곡', bg:'valley', start:-6, end:0, below:true},
  {name:'초록 초원과 부유섬', bg:'meadow', start:0, end:17},
  {name:'붉은 협곡과 낙석 지대', bg:'canyon', start:17, end:36},
  {name:'얼음 산맥과 빙벽', bg:'ice', start:36, end:56},
  {name:'보라색 폭풍의 밤', bg:'storm', start:56, end:76},
  {name:'별빛이 비치는 최종 정상', bg:'peak', start:76, end:200}
];
function zoneOf(i){
  for(const z of ZONES){ if(!z.below && i>=z.start && i<z.end) return z; }
  return ZONES[ZONES.length-1];
}
/* =========================================================
   WORLD GENERATION
   ========================================================= */
const SPACING = 58;
const TOTAL = 94;   // 94 platforms (>=86)
const START_Y = 0;
function generateWorld(){
  S.platforms=[]; S.moving=[]; S.crumble=[]; S.spikes=[]; S.obstacles=[]; S.rocks=[]; S.particles=[];
  let prevX = VW/2 - 40;
  for(let i=0;i<TOTAL;i++){
    const zone = zoneOf(i);
    const y = START_Y - i*SPACING;
    const diff = i/TOTAL;
    let type='normal';
    let isSafe = i<6; // guaranteed safe path
    if(!isSafe){
      const r=Math.random();
      if(zone.bg==='ice'){ if(r<.22) type='ice'; else if(r<.32) type='moving'; else if(r<.4) type='crumble'; else if(r<.48) type='spike'; }
      else if(zone.bg==='canyon'){ if(r<.18) type='spike'; else if(r<.28) type='crumble'; else if(r<.36) type='moving'; else if(r<.44) type='obstacle'; }
      else if(zone.bg==='storm'){ if(r<.15) type='moving'; else if(r<.28) type='crumble'; else if(r<.38) type='spike'; else if(r<.46) type='obstacle'; }
      else if(zone.bg==='peak'){ if(r<.15) type='moving'; else if(r<.28) type='spike'; else if(r<.38) type='obstacle'; }
      else { if(r<.14) type='moving'; else if(r<.24) type='crumble'; else if(r<.32) type='spike'; else if(r<.4) type='obstacle'; }
    }
    const w = (type==='ice')?74:64;
    const maxOff = 40 + diff*90;
    let x;
    if(i===0){ x=prevX; }
    else {
      // reachable from prev
      const jumpReach = 120 + diff*70;
      x = prevX + (Math.random()*2-1)*jumpReach;
      x = Math.max(16, Math.min(VW-w-16, x));
    }
    prevX = x;
    const plat = {
      x, y, w, h:14, type, index:i, alive:true,
      crumbleTimer:-1,
      baseX:x, phase:Math.random()*6.28, mSpeed:.6+Math.random()*.9, mRange:30+Math.random()*50
    };
    S.platforms.push(plat);
    if(type==='moving') S.moving.push(plat);
    if(type==='crumble') S.crumble.push(plat);
    if(type==='spike') S.spikes.push({plat, active:true});
    if(type==='obstacle') S.obstacles.push({plat, angle:Math.random()*6.28});
  }
  // final platform
  S.platforms.push({ x:VW/2-45, y:START_Y - TOTAL*SPACING, w:90, h:18, type:'final', index:TOTAL, alive:true });
}
/* =========================================================
   PLAYER
   ========================================================= */
const PW=22, PH=30;
const GRAV=0.62, MAXCHARGE=58, MINJ=5.2, MAXJ=17.5;
function resetPlayer(){
  const p0 = S.platforms[0];
  S.player = {
    x: p0.x + p0.w/2 - PW/2,
    y: p0.y - PH,
    vx:0, vy:0,
    onGround:true, plat:p0,
    facing:1, sliding:false, slideVx:0
  };
  S.cameraY = S.player.y - VH*0.6;
  S.cameraTargetY = S.cameraY;
  S.jumpCharging=false; S.chargePower=0;
  S.invuln=0; S.shieldHits=0; S.moon=false; S.cloud=false; S.darkFog=0;
  S.gustTimer=0; S.lightningTimer=0; S.quakeTimer=0; S.rockTimer=0;
  S.rocks=[]; S.particles=[];
  S.eventTimer=0; S.eventType=null; S.eventText=''; S.eventDanger=false;
  S.success=false; S.epochCooldown=60;
}
function fullReset(){
  generateWorld();
  // reset moving/crumble states
  for(const p of S.platforms){ p.alive=true; p.crumbleTimer=-1; p.phase=Math.random()*6.28; }
  resetPlayer();

   EVENTS
   ========================================================= */
const DANGER = [
  {id:'gust', text:'돌풍이 불어옵니다!'},
  {id:'rocks', text:'낙석이 떨어집니다!'},
  {id:'lightning', text:'번개가 내리칩니다!'},
  {id:'quake', text:'지진이 발판을 흔듭니다!'},
  {id:'fog', text:'암흑 안개: 점프 약화'}
];
const LUCKY = [
  {id:'moon', text:'달빛 저중력!'},
  {id:'shield', text:'별빛 보호막!'},
  {id:'cloud', text:'구름 가속!'},
  {id:'heaven', text:'천상의 발판!'}
];
function triggerEvent(){
  const danger = Math.random()<0.55;
  const list = danger?DANGER:LUCKY;
  const e = list[(Math.random()*list.length)|0];
  S.eventType=e.id; S.eventText=e.text; S.eventDanger=danger;
  S.eventDuration=300; S.eventTimer=S.eventDuration;
  if(e.id==='shield') S.shieldHits=2;
  else if(e.id==='moon') S.moon=true;
  else if(e.id==='cloud') S.cloud=true;
  else if(e.id==='heaven'){ S.moon=true; S.shieldHits=2; }
  else if(e.id==='fog') S.darkFog=240;
  else if(e.id==='gust'){ S.gustTimer=180; S.gustDir=Math.random()<.5?-1:1; }
  else if(e.id==='lightning') S.lightningTimer=70;
  else if(e.id==='quake') S.quakeTimer=120;
  else if(e.id==='rocks') S.rockTimer=12;
}
function updateEvents(){
  if(S.eventTimer>0){
    S.eventTimer--;
    if(S.eventTimer<=0){
      S.eventType=null; S.eventText=''; S.eventDanger=false;
      S.moon=false; S.cloud=false; S.shieldHits=0; S.darkFog=0;
    }
  }
  // random spawn chance
  if(S.eventTimer<=0 && !S.success){
    if(Math.random()<0.0011) triggerEvent();
  }
  if(S.gustTimer>0){ S.gustTimer--; if(S.player && !S.player.onGround) S.player.vx += S.gustDir*0.16; }
  if(S.lightningTimer>0){
    S.lightningTimer--;
    if(S.lightningTimer<=0){
      const lx = S.player.x + PW/2 + (Math.random()-.5)*200;
      S.particles.push({kind:'lightning', x:lx, life:14, max:14});
      if(Math.abs(lx-(S.player.x+PW/2))<55){ hurt(10, (Math.random()-.5)*9, -7); }
      S.lightningTimer = 55+Math.random()*55;
    }
  }
  if(S.quakeTimer>0){ S.quakeTimer--; S.shake=Math.max(S.shake,4); if(Math.random()<.09) S.player.vx += (Math.random()-.5)*3; }
  if(S.rockTimer>0){
    S.rockTimer--;
    if(S.rockTimer<=0){
      S.rocks.push({x:Math.random()*VW, y:S.cameraY-20, vx:(Math.random()-.5)*2, vy:2+Math.random()*2, r:6+Math.random()*6, life:200});
      S.rockTimer = 18+Math.random()*26;
    }
  }
  if(S.darkFog>0) S.darkFog--;
  if(S.invuln>0) S.invuln--;
  if(S.epochCooldown>0) S.epochCooldown--;
}
/* =========================================================
   PHYSICS
   ========================================================= */
function hurt(dmg,kx,ky){
  if(S.invuln>0) return;
  if(S.shieldHits>0){ S.shieldHits--; S.invuln=30; S.shake=6; return; }
  const p=S.player;
  p.vx=kx; p.vy=ky; p.onGround=false; p.plat=null;
  S.invuln=60; S.shake=8;
}
function updatePlayer(){
  if(!S.player || S.success) return;
  const p = S.player;
  const onIce = p.plat && p.plat.type==='ice';
  let move=0;
  if(S.keys.left||S.mobile.left) move-=1;
  if(S.keys.right||S.mobile.right) move+=1;
  if(p.onGround){
    if(p.sliding){
      p.vx = p.slideVx;
      p.slideVx *= 0.975;
      if(Math.abs(p.slideVx)<.2){ p.sliding=false; p.slideVx=0; }
    } else {
      const accel = onIce?0.28:0.85;
      if(move!==0){ p.vx += move*accel; p.facing=move; }
      else p.vx *= onIce?0.995:0.82;
    }
    const cap = onIce?12:6.2;
    p.vx = Math.max(-cap, Math.min(cap, p.vx));
  } else {
    if(move!==0){ p.vx += move*0.09; p.facing=move; }
    p.vx *= 0.996;
    p.vx = Math.max(-8, Math.min(8, p.vx));
  }
  if(S.jumpCharging) S.chargePower = Math.min(1, S.chargePower + 1/MAXCHARGE);
  let g = GRAV;
  if(S.moon) g*=0.5;
  if(S.darkFog>0) g*=0.85;
  if(!p.onGround) p.vy += g;
  p.x += p.vx; p.y += p.vy;
  if(p.x<0){ p.x=0; p.vx=0; }
  if(p.x>VW-PW){ p.x=VW-PW; p.vx=0; }
  // collisions
  p.onGround=false; p.plat=null;
  for(const plat of S.platforms){
    if(!plat.alive && plat.type!=='final') continue;
    const prevBottom = p.y + PH - p.vy;
    const withinX = p.x+PW > plat.x+3 && p.x < plat.x+plat.w-3;
    const crossing = prevBottom <= plat.y+2 && p.y+PH >= plat.y && p.y+PH <= plat.y+plat.h+Math.abs(p.vy)+3;
    if(withinX && crossing && p.vy>=0){
      p.y = plat.y - PH; p.vy=0; p.onGround=true; p.plat=plat;
      if(plat.type==='ice' && !p.sliding){ p.sliding=true; p.slideVx = p.vx*1.9 + p.facing*2.5; }
      if(plat.type==='crumble' && plat.crumbleTimer<0) plat.crumbleTimer=32;
      if(plat.type==='spike') hurt(15, (Math.random()-.5)*13, -9);
      if(plat.type==='final' && !S.success){ S.success=true; S.highest=Math.max(S.highest, Math.floor(-plat.y)); saveHigh(); }
      break;
    }
  }
  // moving platforms
  for(const mp of S.moving){
    mp.phase += mp.mSpeed*0.025;
    mp.x = mp.baseX + Math.sin(mp.phase)*mp.mRange;
    if(p.plat===mp && p.onGround) p.x += Math.cos(mp.phase)*mp.mSpeed*0.6;
  }
  // crumble
  for(const cp of S.crumble){
    if(cp.crumbleTimer>0){ cp.crumbleTimer--; if(cp.crumbleTimer<=0) cp.alive=false; }
  }
  // obstacles
  for(const o of S.obstacles){
    if(!o.plat.alive) continue;
    o.angle += 0.06;
    const ox = o.plat.x + o.plat.w/2;
    const oy = o.plat.y - 38;
    const dx = p.x+PW/2 - ox, dy = p.y+PH/2 - oy;
    if(Math.abs(dx)<20 && Math.abs(dy)<20){ hurt(12, dx>0?6:-6, -6); }
  }
  // rocks
  for(let i=S.rocks.length-1;i>=0;i--){
    const r=S.rocks[i]; r.x+=r.vx; r.y+=r.vy; r.vy+=0.16; r.life--;
    const dx=p.x+PW/2-r.x, dy=p.y+PH/2-r.y;
    if(Math.abs(dx)<r.r+9 && Math.abs(dy)<r.r+9){ hurt(12, dx>0?5:-5, -6); S.rocks.splice(i,1); continue; }
    if(r.life<=0) S.rocks.splice(i,1);
  }
  // fell off world
  if(p.y > S.cameraY + VH + 300 || p.y > START_Y + 900){
    resetPlayer(); S.shake=12;
  }
  // highest tracking
  const hgt = Math.floor(-p.y);
  if(hgt > S.highest){ S.highest=hgt; saveHigh(); }
  // camera
  S.cameraTargetY = p.y - VH*0.55;
  S.cameraY += (S.cameraTargetY - S.cameraY)*0.11;
  // particles
  for(let i=S.particles.length-1;i>=0;i--){ S.particles[i].life--; if(S.particles[i].life<=0) S.particles.splice(i,1); }
  if(S.shake>0) S.shake*=0.9; if(S.shake<0.4) S.shake=0;
}
function saveHigh(){ try{ localStorage.setItem(HIGH_KEY, String(S.highest)); }catch(e){} }
/* =========================================================
   JUMP
   ========================================================= */
function startCharge(){
  if(!S.player || S.success) return;
  if(!S.player.onGround && !S.player.sliding) return;
  S.jumpCharging=true; S.chargePower=0;
}
function releaseCharge(){
  if(!S.jumpCharging) return;
  S.jumpCharging=false;
  const p=S.player;
  if(!p || S.success){ S.chargePower=0; return; }
  if(!p.onGround && !p.sliding){ S.chargePower=0; return; }
  // 3% epoch return
  if(Math.random()<0.03 && S.epochCooldown<=0){ doEpochReturn(); return; }
  let power = MINJ + (MAXJ-MINJ)*S.chargePower;
  if(S.cloud) power*=1.42;
  if(S.moon) power*=1.18;
  if(S.darkFog>0) power*=0.7;
  const f = p.facing||1;
  p.vx = f*power*0.66*(0.6+S.chargePower*0.45);
  p.vy = -power;
  p.onGround=false; p.sliding=false; p.plat=null;
  S.chargePower=0;
  S.epochCooldown=25;
  for(let i=0;i<5;i++) S.particles.push({kind:'dust', x:p.x+PW/2+(Math.random()-.5)*10, y:p.y+PH, vx:(Math.random()-.5)*3, vy:Math.random()*2, life:12, max:12});
}
function doEpochReturn(){
  fullReset();
  S.shake=16; S.epochCooldown=180;
  S.toast='★ 태초 귀환 ★'; S.toastTimer=120;
  for(let i=0;i<40;i++) S.particles.push({kind:'burst', x:VW/2+(Math.random()-.5)*420, y:S.cameraY+VH/2+(Math.random()-.5)*420, vx:(Math.random()-.5)*11, vy:(Math.random()-.5)*11, life:40, max:40, col:Math.random()<.5?'#ff66ff':'#66ffff'});
}

/* --- touch helpers --- */
function getBtnRect(which){
  const scale = SET.btnScale;
  const size = 66*scale;
  const baseY = VH - size - 34 + (SET.layout==='left'&&which==='right'?0:0);
  let x;
  if(SET.layout==='left'){
    if(which==='left') x=24;
    else if(which==='right') x=24+size+18;
    else x=VW-size-30;
  } else if(SET.layout==='right'){
    if(which==='jump') x=VW-size-30;
    else if(which==='right') x=VW-size*2-48;
    else x=VW-size*3-66;
  } else {
    if(which==='left') x=24;
    else if(which==='right') x=24+size+20;
    else x=VW-size-30;
  }
  const offX = which==='left'?SET.leftX:which==='right'?SET.rightX:SET.jumpX;
  const offY = which==='left'?SET.leftY:which==='right'?SET.rightY:SET.jumpY;
  return { x:x+offX, y:baseY+offY, w:size, h:size };
}
function canvasPos(ev){
  const r = cv.getBoundingClientRect();
  const t = ev.changedTouches?ev.changedTouches[0]:ev;
  return { x:(t.clientX-r.left)/r.width*VW, y:(t.clientY-r.top)/r.height*VH };
}
function inside(pt,r){ return pt.x>=r.x&&pt.x<=r.x+r.w&&pt.y>=r.y&&pt.y<=r.y+r.h; }
function onDown(ev){
  ev.preventDefault();
  if(ev.pointerId===undefined && ev.changedTouches) ev.pointerId = ev.changedTouches[0].identifier;
  const pt = canvasPos(ev);
  if(S.screen==='title'){
    for(const b of S.titleHit) if(inside(pt,b)){
      if(b.action==='start'){ fullReset(); S.screen='game'; }
      else if(b.action==='settings'){ S.screen='settings'; }
      return;
    }
  }
  else if(S.screen==='settings'){
    for(const b of S.settingsHit){
      if(inside(pt,b)){
        if(b.action==='back') S.screen='title';
        else if(b.action==='size'){ SET.btnScale = SET.btnScale>=1.5?0.8:+(SET.btnScale+0.1).toFixed(1); saveSettings(); }
        else { SET.layout=b.action; saveSettings(); }
        return;
      }
    }
  }
  else if(S.screen==='success'){
    for(const b of S.successHit) if(inside(pt,b)){ fullReset(); S.screen='game'; return; }
  }
  else if(S.screen==='pause'){
    if(inside(pt,{x:VW/2-100,y:VH/2-30,w:200,h:50})){ S.screen='game'; return; }
    if(inside(pt,{x:VW/2-100,y:VH/2+40,w:200,h:50})){ clearInput(); S.screen='title'; return; }
  }
  else if(S.screen==='game'){
    // pause button
    if(inside(pt,S.pauseBtnRect)){ clearInput(); S.screen='pause'; return; }
    const role = roleAt(pt);
    if(!role) return;
    ptrs[ev.pointerId] = role;
    if(role==='jump'){ S.mobile.jump=true; startCharge(); }
    else syncMobile();
  }
}
function onUp(ev){
  if(ev.pointerId===undefined && ev.changedTouches) ev.pointerId = ev.changedTouches[0].identifier;
  const role = ptrs[ev.pointerId];
  if(role===undefined) return;
  ev.preventDefault();
  delete ptrs[ev.pointerId];
  if(role==='jump'){
    S.mobile.jump=false;
    if(S.screen==='game') releaseCharge();
  } else syncMobile();
}
function roleAt(pt){
  if(inside(pt,getBtnRect('jump'))) return 'jump';
  if(inside(pt,getBtnRect('left'))) return 'left';
  if(inside(pt,getBtnRect('right'))) return 'right';
  return null;
}
function syncMobile(){
  const v=Object.keys(ptrs).map(k=>ptrs[k]);
  S.mobile.left=v.indexOf('left')>=0;
  S.mobile.right=v.indexOf('right')>=0;
}
function clearInput(){
  for(const k in ptrs) delete ptrs[k];
  S.mobile.left=false; S.mobile.right=false; S.mobile.jump=false;
  S.jumpCharging=false; S.chargePower=0;
  S.keys.left=false; S.keys.right=false; S.keys.jump=false;
}
const ptrs={};
cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('pointerleave', onUp);
cv.addEventListener('contextmenu', e=>e.preventDefault());
/* =========================================================
   RENDER
   ========================================================= */
function drawBgWorld(){
  const camY = S.cameraY;
  // valley below start
  const drawValley = (START_Y + 900) - camY; // top-left of valley sheet in screen space
  // Valley sheet covers from START_Y upward? We want valley under start: START_Y..START_Y+900 (downwards)
  // Draw valley sheet anchored so its top aligns with START_Y-camY, height 900
  const vTop = START_Y - camY;
  ctx.drawImage(BG.valley, 0, vTop, VW, 900);
  // zones stacked upward from START_Y
  for(const z of ZONES){
    if(z.below) continue;
    const zBottom = START_Y - z.start*SPACING;
    const zTop = START_Y - z.end*SPACING;
    const screenTop = zTop - camY;
    const screenH = zBottom - zTop;
    if(screenTop+screenH > -10 && screenTop < VH+10){
      ctx.drawImage(BG[z.bg], 0, screenTop, VW, screenH);
    }
  }
}
function drawPlatforms(){
  const camY = S.cameraY;
  for(const p of S.platforms){
    if(!p.alive && p.type!=='final') continue;
    const sy = p.y - camY;
    if(sy>VH+40 || sy<-40) continue;
    let col='#4a9a4a', top='#6aca6a';
    if(p.type==='ice'){ col='#3a7ac0'; top='#aaddff'; }
    else if(p.type==='spike'){ col='#8a3434'; top='#b85555'; }
    else if(p.type==='moving'){ col='#8a7a3a'; top='#b8a85a'; }
    else if(p.type==='crumble'){ col='#6a6a6a'; top='#8a8a8a'; }
    else if(p.type==='final'){ col='#b8860b'; top='#ffd700'; }
    let sx = p.x;
    if(p.type==='crumble' && p.crumbleTimer>0) sx += (Math.random()-.5)*4;
    ctx.fillStyle=col; ctx.fillRect(sx,sy,p.w,p.h);
    ctx.fillStyle=top; ctx.fillRect(sx,sy,p.w,4);
    if(p.type==='ice'){
      ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fillRect(sx+8,sy+2,3,3); ctx.fillRect(sx+p.w-14,sy+7,2,2);
    }
    if(p.type==='spike'){
      ctx.fillStyle='#ff5555';
      for(let sx2=sx+6; sx2<sx+p.w-6; sx2+=9){
        ctx.beginPath(); ctx.moveTo(sx2,sy); ctx.lineTo(sx2+4.5,sy-8); ctx.lineTo(sx2+9,sy); ctx.fill();
      }
    }
    if(p.type==='final'){
      ctx.fillStyle='#fff3a0'; ctx.font='bold 12px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('★ 정상 ★', sx+p.w/2, sy-14);
    }
  }
  // obstacles
  for(const o of S.obstacles){
    if(!o.plat.alive) continue;
    const sy = o.plat.y - camY - 38;
    if(sy<-40||sy>VH+40) continue;
    ctx.save(); ctx.translate(o.plat.x+o.plat.w/2, sy); ctx.rotate(o.angle);
    ctx.fillStyle='#aa3333'; ctx.fillRect(-10,-10,20,20);
    ctx.fillStyle='#ff6666'; ctx.fillRect(-6,-6,12,12);
    ctx.restore();
  }
}
function drawPlayer(){
  if(!S.player || S.success) return;
  const p = S.player;
  const sy = p.y - S.cameraY;
  if(S.invuln>0 && Math.floor(S.invuln/4)%2===0) return;

function drawEventCard(){

function drawMobileButtons(){
  const l=getBtnRect('left'), r=getBtnRect('right'), j=getBtnRect('jump');
  drawGemArrow(l,'left');

  drawGemJump(j);
}
function drawGemArrow(rect, dir){
  const s=rect.w;
  ctx.fillStyle='#0d2447'; ctx.fillRect(rect.x,rect.y,s,s);
  ctx.fillStyle='#1d4a8a'; ctx.fillRect(rect.x+s*.06,rect.y+s*.06,s*.88,s*.88);
  ctx.fillStyle='#3a78d8'; ctx.fillRect(rect.x+s*.13,rect.y+s*.13,s*.74,s*.74);
  ctx.fillStyle='rgba(120,200,255,.55)'; ctx.fillRect(rect.x+s*.13,rect.y+s*.13,s*.74,s*.18);
  ctx.fillStyle='#e8f4ff';
  const cx=rect.x+s/2, cy=rect.y+s/2, aw=s*.22, ah=s*.26;
  ctx.beginPath();
  if(dir==='left'){ ctx.moveTo(cx+aw*.6,cy-ah); ctx.lineTo(cx-aw*.7,cy); ctx.lineTo(cx+aw*.6,cy+ah); }
  else { ctx.moveTo(cx-aw*.6,cy-ah); ctx.lineTo(cx+aw*.7,cy); ctx.lineTo(cx-aw*.6,cy+ah); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(180,225,255,.8)'; ctx.lineWidth=2; ctx.strokeRect(rect.x+1,rect.y+1,s-2,s-2);
}
function drawGemJump(rect){
  const s=rect.w;
  ctx.fillStyle='#5a3200'; ctx.fillRect(rect.x,rect.y,s,s);
  ctx.fillStyle='#c47a00'; ctx.fillRect(rect.x+s*.06,rect.y+s*.06,s*.88,s*.88);
  ctx.fillStyle='#ffb020'; ctx.fillRect(rect.x+s*.13,rect.y+s*.13,s*.74,s*.74);
  ctx.fillStyle='#ffe680'; ctx.fillRect(rect.x+s*.22,rect.y+s*.22,s*.56,s*.56);
  ctx.fillStyle='#ff8800'; ctx.fillRect(rect.x+s*.32,rect.y+s*.32,s*.36,s*.36);
  ctx.fillStyle='#fff'; ctx.font='bold '+(s*.34)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('↑', rect.x+s/2, rect.y+s/2);
  ctx.strokeStyle='rgba(255,220,120,.9)'; ctx.lineWidth=2; ctx.strokeRect(rect.x+1,rect.y+1,s-2,s-2);
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastT=0;
function loop(t){
  if(!lastT) lastT=t;
  lastT=t;
  S.time++;
  if(S.screen==='game'){
    updateEvents();
    updatePlayer();
    if(S.success) S.screen='success';
  }
  // render
  if(S.screen==='title') renderTitle();
  else if(S.screen==='game') renderGame();
  else if(S.screen==='pause') renderPause();
  else if(S.screen==='settings') renderSettings();
  else if(S.screen==='success') renderSuccess();
  requestAnimationFrame(loop);
}
// init world & go
generateWorld();
resetPlayer();
requestAnimationFrame(loop);
/* Prevent page scroll on space/arrows mobile */
document.addEventListener('touchmove', e=>{ if(S.screen==='game') e.preventDefault(); }, {passive:false});
